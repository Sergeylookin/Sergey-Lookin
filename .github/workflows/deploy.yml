name: Build & deploy to GitHub Pages

# One-button deploy: push to main (e.g. via GitHub Desktop) → this builds the site
# (minify + build-pages + build-en) and publishes it to GitHub Pages automatically.
# You never need to run the build or keep node_modules locally.

on:
  push:
    branches: [main]
  workflow_dispatch:        # also runnable by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let the newest push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build          # minify + build-pages + build-en
      # Assemble a clean site folder — exclude dev-only files from what gets published.
      - run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='node_modules' \
            --exclude='_site' --exclude='tools' \
            --exclude='package.json' --exclude='package-lock.json' --exclude='.gitignore' \
            ./ _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true          # auto-switch Pages source to "GitHub Actions"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
