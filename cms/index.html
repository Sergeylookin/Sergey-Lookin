<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS · Портфолио</title>
<!-- Иконка вкладки. Без неё браузер просил /favicon.ico и получал 404 —
     мусор в консоли, среди которого потом не видно настоящих ошибок. -->
<link rel="icon" href="/assets/favicon-dark.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0b0b0d; --panel:#131316; --line:#26262b; --ink:#e8e8ea; --mute:#8a8a93;
  --accent:#e2543a; --ok:#4a9d6a; --warn:#c9973f;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"Inter Tight",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:#0e0e11;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:#4a4a55}
/* Превью по умолчанию берёт всё, что остаётся после колонки полей в 640 px, но не больше,
   чем нужно десктопному кадру в полный размер (1440 + рамка и поля): при 100 %
   кадр не проходит через масштабирование и текст в нём остаётся резким. */
.app{display:grid;grid-template-columns:210px minmax(340px,1fr) 6px minmax(320px,var(--prevw,clamp(360px,calc(100vw - 856px),1476px)));height:100vh}
/* Граница между полями и превью двигается мышкой: иногда важнее видеть текст,
   иногда — сайт целиком. Ширина запоминается. */
.grip{cursor:col-resize;background:var(--line);position:relative}
.grip::after{content:"";position:absolute;inset:0 -4px;}
.grip:hover,.grip.drag{background:var(--ink)}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe{pointer-events:none}

/* ── левая колонка ── */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:14px 16px;border-bottom:1px solid var(--line);font:600 13px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.brand small{display:block;color:var(--mute);font-weight:400;letter-spacing:.04em;text-transform:none;margin-top:3px}
.cases{overflow:auto;flex:1 1 auto;min-height:180px;padding:6px}
.case{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:6px;color:var(--mute);line-height:1.3}
.case:hover{background:#1b1b1f;color:var(--ink)}
.case.on{background:#1f1f24;color:var(--ink)}
.case b{display:block;font-weight:600;font-size:13px}
.case span{font:11px var(--mono);opacity:.65}
.sidefoot{border-top:1px solid var(--line);padding:10px;display:grid;gap:6px}
.grouphead{flex:none;padding:9px 16px 5px;border-top:1px solid var(--line);font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#5c5c66}
.pages{padding:4px 6px 8px;flex:none;overflow:auto}
.pg{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--mute);font-size:13px}
.pg:hover{background:#1b1b1f;color:var(--ink)}
.pg.on{background:#1f1f24;color:var(--ink)}

/* ── центр ── */
.main{overflow:auto;min-height:0;padding:0 0 80px}
.bar{position:sticky;top:0;z-index:5;background:rgba(11,11,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 20px;min-height:59px;display:flex;gap:10px;align-items:center}
.bar h1{margin:0;font-size:15px;font-weight:600;flex:1}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:#17171b;font-size:13px}
.btn:hover{border-color:#43434e}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default}
.sec{padding:18px 20px;border-bottom:1px solid var(--line)}
/* 1. полоска разделов: форма кейса в 60+ экранов, без неё не найти нужное */
.secnavbox{position:sticky;top:var(--barh,59px);z-index:4;background:rgba(11,11,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.secnavbox::before,.secnavbox::after{content:"";position:absolute;top:0;bottom:0;width:52px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1}
.secnavbox::before{left:0;background:linear-gradient(90deg,var(--bg) 25%,transparent)}
.secnavbox::after{right:0;background:linear-gradient(270deg,var(--bg) 25%,transparent)}
.secnavbox.more-l::before,.secnavbox.more-r::after{opacity:1}
.secnav{position:relative;display:flex;gap:2px;overflow-x:auto;padding:7px 20px;scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav button{flex:none;padding:5px 10px;border-radius:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.secnav button:hover{background:#1b1b1f;color:var(--ink)}
.secnav button.on{background:#1f1f24;color:var(--ink)}
.secnav .n{font:10px var(--mono);opacity:.6;margin-left:5px}
/* «Свернуть все» стоит справа от полоски и не уезжает вместе с ней */
.secnavbox{display:flex;align-items:center}
.secnav{flex:1;min-width:0}
.secnavbox::after{right:var(--foldw,0px)}
.foldall{flex:none;margin:0 14px 0 4px;padding:5px 10px;border-radius:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.foldall:hover{background:#1b1b1f;color:var(--ink)}
.sec>h2{cursor:pointer;user-select:none;display:flex;align-items:center;gap:7px}
.sec>h2::before{content:'▾';font-size:9px;opacity:.5;transition:transform .15s}
.sec.folded>h2::before{transform:rotate(-90deg)}
.sec.folded>*:not(h2){display:none!important}   /* у части блоков display задан прямо в разметке */
/* 2. счётчик замечаний в шапке — раньше они висели на 5000 px ниже */
.chkbadge{display:none;align-items:center;gap:6px;padding:5px 11px;border-radius:6px;font-size:12.5px;
  border:1px solid var(--warn);color:var(--warn);background:rgba(201,151,63,.08)}
.chkbadge.on{display:inline-flex}
.chkbadge.err{border-color:var(--accent);color:var(--accent);background:rgba(226,84,58,.08)}
.chkpop{position:fixed;z-index:30;width:min(520px,72vw);max-height:52vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
/* 3. восстановление черновика */
.draftbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:rgba(201,151,63,.1);
  border-bottom:1px solid var(--warn);font-size:12.5px;color:#e7d9bd}
.draftbar .sp{flex:1}
.draftbar button{padding:5px 11px;border-radius:6px;border:1px solid var(--warn);color:var(--warn);font-size:12px}
.draftbar button.no{border-color:var(--line);color:var(--mute)}
/* 4. подсветка блока, который правишь */
.f.editing>label{color:var(--ink)}
.savecount{font:10px var(--mono);opacity:.75;margin-left:5px}
/* Поле с оформлением: человек видит текст, а не теги. Жирное — жирным,
   подсвеченное число — подсвеченным. Разметка живёт под капотом. */
.rf{font:inherit;color:var(--ink);background:#0e0e11;border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;width:100%;min-height:38px;white-space:pre-wrap;word-break:break-word;line-height:1.5;outline:0}
.rf:focus{border-color:#4a4a55;background:#121216}
.rf:empty::before{content:attr(data-ph);color:#4d4d57}
.rf b,.rf strong{font-weight:700;color:#fff}
.rf em{font-style:italic}
.rf span.num{color:var(--accent);font-weight:600;background:rgba(226,84,58,.1);border-radius:3px;padding:0 3px}
.rf--one{min-height:0}
.rtool{position:fixed;z-index:110;display:flex;gap:2px;padding:3px;border-radius:8px;
  background:#22222a;border:1px solid #3a3a44;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.rtool button{padding:4px 9px;border-radius:5px;font-size:12px;color:#dcdce2;white-space:nowrap}
.rtool button:hover{background:#32323c}
.rtool b{font-weight:700}
.rtool .nm{color:var(--accent);font-weight:600}
.rhint{font-size:11px;color:#5c5c66;margin-top:4px}
/* 8. поиск по кейсам */
.findbox{padding:8px 10px 4px}
.findbox input{font-size:12.5px;padding:6px 9px}
/* 7. метка недопереведённого кейса */
.entag{display:inline-block;margin:5px 0 0;padding:1px 6px;border-radius:4px;border:1px solid var(--warn);
  color:var(--warn);font:normal 10.5px var(--mono);letter-spacing:.04em}
.entag:hover{background:rgba(201,151,63,.14)}
/* сколько сохранённого ещё не на сайте — на кнопке публикации */
.pubn{display:inline-block;min-width:18px;margin-left:7px;padding:0 6px;border-radius:9px;background:rgba(0,0,0,.3);font:600 11px/1.6 var(--mono)}
/* 6. отмена отдельного поля */
.f.dirty>label::after{content:'изменено';font:10.5px var(--mono);color:var(--warn);letter-spacing:.05em}
.undo1{margin-left:auto;padding:1px 7px;border-radius:4px;border:1px solid var(--line);
  color:var(--mute);font-size:11px}
.undo1:hover{border-color:var(--accent);color:var(--accent)}
/* 9. сортировка медиатеки */
.mlbar .sortbtn{padding:5px 10px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--mute);background:#17171b}
.mlbar .sortbtn.on{border-color:#4a4a55;color:var(--ink)}
.mcard--heavy .mcard__m{color:var(--warn)}
/* 10. полоса состояния публикации */
.deploybar{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:12.5px;
  background:#141418;border-bottom:1px solid var(--line);color:#c2c2c8}
.deploybar .dot2{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;animation:pulse 1.1s infinite}
.deploybar.ok .dot2{background:var(--ok);animation:none}
.deploybar.bad .dot2{background:var(--accent);animation:none}
.deploybar a{color:var(--ink)}
.deploybar .sp{flex:1}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sec>h2{margin:0 0 12px;font:600 11px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--mute)}
.f{margin-bottom:13px}
.f>label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-bottom:5px}
.i{width:15px;height:15px;border-radius:50%;border:1px solid #3a3a44;color:var(--mute);font:600 10px/13px var(--mono);text-align:center;flex:none}
.i:hover{border-color:var(--accent);color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .lang{font:10px var(--mono);color:#5c5c66;letter-spacing:.1em;margin-bottom:3px}
.opt{color:#5c5c66}

/* ── медиа ── */
.media{display:grid;gap:8px}
.row-m{border:1px solid var(--line);border-radius:8px;padding:9px;background:#0e0e11}
.row-m .head{display:flex;gap:8px;align-items:center;margin-bottom:7px;font:11px var(--mono);color:var(--mute)}
.row-m .head b{color:var(--ink);font-weight:600}
.row-m .head .sp{flex:1}
.mi{display:grid;grid-template-columns:64px 1fr;gap:9px;align-items:start;margin-top:7px}
.mi img{width:64px;height:44px;object-fit:cover;border-radius:4px;background:#000;border:1px solid var(--line)}
.x{padding:2px 7px;border-radius:4px;border:1px solid var(--line);font-size:11px;color:var(--mute)}
.x:hover{border-color:var(--accent);color:var(--accent)}
.locked{opacity:.55;font:11px var(--mono);color:var(--mute)}
.drop{border:1px dashed #3a3a44;border-radius:8px;padding:16px;text-align:center;color:var(--mute);font-size:12px}
.drop.hot{border-color:var(--accent);color:var(--accent)}
.drop--new{margin-top:9px;padding:20px;border-style:dashed;border-width:2px;line-height:1.55}
.drop--new b{color:var(--ink);font-size:13px}
.drop:hover{border-color:#55555f;color:#b9b9c2}
/* блок медиа: показываем раскладку так, как она встанет на странице */
.mb{border:1px solid var(--line);border-radius:9px;background:#0e0e11;margin-bottom:9px;overflow:hidden}
.mb__bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--mute)}
.mb__bar .grab{cursor:grab;opacity:.6;letter-spacing:-1px}
.mb__bar b{color:var(--ink);font:600 11px var(--sans);letter-spacing:0}
.mb__bar .sp{flex:1}
.mb__body{display:grid;gap:8px;padding:9px}
.mb--row .mb__body{grid-template-columns:1fr 1fr}
.slot{position:relative;border-radius:6px;overflow:hidden;background:#000;border:1px solid var(--line)}
.slot__img{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;cursor:zoom-in}
.mb--row .slot__img{aspect-ratio:1/1}
.slot__empty{display:grid;place-items:center;width:100%;aspect-ratio:16/8;color:#5c5c66;font-size:12px;background:#141418}
.mb--row .slot__empty{aspect-ratio:1/1}
.slot__acts{position:absolute;top:6px;right:6px;display:flex;gap:5px;opacity:0;transition:opacity .15s}
.slot:hover .slot__acts{opacity:1}
.slot__acts button{background:rgba(12,12,15,.86);border:1px solid #3a3a44;border-radius:5px;padding:3px 8px;font-size:11px;color:var(--ink);backdrop-filter:blur(4px)}
.slot__acts button:hover{border-color:var(--accent);color:var(--accent)}
.slot__meta{display:flex;gap:7px;align-items:center;padding:6px 8px;font:10.5px var(--mono);color:var(--mute);background:#141418;border-top:1px solid var(--line)}
.slot__meta .nm{color:#b9b9c2}
.slot__meta .sp{flex:1}
.slot__meta .warn{color:var(--warn)}
.slot.hot{outline:2px solid var(--accent);outline-offset:-2px}
.slot__alt{width:100%;border:0;border-top:1px solid var(--line);border-radius:0;background:#0e0e11;font-size:12px;padding:7px 9px}
.slot__alt::placeholder{color:#4d4d57}
.slot__alt:focus{border-color:transparent;background:#141418}
.mb--drag{opacity:.35}
/* просмотр картинки во весь экран */
.lb{position:fixed;inset:0;z-index:120;background:rgba(6,6,8,.93);display:grid;grid-template-rows:auto 1fr auto;padding:16px 20px}
.lb__top{display:flex;align-items:center;gap:12px;color:var(--ink);font-size:13px}
.lb__top .sp{flex:1}
.lb__wrap{display:grid;place-items:center;overflow:auto;padding:12px 0}
.lb img{max-width:100%;max-height:100%;border-radius:8px;background:#000}
.lb__bottom{display:flex;gap:9px;align-items:center;justify-content:center;font:11px var(--mono);color:var(--mute)}
.fmt__box{max-width:520px;width:100%}
.fmt__lead{color:var(--ink);font-size:14px;line-height:1.5;margin:0 0 16px}
.fmt__opt{display:block;width:100%;text-align:left;margin:0 0 10px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
.fmt__opt:hover{border-color:var(--ink)}
.fmt__opt b{display:block;font-size:14px;margin-bottom:3px}
.fmt__opt i{display:block;font:12px var(--mono);font-style:normal;color:var(--ink);opacity:.85}
.fmt__opt u{display:block;text-decoration:none;font-size:12px;color:var(--mute);margin-top:5px;line-height:1.45}
.cvrow{display:grid;grid-template-columns:1fr auto;gap:9px 10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:11px;background:#0e0e11;margin-bottom:8px}
.cvrow .cvdrop{grid-column:1/-1}
.cvacts{display:flex;gap:7px}
a.btn{display:inline-block;text-decoration:none;white-space:nowrap;color:inherit}
.cvrow b{font-size:13px}
.cvmeta{font:11px var(--mono);color:var(--mute);margin-top:3px}
.cvdrop{padding:10px;font-size:11.5px;margin:0}
/* медиатека */
.mlbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mlbar input{max-width:230px}
.mlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-radius:9px;background:#0e0e11;overflow:hidden;display:flex;flex-direction:column}
.mcard.hot{outline:2px solid var(--accent);outline-offset:-2px}
.mcard__img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#000;cursor:zoom-in;display:block}
.mcard__b{padding:8px 9px;display:flex;flex-direction:column;gap:5px;flex:1}
.mcard__n{font:11px var(--mono);color:#d2d2d8;word-break:break-all}
.mcard__m{font:10.5px var(--mono);color:var(--mute)}
.mcard__u{font-size:11.5px;line-height:1.45;color:var(--mute);border-top:1px solid var(--line);padding-top:6px;margin-top:auto}
.mcard__u b{color:#b9b9c2;font-weight:500}
.mcard__free{color:var(--warn)}
.mcard__acts{display:flex;gap:5px;padding:0 9px 9px}
.mcard__acts button{flex:1;padding:5px 6px;border:1px solid var(--line);border-radius:5px;font-size:11.5px;color:var(--mute);background:#17171b}
.mcard__acts button:hover{border-color:var(--accent);color:var(--accent)}
/* компании и бренды */
.co-ed{border:1px solid var(--line);border-radius:9px;background:#0e0e11;padding:11px;margin-bottom:9px}
.co-ed__top{display:grid;grid-template-columns:130px 1fr;gap:8px;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 11px;font-size:12.5px;background:#0e0e11}
.chip button{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);color:var(--mute);font-size:11px;line-height:1}
.chip button:hover{border-color:var(--accent);color:var(--accent)}
/* история */
.hrow{display:grid;grid-template-columns:74px 108px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#0e0e11;margin-bottom:6px;font-size:12.5px}
.hrow .hh{font:11px var(--mono);color:var(--mute)}
.hrow .hd{font:11px var(--mono);color:var(--mute)}
.hrow.live{border-color:#2f5d43}
.hnow{font:10px var(--mono);color:var(--ok);letter-spacing:.06em}

/* ── превью ── */
.prev{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.prev .bar{border-bottom:1px solid var(--line);background:none;backdrop-filter:none}
/* Сцена превью. Кадру всегда даётся НАСТОЯЩИЙ размер экрана устройства — и ширина,
   и высота. Без настоящей ширины сайт не переключит медиазапросы и покажет не ту
   вёрстку; без настоящей высоты первый экран и всё, что считается от высоты окна,
   растягивается — и превью врёт. Поэтому кадр не сплющиваем и не вытягиваем, а
   уменьшаем целиком, как «зум» в инструментах браузера.
   Рамка стоит на неподвижной обёртке: на самом кадре она уменьшалась бы вместе с
   ним до долей пикселя и рисовалась бы рваной. */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;background:var(--bg);padding:14px 0}
.devbox{flex:none;box-sizing:content-box;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.stage iframe{display:block;transform-origin:top left;border:0;background:var(--bg)}
.devnote{font:11px var(--mono);color:var(--mute);margin-right:10px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:5px 11px;font:11px var(--mono);color:var(--mute)}
.seg button.on{background:#1f1f24;color:var(--ink)}
.seg--wide{display:grid;grid-template-columns:repeat(3,1fr)}
.seg--wide button{padding:7px 4px;font-size:11.5px;font-family:var(--sans);letter-spacing:0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.case--off b{opacity:.6}
.badge{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mute);vertical-align:middle}
.badge--published{display:none}
.badge--hidden{color:var(--warn);border-color:var(--warn)}

/* ── проверки ── */
.checks{display:grid;gap:6px}
#secChecks>h2{cursor:default}
#secChecks>h2::before{display:none}
.chk{display:flex;gap:8px;padding:8px 10px;border-radius:6px;font-size:12.5px;line-height:1.45;background:#141418;border-left:2px solid var(--line)}
.chk.err{border-left-color:var(--accent)} .chk.warn{border-left-color:var(--warn)} .chk.info{border-left-color:#3d5a80}
.chk .n{font:11px var(--mono);color:var(--mute);flex:none}
.empty{color:var(--ok);font-size:12.5px}

/* ── модалки ── */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:28px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal header h3{margin:0;font-size:15px;flex:1}
.tabs{display:flex;gap:2px;padding:10px 20px 0}
.tabs button{padding:7px 13px;border-radius:6px 6px 0 0;font-size:13px;color:var(--mute)}
.tabs button.on{background:#1b1b20;color:var(--ink)}
.modal .body{padding:16px 20px 22px;overflow:auto;background:#1b1b20}
.modal .body h4{margin:16px 0 7px;font-size:13px}
.modal .body h4:first-child{margin-top:0}
.modal .body p,.modal .body li{color:#c2c2c8;font-size:13px;line-height:1.62;margin:5px 0}
.modal .body code{font:12px var(--mono);background:#0e0e11;padding:1px 5px;border-radius:3px}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.tip{position:fixed;z-index:99;max-width:330px;background:#22222a;border:1px solid #383842;border-radius:7px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:#dcdce2;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#22222a;border:1px solid #383842;border-radius:8px;padding:10px 16px;font-size:13px;z-index:80}
.steps{display:grid;gap:5px;font:12px var(--mono)}
.steps div{display:flex;gap:8px}
.steps .m{color:var(--ok)} .steps .b{color:var(--accent)}

/* ══════ конструктор: всё, что добавлено поверх первой версии ══════ */

/* Скрытое — скрыто. Без этого правила блок с собственным display (полоса черновика,
   полоса публикации) оставался на экране пустой полоской, хотя стоял hidden. */
[hidden]{display:none!important}

/* панель над превью: кнопки не сжимаются и не обрезаются, а переносятся на вторую строку */
.prev .bar{flex-wrap:wrap;row-gap:7px}
.bar .seg{flex:none}
.seg button{white-space:nowrap}

/* боковая колонка: страницы сверху, кейсы в середине и только они прокручиваются */
.grouphead--first{border-top:0}
.side .pages{max-height:none}

/* поиск по сайту */
.findbox{position:relative}
.found{position:absolute;left:10px;top:calc(100% - 2px);z-index:40;width:min(440px,82vw);max-height:64vh;overflow:auto;
  background:#1b1b20;border:1px solid #3a3a44;border-radius:9px;box-shadow:0 14px 40px rgba(0,0,0,.55);padding:5px}
.found button{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:6px}
.found button:hover,.found button.on{background:#26262d}
.found .w{display:block;font:10.5px var(--mono);color:var(--mute);margin-bottom:2px}
.found .s{display:block;font-size:12.5px;color:#d2d2d8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.found mark{background:rgba(226,84,58,.3);color:#fff;border-radius:2px;padding:0 1px}
.found .none{padding:9px;color:var(--mute);font-size:12.5px}

/* поле: один язык на всю ширину, второй — строкой под ним */
.fl{min-width:0}
.oth{display:flex;gap:8px;align-items:baseline;width:100%;margin-top:5px;padding:2px 2px;text-align:left;font-size:12px;color:#6c6c76;border-radius:4px}
.oth:hover{color:var(--ink)}
.oth b{flex:none;font:600 10px var(--mono);letter-spacing:.1em;color:#5c5c66}
.oth span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oth.none span{color:var(--warn)}
.oth.stale::after{content:'не обновлён';flex:none;font:9px var(--mono);letter-spacing:.05em;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 5px}
.f.flash>label{color:var(--accent)}
.f.flash .rf{border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,84,58,.14)}
.f>label .flb{color:inherit}
.f.editing>label .flb{color:var(--ink)}
.fnote{font-size:11.5px;color:#6c6c76;margin-top:5px;line-height:1.45}

/* ширина текстовой рамки */
.wctl{display:none;align-items:center;gap:10px;margin-top:7px;font-size:11.5px;color:var(--mute)}
.f.editing .wctl,.wctl.set{display:flex}
.wctl input[type=range]{flex:1;max-width:240px;height:18px;padding:0;border:0;background:none;accent-color:var(--accent)}
.wctl .wv{font:11px var(--mono);color:var(--ink);min-width:70px}
.wctl .x{white-space:nowrap}

/* экраны страницы: порядок и видимость */
.scr{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#0e0e11;margin-bottom:5px;font-size:13px}
.scr .grab{cursor:grab;color:#5c5c66;letter-spacing:-1px}
.scr.fixed .grab{visibility:hidden}
.scr .num{font:11px var(--mono);color:var(--mute);width:20px}
.scr .nm{flex:1;cursor:pointer}
.scr .nm:hover{color:#fff}
.scr.off .nm{color:#5c5c66;text-decoration:line-through}
.scr .cnt{font:10.5px var(--mono);color:#5c5c66}
.scr .eye{padding:3px 10px;border-radius:5px;border:1px solid var(--line);font-size:11.5px;color:var(--mute);min-width:74px}
.scr .eye:hover{border-color:var(--accent);color:var(--accent)}
.scr .lock{font:10.5px var(--mono);color:#5c5c66;min-width:74px;text-align:center}
.scr--drag{opacity:.35}
.sec.is-off>h2{color:#5c5c66}
.sec.is-off>h2::after{content:'экран скрыт';margin-left:8px;font:9px var(--mono);letter-spacing:.06em;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:2px 6px;text-transform:none}

/* рамка поверх превью: что сейчас под курсором и что правится */
.stage{position:relative}
.hot{position:absolute;z-index:6;border:1.5px solid var(--accent);border-radius:4px;pointer-events:none}
.hot[hidden]{display:none}
.hot__tag{position:absolute;left:-1.5px;bottom:100%;margin-bottom:3px;background:var(--accent);color:#fff;font:600 10.5px/1 var(--sans);padding:4px 7px;border-radius:4px;white-space:nowrap}
.hot--flash{animation:hotflash 1.3s ease-out forwards}
@keyframes hotflash{0%{background:rgba(226,84,58,.24)}100%{background:rgba(226,84,58,0)}}

/* свои окна */
.veil--ask{z-index:200}
.modal--ask{max-width:470px}
.modal--ask header{border-bottom:0;padding-bottom:6px}
.modal--ask .body{background:var(--panel);padding:0 20px 16px}
.modal--ask footer{border-top:0;padding-top:4px}
.dlginput{margin-top:10px}
.btn.danger{background:#8a2c1c;border-color:#a8402b;color:#fff}
.btn.danger:hover{filter:brightness(1.12)}
.toast--act{display:flex;gap:14px;align-items:center}
.toast--act button{color:var(--accent);font-weight:600}

/* проверка вёрстки */
#guardBadge.ok{border-color:#2f5d43;color:var(--ok);background:rgba(74,157,106,.08)}
#guardBadge.busy{border-color:var(--line);color:var(--mute);background:none}
.gitem{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;font-size:12.5px;line-height:1.45;background:#141418;border-left:2px solid var(--accent);margin-bottom:5px}
.gitem .gw{flex:none;width:96px;font:10.5px var(--mono);color:var(--mute);padding-top:2px}
.gitem .x{flex:none;margin-left:auto}
.gnote{font-size:12px;color:var(--mute);margin:0 0 9px;line-height:1.5}

/* видео в кейсе и точка кадра обложки */
.slot__vid{display:block;width:100%;aspect-ratio:16/8;object-fit:contain;background:#000}
.mb--video .mb__body{grid-template-columns:1.6fr 1fr;align-items:start}
.mb--video .slot--poster .slot__img,.mb--video .slot--poster .slot__empty{aspect-ratio:16/11.6}
.focal{position:relative;display:block;width:100%;max-width:360px;cursor:crosshair;line-height:0;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#000}
.focal img{display:block;width:100%}
.focal i{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px var(--accent),0 1px 6px rgba(0,0,0,.6);pointer-events:none}
.kindrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pimg{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:9px;background:#0e0e11;padding:10px;margin-bottom:8px}
.pimg img{width:150px;border-radius:5px;background:#000;display:block;cursor:zoom-in}
.pimg b{font-size:13px}
</style></head>
<body>
<div class="app">
  <aside class="side">

      <div class="found" id="found" hidden></div></div>

      <div style="flex:1"></div><span class="devnote" id="devnote"></span><button class="btn" id="reload">Обновить</button></div>

</div>
<script src="/__cms/ui/dialogs.js"></script>

<script>
const $ = (s,r=document)=>r.querySelector(s), api = (p,o)=>fetch(p,o).then(r=>r.json());
const post = (p,d)=>api(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d||{})});
let MODEL=null, CUR=null, DATA=null, ORIG=null, LANG='ru', DIRTY=false;
let PAGES=[], MODE='case', PAGE=null, STAMP=Date.now(), FIND='', MSORT='used';
// Какой язык показывать в полях: один на всю ширину или оба рядом. Два языка в
// двух узких колонках — тесно для длинного текста, поэтому по умолчанию один.
let FMODE = ['ru','en','both'].includes(localStorage.getItem('cms.fmode')) ? localStorage.getItem('cms.fmode') : 'ru';
if(FMODE!=='both') LANG=FMODE;
let CV=null;

const RULES = {
  'Как править': `
<h4>Слева поле, справа сайт</h4>
<p>Печатаешь в поле — надпись на сайте справа меняется сразу. «Сохранить» кладёт правки в файлы, «Опубликовать» отправляет их на сайт. Пока не сохранил, сайт справа показывает черновик.</p>
<h4>Найти нужное поле — три способа</h4>
<p><b>Нажать на сайте.</b> Наведи курсор на надпись или картинку справа — появится рамка с названием поля. Щелчок открывает это поле слева. Щелчок по строке таблицы проектов или по карточке портфолио открывает кейс.</p>
<p><b>Поиск</b> над списком страниц (<code>Ctrl+K</code>). Ищет по всем текстам сайта, на русском и английском, и ведёт прямо в поле.</p>
<p><b>Полоска экранов</b> над формой: Первый экран, Вступление, Проекты… Щелчок прокручивает форму к этому экрану.</p>
<h4>Ссылки на сайте справа</h4>
<p>Работают как навигация по CMS: нажал «Портфолио» в шапке — открылась страница портфолио, слева её поля. Чтобы сайт вёл себя как обычно и клик по тексту ничего не открывал, переключи «Правка» на «Просмотр».</p>
<h4>Языки</h4>
<p>Кнопки <b>RU · EN · Оба</b> над формой. В режиме одного языка поле занимает всю ширину, а второй язык виден строкой под ним. Щелчок по этой строке раскрывает оба языка рядом.</p>
<p>Если поменял русский текст, а английский оставил, под полем появится метка <b>«не обновлён»</b>. Перед публикацией CMS ещё раз покажет все такие поля списком.</p>
<h4>Вернуть одно поле</h4>
<p>У изменённого поля рядом с названием появляется «вернуть» — оно откатывает только это поле. «Отменить» наверху откатывает все несохранённые правки раздела.</p>
<h4>Оформление текста</h4>
<p>Выдели слово — появится панель: жирный, курсив, подсветка числа. Теги писать не надо. Enter в многострочном поле ставит перенос строки.</p>`,
  'Тексты': `
<h4>Цифра, за которую отвечаешь</h4>
<p>Число производства — то, что ты видел сам, — сильнее бизнес-метрики. «Макет шёл 8 итераций, стал 2» защищается одним предложением. «+45% результативности» не защищается ничем.</p>
<h4>Второй вопрос</h4>
<p>Перед каждым числом спроси себя: <b>«а как мерил?»</b> Если ответа нет — процент убить. Одна выдуманная цифра обнуляет доверие ко всем остальным на странице, включая настоящие.</p>
<h4>Чужое подписывать</h4>
<p>Аудитория продукта, выручка компании, награда фирмы — это не твой результат. Пиши прямо: «компания на этом отрезке…». Разделение «вот моё, вот компании» звучит сильнее, чем присвоение.</p>
<h4>Факт закрывает боль</h4>
<p>Сколько болей назвал в «Задаче» — столько исходов от тебя ждут в фактах. Факт, который пересказывает «Решение», — не доказательство, а повтор.</p>
<h4>Когда спросят «а где цифры?»</h4>
<p>«Выручку и конверсию компании показать не могу и выдумывать не буду. Вот что мерил сам: … Что на этом сделала компания — публично: …»</p>`,
  'Экраны и рамки': `
<h4>Экраны главной</h4>
<p>Наверху страницы «Манифест» — список экранов. Кнопка «Скрыть» убирает экран с сайта: его не видно, поисковик его не читает, но тексты целы и правятся как обычно. «Показать» возвращает его на место.</p>
<p>Порядок меняется перетаскиванием. Первый экран и контакты стоят на своих местах: один открывает страницу, другой закрывает. Номера глав (00, 01, 02…) пересчитываются сами, боковое меню сайта тоже перестраивается.</p>
<p>Изменение экранов сразу ложится в файлы — отдельно сохранять не надо. Сразу после него появляется кнопка «Вернуть».</p>
<h4>Ширина текстовой рамки</h4>
<p>Поставь курсор в поле — под ним появится ручка «Ширина рамки». Это то же, что потянуть рамку текста в Figma: уже — строки короче и их больше, шире — наоборот. Сайт справа перестраивается сразу. «Как в макете» снимает настройку.</p>
<p>Ручка есть не у всех полей. Её нет там, где перенос решает вёрстка: первый экран (кегль подбирает скрипт), «Принципы» (лесенка), таблицы, карусель «Что получает бизнес», карточки. Там её появление ломало бы макет.</p>
<p>Шире своей колонки текст не станет. На телефоне рамка обычно шире экрана и ничего не меняет — проверь в режиме «Мобилка».</p>
<h4>Чего в конструкторе нет нарочно</h4>
<p>Цвета, шрифты и кегли остаются в коде: на сайте они связаны с сеткой и скриптами. Количество пунктов в списках (четыре принципа, пять карточек, двадцать тем менторства) задано макетом — меняется текст, а не число. Новый тип экрана сначала рисуется в макете.</p>`,
  'Картинки и видео': `
<h4>Как добавить картинку</h4>
<p>Перетащи файл в блок медиа или нажми и выбери в окне Windows. Имя задаётся автоматически по кейсу: <code>duft-5</code>, <code>duft-6</code>. Уменьшенные копии для телефонов (<code>-480</code>, <code>-960</code>, <code>-1440</code>) делаются тут же, ждать деплоя не надо.</p>
<h4>PNG и JPG тоже можно</h4>
<p>Сайт работает на webp — он в разы легче при том же виде. Если кидаешь <code>.png</code> или <code>.jpg</code>, CMS спросит, как переводить, и покажет оба веса:</p>
<p><b>Сжать</b> — качество 90. На глаз не отличить, вес обычно в 5–10 раз меньше. Берите это.<br>
<b>Без потерь</b> — пиксель в пиксель, но тяжелее. Имеет смысл для скриншотов интерфейса с мелким текстом.</p>
<p>Файл на компьютере при этом не трогается. Ширина оригинала — 1920 для полноширинных и 940 для парных.</p>
<h4>Строка на две картинки</h4>
<p>Кнопка «+ две в ряд» добавляет блок на две картинки рядом. У готовой картинки во всю ширину есть «добавить вторую рядом»: она встанет слева, справа появится место для второй. «Поставить друг под другом» делает обратное. На телефоне две в ряд всё равно встанут одна под другой.</p>
<h4>Alt обязателен</h4>
<p>Его читают поисковик и незрячие. Опиши, что на кадре, а не «картинка 3». Пустой alt подсветится в проверке.</p>
<h4>Видео внутри кейса</h4>
<p>Кнопка «+ видео» под блоками медиа. Нужен <code>.mp4</code> до 40 МБ, без звука. У блока две части: сам ролик и <b>постер</b> — картинка, которую видно, пока ролик грузится. Без постера на его месте будет пустой прямоугольник, проверка об этом напомнит.</p>
<p>Ролик не качается, пока до него не докрутили, и встаёт на паузу, когда уехал с экрана. Блок двигается среди картинок так же, как они.</p>
<h4>Обложка: картинка или видео</h4>
<p>В разделе «Обложка» кейса переключатель «Картинка · Видео». Выбрал «Видео» — CMS попросит файл и поставит его на карточку в портфолио. Картинка при этом остаётся постером. Вернуть картинку — тем же переключателем, видео-файл останется на диске.</p>
<h4>Точка кадра</h4>
<p>Обложка обрезается в окне, которое появляется при наведении на строку таблицы на главной, и в ленте на телефоне. Щёлкни по обложке в том месте, которое должно остаться в кадре, — появится кружок. «Сбросить» возвращает обрезку по центру.</p>
<h4>Замена без разрыва ссылок</h4>
<p>Заменяя картинку или видео, CMS пишет новый файл под прежним именем. Поэтому он обновляется везде сразу: в кейсе, на карточке, на главной. Размеры на странице пересчитываются сами.</p>`,
  'Ссылки и контакты': `

<b>Как показывать</b> — что видит человек: <code>@Lookin_Sergey</code>, <code>behance.net/…</code>. Меняешь одно — не забудь второе, иначе подпись врёт.</p>

  'Превью и проверка вёрстки': `
<h4>Веб, планшет, мобилка</h4>
<p>Три кнопки над превью. Кадр — настоящий экран устройства: 1440×900, 820×1180 и 390×844 px. Сайт переключает вёрстку по-честному, а первый экран выглядит так же, как у посетителя: не растянут и не сжат.</p>
<h4>Масштаб</h4>
<p>Если кадр не помещается в колонку, он уменьшается целиком и рядом пишется процент. Пропорции при этом верные: это зум, а не сжатие. Под кадром десктопа может оставаться пустое место — экран шире, чем колонка.</p>
<h4>Колонку можно двигать</h4>
<p>Тёмная полоска между полями и превью тянется мышкой — кадр станет крупнее. Двойной щелчок по ней возвращает как было. Ширина запоминается.</p>
<h4>Проверка вёрстки — сама</h4>
<p>После каждого сохранения CMS невидимо открывает страницу на трёх ширинах и двух языках и ищет четыре вещи: текст вылез за край экрана, текст обрезан своим блоком, один текст наехал на другой, появилась горизонтальная прокрутка.</p>
<p>Она сравнивает страницу с опубликованной версией. Бегущие строки, лента кадров и карусель «вылезают» нарочно — это не считается. Замечание — только то, чего на сайте не было.</p>
<p>Результат — значок над формой: зелёный «Вёрстка цела» или красный с числом. Щелчок по красному открывает список, «Показать» переключает превью на нужное устройство и язык и подсвечивает место.</p>
<h4>Пока печатаешь</h4>
<p>Если слово не поместилось или текст наехал на соседа на той ширине, что сейчас в превью, замечание появляется прямо под полем, без сохранения.</p>
<h4>Перед публикацией</h4>
<p>Все изменённые страницы проверяются ещё раз. Если нашлась поломка, кнопка «Опубликовать» не нажмётся, пока не поставишь галочку «публикую всё равно». Так сломанная вёрстка не уйдёт на сайт незаметно.</p>`,
  'Публикация': `

<b>2.</b> «Опубликовать» — показывает, что именно уйдёт, проверяет вёрстку и ждёт подтверждения.<br>
<b>3.</b> Подтверждаешь — уходит на GitHub, сборка идёт сама, через пару минут сайт обновлён.</p>
<h4>Ничего вводить не надо</h4>
<p>Логин берётся из твоего GitHub Desktop. Паролей и токенов CMS не хранит.</p>
<h4>Если что-то пошло не так</h4>

<p>Откатывай <b>с конца, по одной</b>. Если перескочить через несколько версий, правки поверх помешают и CMS честно об этом скажет.</p>

<p>GitHub держит страницу до десяти минут. Если правки «не видно» — Ctrl+Shift+R.</p>`,
  'Кейсы': `

  'Если что-то сломалось': `

/* ── подсказки ── */
let tipEl=null;
function tip(el,text){
  hideTip(); tipEl=document.createElement('div'); tipEl.className='tip'; tipEl.innerHTML=text;
  document.body.appendChild(tipEl);
  const r=el.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
  tipEl.style.left=Math.min(r.left, innerWidth-t.width-14)+'px';
  tipEl.style.top=(r.bottom+7+t.height>innerHeight? r.top-t.height-7 : r.bottom+7)+'px';
}
const hideTip=()=>{ if(tipEl){tipEl.remove(); tipEl=null;} };
addEventListener('scroll',hideTip,true);

function toast(msg,ms=2600){ pubSoon();   // после любого действия пересчитать, что ещё не на сайте
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); return t; }

/* ── список кейсов ── */
async function boot(){
  Live.init();
  paintModes();
  MODEL = await api('/api/model');
  drawList();
  PAGES=(await api('/api/pages')).pages;
  $('#pages').innerHTML=PAGES.map(p=>`<button class="pg" data-f="${p.file}">${p.label}</button>`).join('');
  $('#pages').onclick = e=>{ const b=e.target.closest('.pg'); if(b) openPage(b.dataset.f); };
  $('#cases').onclick = e=>{ const b=e.target.closest('.case'); if(!b) return;
    e.target.closest('.entag') ? openUntranslated(b.dataset.n) : open(b.dataset.n); };
  wireSearch();
  // открываем то, на чём остановились в прошлый раз; в первый раз — главную
  const last=(()=>{ try{ return JSON.parse(localStorage.getItem('cms.last')||'null'); }catch(e){ return null; } })();
  if(last && last.type==='case' && MODEL.cases.some(c=>c.n===last.n)) open(last.n);
  else openPage(last && last.type==='page' && PAGES.some(p=>p.file===last.file) ? last.file : 'index.html');
}
const remember=(o)=>{ try{ localStorage.setItem('cms.last', JSON.stringify(o)); }catch(e){} };

// Уход со страницы с несохранённым: спрашиваем своим окном, а не системным.
async function leaveOk(){
  if(!DIRTY) return true;
  return ask({ title:'Есть несохранённые правки', text:'Если уйти сейчас, они не попадут в файлы. Черновик сохранится в браузере — при возврате сюда CMS предложит его восстановить.',
    ok:'Уйти без сохранения', cancel:'Остаться', danger:true });
}
// подсветка активного пункта в боковой колонке
function navOn(sel){
  document.querySelectorAll('.side .pg, .side .case').forEach(b=>b.classList.remove('on'));
  const el = sel && document.querySelector(sel); if(el) el.classList.add('on');
}

/* ── языки: поля и превью ──────────────────────────────────────────────────
   LANG  — язык превью. FMODE — что показывать в полях: ru, en или оба рядом.
   Когда в полях один язык, превью показывает его же: правишь русский — видишь русский. */
function paintModes(){
  $('#fmode').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===FMODE));
  $('#lang').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  $('#pmode').querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.p==='edit')===Live.edit));
}
function setFMode(m){
  FMODE=m; localStorage.setItem('cms.fmode',m);
  const langChanged = m!=='both' && LANG!==m;
  if(langChanged) LANG=m;
  paintModes(); rerender();
  if(langChanged) refreshPreview(true);
}
function setLang(l){
  if(l===LANG) return;
  LANG=l;
  if(FMODE!=='both'){ FMODE=l; localStorage.setItem('cms.fmode',l); rerender(); }
  paintModes(); refreshPreview(true);
}
// перерисовать форму текущего раздела, не теряя место прокрутки
function rerender(){
  const m=$('.main'), y=m.scrollTop;
  if(MODE==='case'&&DATA) render();
  else if(MODE==='page'&&PAGE) renderPage();
  else if(MODE==='shell'&&SHELL) renderShell();
  m.scrollTop=y;
  if(DIRTY) markFields();
}

// Список кейсов: статус точкой, порядок — перетаскиванием строки.
function drawList(){
  const dot={published:'var(--ok)',hidden:'var(--warn)'};
  const q=(FIND||'').trim().toLowerCase();
  const list=MODEL.cases.filter(c=>!q
    || String(c.title||'').toLowerCase().includes(q)
    || String(c.role||'').toLowerCase().includes(q)
    || String(c.year||'').includes(q)
    || String(c.n).includes(q));
  $('#cases').innerHTML = list.map(c=>
    `<button class="case${c.status!=='published'?' case--off':''}" data-n="${c.n}" draggable="${q?'false':'true'}">
       <b><i class="dot" style="background:${dot[c.status]}" title="${MODEL.statusRu[c.status]}"></i>${c.n} · ${c.title||'без названия'}</b>
       <span>${c.year||'—'} · ${c.role||'—'}${c.status!=='published'?' · '+MODEL.statusRu[c.status]:''}</span>${c.needsEn?'<br><em class="entag" title="Столько полей заполнено по-русски и пусто по-английски. Нажми — открою первое.">без перевода: '+c.needsEn+'</em>':''}
     </button>`).join('')
    || '<div class="locked" style="padding:10px">Ничего не найдено.</div>';
  if(q) return;   // при поиске порядок мышью не трогаем — он про полный список
  let drag=null;
  for(const el of $('#cases').querySelectorAll('.case')){

    el.ondragover=e=>{ e.preventDefault(); if(!drag||drag===el) return;

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const plainText=v=>String(v??'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();

/* ── поле ─────────────────────────────────────────────────────────────────
   Одна функция на все разделы. sel — атрибут, по которому поле находит своё
   место в данных: data-k (кейс), data-pk (страница), data-pa (подсказка-атрибут),
   data-sh (шапка и подвал), data-mf (годы и названия компаний).
   В режиме одного языка поле занимает всю ширину, а второй язык виден строкой
   под ним: видно, есть ли перевод и не отстал ли он от правки. */
let FDEFS=[];                      // описания полей текущей формы — чтобы перерисовать одно поле
function fieldHTML(o){
  const fid = o.fid!=null ? o.fid : FDEFS.push(o)-1;
  o.fid=fid;
  const one=!o.long;
  const get=l=>fGet(o.ds, l, false) ?? '';
  const val=l=>o.plain ? esc(String(get(l))) : htmlToRich(get(l));
  const sel=Object.entries(o.ds).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ');
  const cell=(l,tag)=>`<div class="fl">${tag?`<div class="lang">${l.toUpperCase()}</div>`:''}`
    + `<div class="rf${one?' rf--one':''}" contenteditable="${o.plain?'plaintext-only':'true'}" spellcheck="true" ${sel} data-l="${l}" data-ph="пусто">${val(l)}</div></div>`;
  let body;
  if(o.neutral) body=cell('ru',false);
  else if(FMODE==='both'||o.both) body=`<div class="pair">${cell('ru',true)}${cell('en',true)}</div>`;
  else {
    // «нет перевода» — только когда на основном языке текст есть, а на втором пусто;
    // если пусто в обоих, переводить нечего
    const other=FMODE==='ru'?'en':'ru', txt=plainText(get(other)), mine=plainText(get(FMODE));
    body=cell(FMODE,false)
      + `<button class="oth${!txt&&mine?' none':''}" data-oth="${other}" title="показать оба языка рядом"><b>${other.toUpperCase()}</b><span>${txt?esc(txt):mine?'нет перевода':'пусто'}</span></button>`;
  }
  return `<div class="f" data-fid="${fid}"${o.neutral?' data-neutral="1"':''}><label><span class="flb">${esc(o.label)}</span>`
    + (o.optional?' <span class="opt">· необязательно</span>':'')
    + (o.hint?`<button class="i" data-hint="${esc(o.hint)}">i</button>`:'')
    + `</label>${body}${o.wkey?`<div class="wctl" data-wkey="${esc(o.wkey)}"></div>`:''}</div>`;
}
// поле кейса по описанию из модели
function field(f){
  KLABEL[f.k]=f.label;
  return fieldHTML({ label:f.label, hint:f.hint, optional:f.optional, neutral:f.neutral, long:f.kind==='text',
    ds:{k:f.k}, wkey:CASE_WIDTH.has(f.k)?f.k:'' });
}
let KLABEL={};                     // ключ → человеческое название, для счётчика правок и замечаний

/* Где у поля лежит «сейчас» и «было». ds — data-атрибуты самого поля.
   Разделы хранят данные по-разному, и это единственное место, которое об этом знает. */
function fStore(ds, orig){
  if(ds.sh) return orig ? ORIG : SHELL;                                   // {ru:{…}, en:{…}}
  if(ds.pa) return null;
  if(MODE==='case') return orig ? ORIG.dict : DATA.dict;
  return orig ? ORIG.dict : PAGE.dict;
}
function fGet(ds, lang, orig){
  if(ds.mf) return mfGet(ds.mf, orig);
  if(ds.pa){ const a=((orig?ORIG:PAGE).attrs||{})[ds.pa]; return a ? a[lang] : undefined; }
  const s=fStore(ds, orig);
  return s ? (s[lang]||{})[ds.k||ds.pk||ds.sh] : undefined;
}
function fSet(ds, lang, v){
  if(ds.mf) return mfSet(ds.mf, v);
  if(ds.pa){ PAGE.attrs[ds.pa][lang]=v; return; }
  const s=fStore(ds, false);
  (s[lang]=s[lang]||{})[ds.k||ds.pk||ds.sh]=v;
}
const fKey=ds=>ds.k||ds.pk||ds.sh||'';
const same=(a,b)=>(a??'')===(b??'');
// правка поля → превью
function fLive(ds, lang, v){
  if(ds.pa){
    // три вида полей вне словаря: название в боковом указателе, надпись в разметке, подсказка-атрибут
    if(ds.pa.startsWith('@nav:')) return Live.navLabel(ds.pa.slice(5), lang, v??'');
    if(ds.pa.startsWith('@text:')) return Live.text(lang==='ru'?ds.lru:ds.len, lang, v??'');
    const at=ds.pa.indexOf(':'); Live.pushAttr(ds.pa.slice(at+1), ds.pa.slice(1,at).replace(/-ru$/,'-'+lang), lang, v??'');
  }
  else if(fKey(ds)) Live.push(fKey(ds), lang, v??'');
}

// Оживить поля формы (или одного блока): ввод, фокус, второй язык.
function wireFields(root){
  for(const el of (root||$('#form')).querySelectorAll('.rf')){
    if(el.dataset.wired) continue; el.dataset.wired='1';
    const ds=el.dataset;
    const onChange=v=>{ fSet(ds, ds.l, v); mark(); fLive(ds, ds.l, v); };
    if(el.getAttribute('contenteditable')==='plaintext-only'){
      el.addEventListener('input',()=>onChange(el.textContent.replace(/ /g,' ')));
      el.addEventListener('keydown',e=>{ if(e.key==='Enter') e.preventDefault(); });
    } else wireRich(el,onChange);
    el.addEventListener('focus',()=>onFieldFocus(el));
  }
  for(const b of (root||$('#form')).querySelectorAll('.oth')) b.onclick=()=>{ const f=b.closest('.f'); FDEFS[f.dataset.fid].both=true; refreshField(f); };
}
// перерисовать одно поле из данных (после «вернуть» или раскрытия второго языка)
function refreshField(f){
  const o=FDEFS[f.dataset.fid]; if(!o) return;
  const t=document.createElement('div'); t.innerHTML=fieldHTML(o);
  const nf=t.firstElementChild; f.replaceWith(nf); wireFields(nf);
  return nf;
}
// Поле получило фокус: показываем его место на сайте и даём ручку ширины рамки.
function onFieldFocus(el){
  const f=el.closest('.f');
  document.querySelectorAll('.f.editing').forEach(x=>{ if(x!==f) x.classList.remove('editing'); });
  f.classList.add('editing');
  const ds=el.dataset;
  if(ds.l===LANG && !f.dataset.fromPreview){
    if(ds.pa && ds.pa.startsWith('@nav:')) Live.revealSection(ds.pa.slice(5));
    else if(ds.pa && ds.pa.startsWith('@text:')) Live.revealSel(LANG==='ru'?ds.lru:ds.len);
    else { const key = ds.pa ? ds.pa.slice(ds.pa.indexOf(':')+1) : fKey(ds); if(key) Live.reveal(key); }
  }
  delete f.dataset.fromPreview;
  const w=f.querySelector('.wctl'); if(w) drawWidth(w);
}
// надписи кейса, у которых на странице есть своя текстовая рамка
const CASE_WIDTH=new Set(['p.lead','p.ov','p.ta','p.so','p.re']);

/* Неразрывный пробел в текстах записан как &nbsp; — он держит предлоги, чтобы
   «в» и «на» не висели в конце строки. Показывать эту абракадабру в поле нельзя,
   терять её тоже нельзя. Поэтому в редакторе она живёт настоящим символом
   (выглядит обычным пробелом), а при сохранении возвращается в разметку.
   Переносы <br> в поле показываем переводом строки — так же честно. */
const NB='\u00a0';

/* ── Поле с оформлением ────────────────────────────────────────────────────
   В текстах сайта встречается ровно четыре вещи: <b> жирное, <em> курсив,
   <span class="num"> подсветка числа и <br> перенос строки. Показывать их
   тегами нельзя — писать в таком поле невозможно. Поэтому поле показывает
   готовый вид, а при чтении собирается обратно в чистую разметку.
   Всё, чего нет в этом списке, при вставке отбрасывается. */
// Тег сохраняем ТОТ ЖЕ, что был в файле: <b> и <strong> выглядят одинаково,
// но подменять один на другой нельзя — тогда холостое сохранение переписывает
// страницу, и в истории появляется правка, которой человек не делал.
const RICH_OK = { B:'b', STRONG:'strong', I:'em', EM:'em' };

// Классы span, на которых держится вёрстка: подсветка числа, стрелка «наверх»,
// разделитель между фактами. Плюс <span> совсем без атрибутов — им в шапке
// обёрнуто «Арт-директор», и на экранах до 420 px CSS его скрывает, иначе
// строка переносится на две. Потеряем обёртку — шапка сломается на телефонах.
const SPAN_OK = ['num', 'arr', 'sep'];
function spanAttrs(n){
  const cls=[...n.classList].filter(c=>SPAN_OK.includes(c));
  if(cls.length) return ' class="'+cls.join(' ')+'"';
  if(!n.attributes.length) return '';
  return null;                              // чужой span из буфера — развернуть
}

function richToHtml(node){
  let out='';
  for(const n of node.childNodes){
    if(n.nodeType===3){                       // текст
      // Enter и вставка из буфера кладут в поле не тег, а символ перевода строки:
      // в поле он виден как перенос (pre-wrap), а сайт его схлопывает в пробел.
      // Поэтому в словарь перенос всегда уходит тегом <br>.
      out += n.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\r?\n/g,'<br>');
      continue;
    }
    if(n.nodeType!==1) continue;
    const tag=n.tagName;
    if(tag==='BR'){ out+='<br>'; continue; }
    if(tag==='SPAN'){
      const at=spanAttrs(n);
      if(at!==null){
        const inner=richToHtml(n);
        if(inner.trim()) out+='<span'+at+'>'+inner+'</span>';   // пустые из буфера — мимо
        continue;
      }
    }
    const keep=RICH_OK[tag];
    const inner=richToHtml(n);
    if(!inner.trim() && tag!=='BR') continue;
    out += keep ? '<'+keep+'>'+inner+'</'+keep+'>' : inner;   // чужое — разворачиваем
    if(tag==='DIV'||tag==='P') out+='<br>';                   // блок из вставки — переносом
  }
  return out;
}
const htmlToRich = (v) => String(v??'').replace(/&nbsp;/g, NB);
const richToStore = (el) => richToHtml(el).replace(new RegExp(NB,'g'),'&nbsp;').replace(/(<br>)+$/,'');

let RTOOL=null;
function hideTool(){ if(RTOOL){ RTOOL.remove(); RTOOL=null; } }
function showTool(field){
  const sel=window.getSelection();
  if(!sel.rangeCount || sel.isCollapsed || !field.contains(sel.anchorNode)) { hideTool(); return; }
  const r=sel.getRangeAt(0).getBoundingClientRect();
  if(!r.width){ hideTool(); return; }
  if(!RTOOL){
    RTOOL=document.createElement('div'); RTOOL.className='rtool';
    RTOOL.innerHTML='<button data-r="b" title="жирный (Ctrl+B)"><b>Ж</b></button>'
      + '<button data-r="em" title="курсив (Ctrl+I)"><i>К</i></button>'
      + '<button data-r="num" title="подсветить число"><span class="nm">12</span></button>'
      + '<button data-r="clear" title="убрать оформление">убрать</button>';
    RTOOL.onmousedown=e=>e.preventDefault();
    RTOOL.onclick=e=>{ const b=e.target.closest('[data-r]'); if(b) applyRich(b.dataset.r, field); };
    document.body.appendChild(RTOOL);
  }
  RTOOL.style.left=Math.max(8, Math.min(r.left, innerWidth-190))+'px';
  RTOOL.style.top=Math.max(8, r.top-38)+'px';
}
function applyRich(what, field){
  const sel=window.getSelection(); if(!sel.rangeCount || sel.isCollapsed) return;
  const range=sel.getRangeAt(0);
  if(what==='clear'){
    const txt=range.toString(); range.deleteContents(); range.insertNode(document.createTextNode(txt));
  } else if(what==='num'){
    const sp=document.createElement('span'); sp.className='num'; sp.textContent=range.toString();
    range.deleteContents(); range.insertNode(sp);
  } else {
    const el=document.createElement(what==='b'?'b':'em'); el.textContent=range.toString();
    range.deleteContents(); range.insertNode(el);
  }
  sel.removeAllRanges();
  field.dispatchEvent(new Event('input',{bubbles:true}));
  hideTool();
}
document.addEventListener('selectionchange',()=>{
  const a=document.activeElement;
  if(a && a.classList && a.classList.contains('rf')) showTool(a); else hideTool();
});

// одно место, где поле оживает: вставка без мусора, Enter переносом, горячие клавиши
function wireRich(el, onChange){
  el.addEventListener('paste', e=>{
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t);
  });
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      if(el.classList.contains('rf--one')){ e.preventDefault(); return; }
      e.preventDefault(); document.execCommand('insertLineBreak');
    }
    if((e.ctrlKey||e.metaKey) && (e.key==='b'||e.key==='B')){ e.preventDefault(); applyRich('b', el); }
    if((e.ctrlKey||e.metaKey) && (e.key==='i'||e.key==='I')){ e.preventDefault(); applyRich('em', el); }
  });
  el.addEventListener('input', ()=>onChange(richToStore(el)));
  el.addEventListener('blur', hideTool);
}
const toEditor=v=>String(v??'').replace(/&nbsp;/g,NB).replace(/<br\s*\/?>/gi,'\n');
const fromEditor=v=>String(v??'').replace(new RegExp(NB,'g'),'&nbsp;').replace(/\r?\n/g,'<br>');

/* Расстановка неразрывных пробелов по правилу, по которому набран сайт:
   после коротких слов (до двух букв) и перед тире. */
function bindShort(v){
  return String(v??'')
    .replace(new RegExp('(^|[\\s'+NB+'(«"])([А-Яа-яЁёA-Za-z]{1,2})\\s+','g'), '$1$2'+NB)
    .replace(/\s+—/g, NB+'—');
}
