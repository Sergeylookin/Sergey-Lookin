<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS · Портфолио</title>
<style>
:root{
  --bg:#0b0b0d; --panel:#131316; --line:#26262b; --ink:#e8e8ea; --mute:#8a8a93;
  --accent:#e2543a; --ok:#4a9d6a; --warn:#c9973f;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"Inter Tight",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:#0e0e11;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:#4a4a55}
.app{display:grid;grid-template-columns:210px minmax(430px,1fr) minmax(380px,44%);height:100vh}

/* ── левая колонка ── */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:14px 16px;border-bottom:1px solid var(--line);font:600 13px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.brand small{display:block;color:var(--mute);font-weight:400;letter-spacing:.04em;text-transform:none;margin-top:3px}
.cases{overflow:auto;flex:1;padding:6px}
.case{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:6px;color:var(--mute);line-height:1.3}
.case:hover{background:#1b1b1f;color:var(--ink)}
.case.on{background:#1f1f24;color:var(--ink)}
.case b{display:block;font-weight:600;font-size:13px}
.case span{font:11px var(--mono);opacity:.65}
.sidefoot{border-top:1px solid var(--line);padding:10px;display:grid;gap:6px}
.grouphead{padding:9px 16px 5px;border-top:1px solid var(--line);font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#5c5c66}
.pages{padding:4px 6px 8px;flex:none;max-height:31vh;overflow:auto}
.pg{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--mute);font-size:13px}
.pg:hover{background:#1b1b1f;color:var(--ink)}
.pg.on{background:#1f1f24;color:var(--ink)}

/* ── центр ── */
.main{overflow:auto;min-height:0;padding:0 0 80px}
.bar{position:sticky;top:0;z-index:5;background:rgba(11,11,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;gap:10px;align-items:center}
.bar h1{margin:0;font-size:15px;font-weight:600;flex:1}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:#17171b;font-size:13px}
.btn:hover{border-color:#43434e}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default}
.sec{padding:18px 20px;border-bottom:1px solid var(--line)}
.sec>h2{margin:0 0 12px;font:600 11px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--mute)}
.f{margin-bottom:13px}
.f>label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-bottom:5px}
.i{width:15px;height:15px;border-radius:50%;border:1px solid #3a3a44;color:var(--mute);font:600 10px/13px var(--mono);text-align:center;flex:none}
.i:hover{border-color:var(--accent);color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .lang{font:10px var(--mono);color:#5c5c66;letter-spacing:.1em;margin-bottom:3px}
.opt{color:#5c5c66}

/* ── медиа ── */
.media{display:grid;gap:8px}
.row-m{border:1px solid var(--line);border-radius:8px;padding:9px;background:#0e0e11}
.row-m .head{display:flex;gap:8px;align-items:center;margin-bottom:7px;font:11px var(--mono);color:var(--mute)}
.row-m .head b{color:var(--ink);font-weight:600}
.row-m .head .sp{flex:1}
.mi{display:grid;grid-template-columns:64px 1fr;gap:9px;align-items:start;margin-top:7px}
.mi img{width:64px;height:44px;object-fit:cover;border-radius:4px;background:#000;border:1px solid var(--line)}
.x{padding:2px 7px;border-radius:4px;border:1px solid var(--line);font-size:11px;color:var(--mute)}
.x:hover{border-color:var(--accent);color:var(--accent)}
.locked{opacity:.55;font:11px var(--mono);color:var(--mute)}
.drop{border:1px dashed #3a3a44;border-radius:8px;padding:16px;text-align:center;color:var(--mute);font-size:12px}
.drop.hot{border-color:var(--accent);color:var(--accent)}
.drop--new{margin-top:9px;padding:20px;border-style:dashed;border-width:2px;line-height:1.55}
.drop--new b{color:var(--ink);font-size:13px}
.drop:hover{border-color:#55555f;color:#b9b9c2}
/* блок медиа: показываем раскладку так, как она встанет на странице */
.mb{border:1px solid var(--line);border-radius:9px;background:#0e0e11;margin-bottom:9px;overflow:hidden}
.mb__bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--mute)}
.mb__bar .grab{cursor:grab;opacity:.6;letter-spacing:-1px}
.mb__bar b{color:var(--ink);font:600 11px var(--sans);letter-spacing:0}
.mb__bar .sp{flex:1}
.mb__body{display:grid;gap:8px;padding:9px}
.mb--row .mb__body{grid-template-columns:1fr 1fr}
.slot{position:relative;border-radius:6px;overflow:hidden;background:#000;border:1px solid var(--line)}
.slot__img{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;cursor:zoom-in}
.mb--row .slot__img{aspect-ratio:1/1}
.slot__empty{display:grid;place-items:center;width:100%;aspect-ratio:16/8;color:#5c5c66;font-size:12px;background:#141418}
.mb--row .slot__empty{aspect-ratio:1/1}
.slot__acts{position:absolute;top:6px;right:6px;display:flex;gap:5px;opacity:0;transition:opacity .15s}
.slot:hover .slot__acts{opacity:1}
.slot__acts button{background:rgba(12,12,15,.86);border:1px solid #3a3a44;border-radius:5px;padding:3px 8px;font-size:11px;color:var(--ink);backdrop-filter:blur(4px)}
.slot__acts button:hover{border-color:var(--accent);color:var(--accent)}
.slot__meta{display:flex;gap:7px;align-items:center;padding:6px 8px;font:10.5px var(--mono);color:var(--mute);background:#141418;border-top:1px solid var(--line)}
.slot__meta .nm{color:#b9b9c2}
.slot__meta .sp{flex:1}
.slot__meta .warn{color:var(--warn)}
.slot.hot{outline:2px solid var(--accent);outline-offset:-2px}
.slot__alt{width:100%;border:0;border-top:1px solid var(--line);border-radius:0;background:#0e0e11;font-size:12px;padding:7px 9px}
.slot__alt::placeholder{color:#4d4d57}
.slot__alt:focus{border-color:transparent;background:#141418}
.mb--drag{opacity:.35}
/* просмотр картинки во весь экран */
.lb{position:fixed;inset:0;z-index:120;background:rgba(6,6,8,.93);display:grid;grid-template-rows:auto 1fr auto;padding:16px 20px}
.lb__top{display:flex;align-items:center;gap:12px;color:var(--ink);font-size:13px}
.lb__top .sp{flex:1}
.lb__wrap{display:grid;place-items:center;overflow:auto;padding:12px 0}
.lb img{max-width:100%;max-height:100%;border-radius:8px;background:#000}
.lb__bottom{display:flex;gap:9px;align-items:center;justify-content:center;font:11px var(--mono);color:var(--mute)}
.cvrow{display:grid;grid-template-columns:1fr auto;gap:9px 10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:11px;background:#0e0e11;margin-bottom:8px}
.cvrow .cvdrop{grid-column:1/-1}
a.btn{display:inline-block;text-decoration:none;white-space:nowrap}
.cvrow b{font-size:13px}
.cvmeta{font:11px var(--mono);color:var(--mute);margin-top:3px}
.cvdrop{padding:10px;font-size:11.5px;margin:0}

/* ── превью ── */
.prev{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.prev .bar{border-bottom:1px solid var(--line);background:none;backdrop-filter:none}
.prev iframe{flex:1;width:100%;border:0;background:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:5px 11px;font:11px var(--mono);color:var(--mute)}
.seg button.on{background:#1f1f24;color:var(--ink)}
.seg--wide{display:grid;grid-template-columns:repeat(3,1fr)}
.seg--wide button{padding:7px 4px;font-size:11.5px;font-family:var(--sans);letter-spacing:0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.case--off b{opacity:.6}
.badge{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mute);vertical-align:middle}
.badge--published{display:none}
.badge--hidden{color:var(--warn);border-color:var(--warn)}

/* ── проверки ── */
.checks{padding:12px 20px;display:grid;gap:6px}
.chk{display:flex;gap:8px;padding:8px 10px;border-radius:6px;font-size:12.5px;line-height:1.45;background:#141418;border-left:2px solid var(--line)}
.chk.err{border-left-color:var(--accent)} .chk.warn{border-left-color:var(--warn)} .chk.info{border-left-color:#3d5a80}
.chk .n{font:11px var(--mono);color:var(--mute);flex:none}
.empty{color:var(--ok);font-size:12.5px;padding:8px 10px}

/* ── модалки ── */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:28px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal header h3{margin:0;font-size:15px;flex:1}
.tabs{display:flex;gap:2px;padding:10px 20px 0}
.tabs button{padding:7px 13px;border-radius:6px 6px 0 0;font-size:13px;color:var(--mute)}
.tabs button.on{background:#1b1b20;color:var(--ink)}
.modal .body{padding:16px 20px 22px;overflow:auto;background:#1b1b20}
.modal .body h4{margin:16px 0 7px;font-size:13px}
.modal .body h4:first-child{margin-top:0}
.modal .body p,.modal .body li{color:#c2c2c8;font-size:13px;line-height:1.62;margin:5px 0}
.modal .body code{font:12px var(--mono);background:#0e0e11;padding:1px 5px;border-radius:3px}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.tip{position:fixed;z-index:99;max-width:330px;background:#22222a;border:1px solid #383842;border-radius:7px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:#dcdce2;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#22222a;border:1px solid #383842;border-radius:8px;padding:10px 16px;font-size:13px;z-index:80}
.steps{display:grid;gap:5px;font:12px var(--mono)}
.steps div{display:flex;gap:8px}
.steps .m{color:var(--ok)} .steps .b{color:var(--accent)}
</style></head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">CMS<small id="root">портфолио</small></div>
    <div class="cases" id="cases"></div>
    <div class="grouphead">Страницы сайта</div>
    <div class="pages" id="pages"></div>
    <div class="sidefoot">
      <button class="btn" id="addCase">+ Новый кейс</button>
      <button class="btn" id="rules">Правила ↗</button>
      <button class="btn pri" id="pub">Опубликовать</button>
    </div>
  </aside>

  <main class="main">
    <div class="bar"><h1 id="ttl">Загрузка…</h1>
      <button class="btn" id="revert">Отменить</button>
      <button class="btn" id="save">Сохранить</button>
    </div>
    <div id="form"></div>
    <div class="sec"><h2>Проверка</h2><div class="checks" id="checks"></div></div>
  </main>

  <aside class="prev">
    <div class="bar"><div class="seg" id="lang"><button data-l="ru" class="on">RU</button><button data-l="en">EN</button></div>
      <div style="flex:1"></div><button class="btn" id="reload">Обновить</button></div>
    <iframe id="frame" title="превью"></iframe>
  </aside>
</div>
<script>
const $ = (s,r=document)=>r.querySelector(s), api = (p,o)=>fetch(p,o).then(r=>r.json());
let MODEL=null, CUR=null, DATA=null, ORIG=null, LANG='ru', DIRTY=false;
let PAGES=[], MODE='case', PAGE=null, STAMP=Date.now();

const RULES = {
  'Тексты': `
<h4>Цифра, за которую отвечаешь</h4>
<p>Число производства — то, что ты видел сам, — сильнее бизнес-метрики. «Макет шёл 8 итераций, стал 2» защищается одним предложением. «+45% результативности» не защищается ничем.</p>
<h4>Второй вопрос</h4>
<p>Перед каждым числом спроси себя: <b>«а как мерил?»</b> Если ответа нет — процент убить. Одна выдуманная цифра обнуляет доверие ко всем остальным на странице, включая настоящие.</p>
<h4>Чужое подписывать</h4>
<p>Аудитория продукта, выручка компании, награда фирмы — это не твой результат. Пиши прямо: «компания на этом отрезке…». Разделение «вот моё, вот компании» звучит сильнее, чем присвоение.</p>
<h4>Факт закрывает боль</h4>
<p>Сколько болей назвал в «Задаче» — столько исходов от тебя ждут в фактах. Факт, который пересказывает «Решение», — не доказательство, а повтор.</p>
<h4>Когда спросят «а где цифры?»</h4>
<p>«Выручку и конверсию компании показать не могу и выдумывать не буду. Вот что мерил сам: … Что на этом сделала компания — публично: …»</p>`,
  'Картинки': `
<h4>Как добавить</h4>
<p>Перетащи <code>.webp</code> в блок медиа. Имя задаётся автоматически по кейсу: <code>duft-5</code>, <code>duft-6</code>. Уменьшенные копии для телефонов (<code>-480</code>, <code>-960</code>, <code>-1440</code>) делаются тут же, ждать деплоя не надо.</p>
<h4>Только webp</h4>
<p>Другие форматы сайт не использует. Экспортируй из Figma сразу в webp, ширина оригинала 1920 для полноширинных и 940 для парных.</p>
<h4>Строка на две картинки</h4>
<p>Кнопка «+ пара» ставит две картинки в ряд. На телефоне они всё равно встанут одна под другой.</p>
<h4>Alt обязателен</h4>
<p>Его читают поисковик и незрячие. Опиши, что на кадре, а не «картинка 3». Пустой alt подсветится в проверке.</p>
<h4>Видео</h4>
<p>Блоки с видео помечены замком и не редактируются — их разметка собрана руками, ломать её кнопкой нельзя. Нужно поменять — скажи.</p>`,
  'Публикация': `
<h4>Три шага</h4>
<p><b>1.</b> «Сохранить» — правки ложатся в файлы на диске, сайт ещё прежний.<br>
<b>2.</b> «Опубликовать» — показывает, что именно уйдёт, и ждёт подтверждения.<br>
<b>3.</b> Подтверждаешь — уходит на GitHub, сборка идёт сама, через пару минут сайт обновлён.</p>
<h4>Ничего вводить не надо</h4>
<p>Логин берётся из твоего GitHub Desktop. Паролей и токенов CMS не хранит.</p>
<h4>Если что-то пошло не так</h4>
<p>При ошибке на любом шаге публикация останавливается и файлы не отправляются. Откатить уже опубликованное — в GitHub Desktop: History, правой кнопкой по коммиту, Revert.</p>
<h4>Кэш</h4>
<p>GitHub держит страницу до десяти минут. Если правки «не видно» — Ctrl+Shift+R.</p>`,
  'Чего не делать': `
<h4>Манифест правится не здесь</h4>
<p>Главная страница собрана уникальной вёрсткой, а не шаблоном. Через CMS её не открыть — это защита, а не недоделка.</p>
<h4>Не переименовывай кейсы</h4>
<p>Номер кейса <code>01…10</code> — это адрес страницы и ссылки «следующий проект». Менять его должен я.</p>
<h4>Не удаляй картинку, которая где-то стоит</h4>
<p>Удаление из блока убирает её со страницы, но файл остаётся на диске. Так и надо: он может использоваться в превью портфолио.</p>
<h4>Папка cms</h4>
<p>На сайт она не попадает: исключена в сборке и проверяется отдельно. Ничего из неё посетитель не увидит.</p>`,
};

/* ── подсказки ── */
let tipEl=null;
function tip(el,text){
  hideTip(); tipEl=document.createElement('div'); tipEl.className='tip'; tipEl.innerHTML=text;
  document.body.appendChild(tipEl);
  const r=el.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
  tipEl.style.left=Math.min(r.left, innerWidth-t.width-14)+'px';
  tipEl.style.top=(r.bottom+7+t.height>innerHeight? r.top-t.height-7 : r.bottom+7)+'px';
}
const hideTip=()=>{ if(tipEl){tipEl.remove(); tipEl=null;} };
addEventListener('scroll',hideTip,true);

function toast(msg,ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); return t; }

/* ── список кейсов ── */
async function boot(){
  MODEL = await api('/api/model');
  drawList();
  PAGES=(await api('/api/pages')).pages;
  $('#pages').innerHTML=PAGES.map(p=>`<button class="pg" data-f="${p.file}">${p.label}</button>`).join('');
  $('#pages').onclick = e=>{ const b=e.target.closest('.pg'); if(b) openPage(b.dataset.f); };
  $('#cases').onclick = e=>{ const b=e.target.closest('.case'); if(b) open(b.dataset.n); };
  open(CUR && MODEL.cases.some(c=>c.n===CUR) ? CUR : MODEL.cases[0].n);
}

// Список кейсов: статус точкой, порядок — перетаскиванием строки.
function drawList(){
  const dot={published:'var(--ok)',hidden:'var(--warn)'};
  $('#cases').innerHTML = MODEL.cases.map(c=>
    `<button class="case${c.status!=='published'?' case--off':''}" data-n="${c.n}" draggable="true">
       <b><i class="dot" style="background:${dot[c.status]}" title="${MODEL.statusRu[c.status]}"></i>${c.n} · ${c.title||'без названия'}</b>
       <span>${c.year||'—'} · ${c.role||'—'}${c.status!=='published'?' · '+MODEL.statusRu[c.status]:''}</span>
     </button>`).join('');
  let drag=null;
  for(const el of $('#cases').querySelectorAll('.case')){
    el.ondragstart=e=>{ drag=el; el.style.opacity=.4; e.dataTransfer.effectAllowed='move'; };
    el.ondragend=()=>{ el.style.opacity=1; drag=null; saveOrder(); };
    el.ondragover=e=>{ e.preventDefault(); if(!drag||drag===el) return;
      const r=el.getBoundingClientRect();
      el.parentNode.insertBefore(drag, (e.clientY-r.top)/r.height>.5 ? el.nextSibling : el); };
  }
}
async function saveOrder(){
  const ids=[...$('#cases').querySelectorAll('.case')].map(b=>b.dataset.n);
  if(ids.join()===MODEL.cases.map(c=>c.n).join()) return;
  toast('Меняю порядок…');
  const r=await api('/api/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ids})});
  MODEL=await api('/api/model'); drawList(); markCur(); refreshPreview();
  toast(r.ok?'Порядок сохранён. Сетка и таблица пересобраны.':'Не удалось: '+(r.out||''));
}
const markCur=()=>document.querySelectorAll('.case').forEach(b=>b.classList.toggle('on',b.dataset.n===CUR));

async function open(n){
  if(DIRTY && !confirm('Есть несохранённые правки. Уйти и потерять их?')) return;
  MODE='case'; PAGE=null; document.querySelectorAll('.pg').forEach(b=>b.classList.remove('on'));
  CUR=n; DATA=await api('/api/case/'+n); ORIG=JSON.parse(JSON.stringify(DATA)); DIRTY=false;
  markCur();
  const meta=MODEL.cases.find(c=>c.n===n)||{};
  $('#ttl').innerHTML = `${n} · ${esc(DATA.dict.ru['p.title']||'без названия')}`
    + ` <span class="badge badge--${meta.status}">${MODEL.statusRu[meta.status]||''}</span>`;
  render(); refreshPreview(); check();
}

function field(f){
  const ru=DATA.dict.ru[f.k]??'', en=DATA.dict.en[f.k]??'';
  const tag=f.kind==='text'?'textarea':'input';
  const rows=f.kind==='text'?(f.k.startsWith('p.f')||f.k==='p.lead'?2:5):'';
  const mk=(lang,val)=>`<div><div class="lang">${lang.toUpperCase()}</div><${tag} data-k="${f.k}" data-l="${lang}" ${rows?`rows="${rows}"`:''}>${tag==='textarea'?esc(toEditor(val)):''}</${tag}></div>`;
  return `<div class="f"><label>${f.label}${f.optional?' <span class="opt">· необязательно</span>':''}
      <button class="i" data-hint="${esc(f.hint)}">i</button></label>
    <div class="pair">${mk('ru',ru)}${mk('en',en)}</div></div>`;
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Неразрывный пробел в текстах записан как &nbsp; — он держит предлоги, чтобы
   «в» и «на» не висели в конце строки. Показывать эту абракадабру в поле нельзя,
   терять её тоже нельзя. Поэтому в редакторе она живёт настоящим символом
   (выглядит обычным пробелом), а при сохранении возвращается в разметку.
   Переносы <br> в поле показываем переводом строки — так же честно. */
const NB='\u00a0';
const toEditor=v=>String(v??'').replace(/&nbsp;/g,NB).replace(/<br\s*\/?>/gi,'\n');
const fromEditor=v=>String(v??'').replace(new RegExp(NB,'g'),'&nbsp;').replace(/\r?\n/g,'<br>');

/* Расстановка неразрывных пробелов по правилу, по которому набран сайт:
   после коротких слов (до двух букв) и перед тире. */
function bindShort(v){
  return String(v??'')
    .replace(new RegExp('(^|[\\s'+NB+'(«"])([А-Яа-яЁёA-Za-z]{1,2})\\s+','g'), '$1$2'+NB)
    .replace(/\s+—/g, NB+'—');
}

  const meta=MODEL.cases.find(c=>c.n===CUR)||{status:'published',cover:{}};
  let h=`<div class="sec"><h2>Кейс</h2>
    <div class="f"><label>Где показывается <button class="i" data-hint="«На сайте» — кейс в сетке портфолио, в таблице манифеста и в карте сайта. «Скрыт» — исчезает из сетки, таблицы и поиска, но страница остаётся на своём адресе и содержимое цело. Вернуть можно в любой момент одним кликом, ничего заново заполнять не надо.">i</button></label>
      <div class="seg seg--wide" id="statusSeg">
        ${MODEL.statuses.map(s=>`<button data-s="${s}" class="${s===meta.status?'on':''}">${MODEL.statusRu[s]}</button>`).join('')}
      </div></div>
    <div class="f"><label>Обложка в сетке <button class="i" data-hint="Картинка карточки в портфолио. Обычно это отдельный файл вида slug-preview.webp. Перетащи новую или впиши имя без .webp.">i</button></label>
      <div class="mi"><img src="${meta.cover&&meta.cover.poster?'/assets/img/'+meta.cover.poster+'.webp':''}" alt="">
        <div><input id="cover" value="${esc((meta.cover||{}).poster||'')}" placeholder="имя файла без .webp">
        <div class="drop" id="dropCover" style="margin-top:6px;padding:10px">перетащи обложку или нажми, чтобы выбрать</div></div></div></div>
    <div class="f"><label>Год <button class="i" data-hint="Показывается в трёх местах: шапка кейса, карточка портфолио, таблица на манифесте. Можно диапазон: 2023—2026.">i</button></label>
      <input id="year" value="${esc(DATA.year)}" style="max-width:200px"></div>

    </div></div>`;
  for(const [name,keys] of groups){
    h+=`<div class="sec"><h2>${name}</h2>`+keys.map(k=>{const f=MODEL.fields.find(x=>x.k===k); return f?field(f):'';}).join('')+`</div>`;
  }
  h+=`<div class="sec"><h2>Картинки</h2><div class="media" id="media"></div>
      <div style="display:flex;gap:7px;margin-top:9px"><button class="btn" id="addFull">+ во всю ширину</button><button class="btn" id="addRow">+ пара</button></div></div>`;
  $('#form').innerHTML=h;

  for(const el of $('#form').querySelectorAll('input[data-k]')) el.value = toEditor(DATA.dict[el.dataset.l][el.dataset.k]);
  $('#form').addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='year'){ DATA.year=t.value; mark(); return; }

  $('#addFull').onclick=()=>{ DATA.media.push({type:'full',src:'',alt:''}); mark(); drawMedia(); };
  $('#addRow').onclick=()=>{ DATA.media.push({type:'row',items:[{src:'',alt:''},{src:'',alt:''}]}); mark(); drawMedia(); };

  $('#dupCase').onclick=async()=>{

  $('#delCase').onclick=async()=>{

document.addEventListener('click',e=>{ if(!e.target.closest('.i')&&!e.target.closest('.tip')) hideTip(); });

function drawMedia(){
  const box=$('#media');
  const slot=(it,i,j)=>{
    const url=it.src?'/assets/img/'+it.src+'.webp?t='+STAMP:'';
    const miss=it.src&&!it.exists;
    return '<div class="slot" data-i="'+i+'" data-j="'+j+'">'
      + (it.src
          ? '<img class="slot__img" src="'+url+'" alt="" loading="lazy" data-open="'+esc(it.src)+'">'
          : '<div class="slot__empty">пусто — перетащи файл или нажми</div>')
      + '<div class="slot__acts">'
        + (it.src?'<button data-act="open">Открыть</button>':'')
        + '<button data-act="replace">'+(it.src?'Заменить':'Загрузить')+'</button>'
        + (it.src?'<button data-act="clear">Убрать</button>':'')
      + '</div>'
      + '<div class="slot__meta">'
        + (it.src?'<span class="nm">'+esc(it.src)+'.webp</span>':'<span>файл не выбран</span>')
        + (miss?'<span class="warn">нет на диске</span>':'')
        + (it.exists&&it.w?'<span>'+it.w+'×'+it.h+'</span>':'')
        + (it.exists?'<span>'+it.kb+' КБ</span>':'')
        + '<span class="sp"></span>'
        + (it.exists?(it.variants.length?'<span>копии '+it.variants.join('/')+'</span>':'<span class="warn">нет копий для телефона</span>'):'')
      + '</div>'
      + '<input class="slot__alt" data-i="'+i+'" data-j="'+j+'" data-p="alt" value="'+esc(it.alt)+'" placeholder="alt — что на кадре, одной фразой">'
      + '</div>';
  };

  box.innerHTML=DATA.media.map((m,i)=>{
    if(m.type==='raw'||m.type==='comment'){
      const label=m.type==='comment'?'заметка в разметке':'видео или особый блок';
      return '<div class="mb"><div class="mb__bar"><b>🔒 '+label+'</b><div class="sp"></div><span>не редактируется</span></div></div>';
    }
    const items=m.type==='row'?m.items:[m];
    return '<div class="mb '+(m.type==='row'?'mb--row':'mb--full')+'" data-i="'+i+'" draggable="true">'
      + '<div class="mb__bar"><span class="grab">⠿</span><b>'+(m.type==='row'?'Две в ряд':'Во всю ширину')+'</b>'
        + '<div class="sp"></div>'
        + (m.type==='full'?'<button class="x" data-act="topair">сделать парой</button>':'<button class="x" data-act="tofull">разбить</button>')
        + '<button class="x" data-act="del">удалить блок</button></div>'
      + '<div class="mb__body">'+items.map((it,j)=>slot(it,i,m.type==='row'?j:-1)).join('')+'</div></div>';
  }).join('') || '<div class="locked">Картинок пока нет.</div>';

  box.insertAdjacentHTML('beforeend',
    '<div class="drop drop--new" id="dropNew"><b>Добавить картинки</b><br>'
    + '<span style="opacity:.7">перетащи сюда или нажми, чтобы выбрать на компьютере — можно сразу несколько</span></div>');

  const at=(i,j)=>{ const m=DATA.media[i]; return j>=0?m.items[j]:m; };

  box.oninput=e=>{ const t=e.target; if(t.dataset.p!=='alt') return;
    at(+t.dataset.i,+t.dataset.j).alt=t.value; mark(); };

  box.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    const mb=e.target.closest('.mb'); const sl=e.target.closest('.slot');
    const i=mb?+mb.dataset.i:-1;
    const act=b.dataset.act;
    if(act==='del'){ if(confirm('Убрать блок со страницы? Сами файлы останутся на диске.')){ DATA.media.splice(i,1); mark(); drawMedia(); } return; }
    if(act==='topair'){ const m=DATA.media[i]; DATA.media[i]={type:'row',items:[{...m},{src:'',alt:''}]}; mark(); drawMedia(); return; }
    if(act==='tofull'){ const m=DATA.media[i]; DATA.media.splice(i,1,...m.items.filter(x=>x.src).map(x=>({type:'full',...x}))); mark(); drawMedia(); return; }
    if(!sl) return;
    const j=+sl.dataset.j, it=at(i,j);
    if(act==='open') return lightbox(it,i,j);
    if(act==='clear'){ Object.assign(it,{src:'',alt:'',w:'',h:'',exists:false,kb:0,variants:[]}); mark(); drawMedia(); return; }
    if(act==='replace') return pickFile(async f=>{ await putImage(f,it,i,j); });
  };

  // клик по самой картинке — открыть
  for(const im of box.querySelectorAll('.slot__img')){
    im.onclick=()=>{ const sl=im.closest('.slot'); lightbox(at(+sl.dataset.i,+sl.dataset.j),+sl.dataset.i,+sl.dataset.j); };
  }

  // на слот можно и перетащить файл, и кликнуть по пустому месту
  for(const sl of box.querySelectorAll('.slot')){
    const i=+sl.dataset.i, j=+sl.dataset.j;
    wireDrop(sl,{guard:()=>!!drag,onFiles:f=>putImage(f, at(i,j), i, j)});
    // у заполненного слота клик по картинке открывает просмотр, а не файловое окно
    if(at(i,j).src) sl.onclick=e=>{ if(e.target.closest('button')) return; lightbox(at(i,j),i,j); };
  }

  // перестановка блоков мышью
  let drag=null;
  for(const mb of box.querySelectorAll('.mb')){
    mb.ondragstart=e=>{ drag=mb; mb.classList.add('mb--drag'); e.dataTransfer.effectAllowed='move'; };
    mb.ondragend=()=>{ mb.classList.remove('mb--drag');
      const order=[...box.querySelectorAll('.mb')].map(x=>+x.dataset.i);
      DATA.media=order.map(k=>DATA.media[k]).concat(DATA.media.filter((m,k)=>!order.includes(k)));
      drag=null; mark(); drawMedia(); };
    mb.ondragover=e=>{ if(!drag||drag===mb) return; e.preventDefault();
      const r=mb.getBoundingClientRect();
      box.insertBefore(drag,(e.clientY-r.top)/r.height>.5?mb.nextSibling:mb); };
  }

  // общая зона: новые картинки в конец
  const dn=$('#dropNew');
  wireDrop(dn,{multiple:true,guard:()=>!!drag,onFiles:async files=>{
    const label=dn.innerHTML; dn.textContent='загружаю…';
    let n=0;
    for(const f of files){
      const r=await fetch('/api/upload?stem='+encodeURIComponent(stemOfCase()),{method:'POST',body:f}).then(x=>x.json());
      if(r.error){ toast(r.error,4000); break; }
      DATA.media.push({type:'full',src:r.name,alt:'',w:r.w,h:r.h,exists:true,kb:0,variants:r.variants}); n++;
    }
    dn.innerHTML=label;
    if(n){ STAMP=Date.now(); mark(); drawMedia(); toast(n===1?'Картинка добавлена — впиши alt.':'Добавлено '+n+'. Впиши alt каждой.'); }
  }});
}

// Заменить файл в конкретном слоте. Если слот пустой — заливаем как новую
// картинку; если занят — перезаписываем ТОТ ЖЕ файл, чтобы ссылки не порвались.
async function putImage(f, it, i, j){
  const busy=toast('Загружаю…', 60000);
  const url = it.src ? '/api/replace?name='+encodeURIComponent(it.src)
                     : '/api/upload?stem='+encodeURIComponent(stemOfCase());
  const r=await fetch(url,{method:'POST',body:f}).then(x=>x.json());
  busy.remove();
  if(r.error) return toast(r.error, 4500);
  Object.assign(it,{src:r.name,w:r.w,h:r.h,exists:true,kb:r.kb||0,variants:r.variants||[]});
  STAMP=Date.now();
  mark(); drawMedia();
  toast(it.src? 'Файл заменён. Копии для телефона пересозданы.' : 'Картинка загружена.');
}

function pickFile(cb,{accept='.webp,image/webp',multiple=false}={}){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept=accept; inp.multiple=multiple;
  inp.onchange=()=>{ if(inp.files.length) cb(multiple?[...inp.files]:inp.files[0]); };
  inp.click();
}

// Любая зона загрузки работает двумя способами: перетащить файл ИЛИ кликнуть
// и выбрать в окне Windows. Одно поведение на всю CMS.
function wireDrop(el,{accept='.webp,image/webp',multiple=false,match=/\.webp$/i,reject='Только .webp — экспортируй из Figma в webp.',onFiles,guard}={}){
  const take=list=>{ const ok=[...list].filter(f=>match.test(f.name));
    if(!ok.length) return toast(reject,4000);
    onFiles(multiple?ok:ok[0]); };
  el.ondragover=e=>{ if(guard&&guard()) return; e.preventDefault(); el.classList.add('hot'); };
  el.ondragleave=()=>el.classList.remove('hot');
  el.ondrop=e=>{ if(guard&&guard()) return; e.preventDefault(); e.stopPropagation(); el.classList.remove('hot'); take(e.dataTransfer.files); };
  el.onclick=e=>{ if(e.target.closest('button,a,input')) return; pickFile(f=>take(multiple?f:[f]),{accept,multiple}); };
  el.style.cursor='pointer';
}

// Просмотр картинки целиком
function lightbox(it,i,j){
  if(!it.src) return;
  const v=document.createElement('div'); v.className='lb';
  v.innerHTML='<div class="lb__top"><b>'+esc(it.src)+'.webp</b><span class="sp"></span>'
    + '<button class="btn" data-a="replace">Заменить файл</button>'
    + '<button class="btn" data-a="close">Закрыть</button></div>'
    + '<div class="lb__wrap"><img src="/assets/img/'+it.src+'.webp?t='+STAMP+'" alt=""></div>'
    + '<div class="lb__bottom"><span>'+(it.w?it.w+'×'+it.h+' · ':'')+it.kb+' КБ</span>'
    + '<span>копии: '+(it.variants&&it.variants.length?it.variants.join(' / '):'нет')+'</span>'
    + '<span>alt: '+(it.alt?esc(it.alt):'— не заполнен')+'</span></div>';
  v.onclick=e=>{
    const a=(e.target.dataset||{}).a;
    if(a==='close'||e.target===v||e.target.className==='lb__wrap') v.remove();
    if(a==='replace'){ v.remove(); pickFile(f=>putImage(f,it,i,j)); }
  };
  document.addEventListener('keydown',function esc2(e){ if(e.key==='Escape'){ v.remove(); document.removeEventListener('keydown',esc2); } });
  document.body.appendChild(v);
}

// Основа имени файлов кейса: берём из уже стоящих картинок, включая те, что внутри пар.
// Свободный номер подбирает сервер по диску — так новый файл не затрёт чужой.
function stemOfCase(){
  const names=DATA.media.flatMap(m=>m.type==='row'?m.items.map(x=>x.src):[m.src]).filter(Boolean);
  if(names.length) return names[0].replace(/-\d+$/,'');
  const t=(DATA.dict.en['p.title']||DATA.dict.ru['p.title']||'case').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return t||('case-'+CUR);
}

const mark=()=>{ DIRTY=true; $('#save').classList.add('pri'); };

// ── редактор обычной страницы (манифест, «Обо мне», шапка портфолио, 404) ──

async function renderPage(){

    + n + ' редактируемых надписей. Шапка, подвал и всё, что собирается из кейсов, здесь не показано — им владеет сборка.</p></div>';
  if(PAGE.file==='about.html'){
    const cv=await api('/api/cv');
    const row=(lang,label)=>{
      const f=cv[lang];
      return '<div class="cvrow"><div><b>'+label+'</b><div class="cvmeta">'
        + (f? esc(f.name)+' · '+f.kb+' КБ · обновлён '+f.at : '<span style="color:var(--accent)">файла нет</span>')
        + '</div></div>'
        + (f? '<a class="btn" href="/assets/cv/'+f.name+'?t='+Date.now()+'" target="_blank">Открыть</a>':'')
        + '<button class="btn pri cvpick" data-lang="'+lang+'">'+(f?'Заменить файл':'Загрузить файл')+'</button>'
        + '<div class="drop cvdrop" data-lang="'+lang+'">перетащи новый PDF или нажми, чтобы выбрать</div></div>';
    };
    h+='<div class="sec"><h2>CV — файлы</h2>'
      + '<p style="color:var(--mute);font-size:12.5px;margin:0 0 10px">Ссылка в контактах ведёт на эти файлы. Имена постоянные — заменяешь файл, ссылка остаётся рабочей. На русской странице открывается русское CV, на английской — английское.</p>'
      + row('ru','Русское') + row('en','Английское') + '</div>';
  }
  for(const g of PAGE.groups){
    h+='<div class="sec"><h2>'+esc(g.label)+'</h2>'+g.keys.map(k=>{
      const ru=PAGE.dict.ru[k]??'', en=PAGE.dict.en[k]??'';
      const long=String(toEditor(ru)).length>60||String(ru).includes('<br>');
      const tag=long?'textarea':'input';
      const fld=(lang,val)=>'<div><div class="lang">'+lang.toUpperCase()+'</div><'+tag+' data-pk="'+esc(k)+'" data-l="'+lang+'"'
        +(long?' rows="'+(String(val).length>200?4:2)+'"':'')+'>'+(tag==='textarea'?esc(toEditor(val)):'')+'</'+tag+'></div>';
      return '<div class="f"><label><code style="font-size:11px;opacity:.7">'+esc(k)+'</code>'
        + (String(en).trim()===''&&String(ru).trim()!==''? ' <span style="color:var(--warn)">· нет перевода</span>':'')
        + '</label><div class="pair">'+fld('ru',ru)+fld('en',en)+'</div></div>';
    }).join('')+'</div>';
  }
  $('#form').innerHTML=h;
  for(const el of $('#form').querySelectorAll('input[data-pk]')) el.value=toEditor(PAGE.dict[el.dataset.l][el.dataset.pk]);
  // CV: заменить можно тремя способами — кнопкой, кликом по зоне и перетаскиванием
  for(const btn of $('#form').querySelectorAll('.cvpick')){
    btn.onclick=e=>{ e.stopPropagation();
      pickFile(f=>uploadCv(f, btn.dataset.lang), {accept:'.pdf,application/pdf'}); };
  }
  for(const dz of $('#form').querySelectorAll('.cvdrop')){
    wireDrop(dz,{accept:'.pdf,application/pdf',match:/\.pdf$/i,reject:'Нужен файл .pdf',
      onFiles:f=>uploadCv(f, dz.dataset.lang, dz)});
  }
  $('#form').addEventListener('input',e=>{ const t=e.target;
    if(t.dataset.pk){ PAGE.dict[t.dataset.l][t.dataset.pk]=fromEditor(t.value); mark(); } });
}
// Загрузка CV: одна функция на кнопку, клик по зоне и перетаскивание
async function uploadCv(f, lang, zone){
  const label = zone ? zone.textContent : null;
  if(zone) zone.textContent='загружаю…';
  const busy = zone ? null : toast('Загружаю…', 60000);
  const r=await fetch('/api/cv/upload?lang='+lang,{method:'POST',body:f}).then(x=>x.json());
  if(busy) busy.remove();
  if(zone) zone.textContent=label;
  if(r.error) return toast(r.error, 4500);
  toast('CV заменено ('+r.kb+' КБ). Не забудь «Опубликовать».', 4000);
  await renderPage();
}

async function savePage(){
  const r=await api('/api/page/'+encodeURIComponent(PAGE.file),{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({dict:PAGE.dict})});
  DIRTY=false; $('#save').classList.remove('pri'); ORIG=JSON.parse(JSON.stringify(PAGE.dict));
  $('#frame').src='/'+(PAGE.file==='index.html'?'':PAGE.file)+'?t='+Date.now();
  toast(r.ok?'Страница сохранена. На сайт — кнопкой «Опубликовать».':'Ошибка сборки: '+(r.out||''));
}

async function save(){
  const r=await api('/api/case/'+CUR,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(DATA)});
  DIRTY=false; $('#save').classList.remove('pri'); ORIG=JSON.parse(JSON.stringify(DATA));
  drawChecks(r.problems); refreshPreview(); toast('Сохранено на диск. На сайт — кнопкой «Опубликовать».');
  MODEL=await api('/api/model');
  document.querySelectorAll('.case').forEach(b=>{ const c=MODEL.cases.find(x=>x.n===b.dataset.n);
    b.querySelector('b').textContent=`${c.n} · ${c.title||'—'}`; b.querySelector('span').textContent=`${c.year||''} · ${c.role||''}`; });
}
async function check(){ drawChecks((await api('/api/validate')).problems); }
function drawChecks(ps){
  const mine=(ps||[]).filter(p=>p.n===CUR), other=(ps||[]).length-mine.length;
  $('#checks').innerHTML = (mine.length? mine.map(p=>`<div class="chk ${p.lvl}"><span class="n">${p.n}</span><span>${p.msg}</span></div>`).join('')
    : '<div class="empty">В этом кейсе замечаний нет.</div>')
    + (other? `<div class="chk info"><span class="n">···</span><span>Ещё ${other} замечани${other%10===1&&other%100!==11?'е':'й'} в других кейсах — покажутся при публикации.</span></div>`:'');
}

function refreshPreview(){
  const path = MODE==='page' ? (PAGE.file==='index.html'?'/':'/'+PAGE.file) : `/projects/${CUR}.html`;
  $('#frame').src=(LANG==='en'?'/en':'')+path+'?t='+Date.now();
}
$('#lang').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
  LANG=b.dataset.l; $('#lang').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); refreshPreview(); };
$('#reload').onclick=refreshPreview;
$('#save').onclick=()=>MODE==='page'?savePage():save();
$('#revert').onclick=()=>{ if(!confirm('Вернуть поля к последнему сохранению?')) return;
  if(MODE==='page'){ PAGE.dict=JSON.parse(JSON.stringify(ORIG)); DIRTY=false; renderPage(); }
  else { DATA=JSON.parse(JSON.stringify(ORIG)); DIRTY=false; render(); } };
addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); MODE==='page'?savePage():save(); } });
addEventListener('beforeunload',e=>{ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });

/* ── правила ── */
$('#addCase').onclick=async()=>{
  const title=prompt('Название нового кейса:\n\nОн создастся скрытым — на сайт не попадёт, пока сам не переключишь.');
  if(!title) return;
  toast('Создаю…');
  const r=await api('/api/case/new',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title})});
  if(r.error) return toast(r.error);
  MODEL=await api('/api/model'); drawList(); await open(r.id);
  toast('Кейс '+r.id+' создан. Заполни поля и переключи статус на «на сайте».', 4200);
};

$('#rules').onclick=()=>{
  const names=Object.keys(RULES);
  const v=document.createElement('div'); v.className='veil';
  v.innerHTML=`<div class="modal"><header><h3>Правила</h3><button class="btn" data-close>Закрыть</button></header>
    <div class="tabs">${names.map((n,i)=>`<button data-t="${i}" class="${i?'':'on'}">${n}</button>`).join('')}</div>
    <div class="body" id="rbody">${RULES[names[0]]}</div></div>`;
  v.onclick=e=>{ if(e.target===v||e.target.dataset.close!==undefined) v.remove();
    const t=e.target.closest('[data-t]'); if(t){ v.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===t)); $('#rbody',v).innerHTML=RULES[names[+t.dataset.t]]; } };
  document.body.appendChild(v);
};

/* ── публикация ── */
$('#pub').onclick=async()=>{
  if(DIRTY && !confirm('Есть несохранённые правки — они не уйдут. Сначала «Сохранить»?\n\nOK — публиковать без них.')) return;
  const [ch,val]=await Promise.all([api('/api/changes'),api('/api/validate')]);
  const errs=val.problems.filter(p=>p.lvl==='err'), warns=val.problems.filter(p=>p.lvl!=='err');
  const v=document.createElement('div'); v.className='veil';
  v.innerHTML=`<div class="modal"><header><h3>Опубликовать на сайт</h3><button class="btn" data-close>Отмена</button></header>
    <div class="body">
      <h4>Что уйдёт — ${ch.files.length} файл(ов)</h4>
      ${ch.files.length? `<div class="steps">${ch.files.map(f=>`<div>${esc(f)}</div>`).join('')}</div>` : '<p>Изменений нет — на сайте уже актуальная версия.</p>'}
      ${errs.length? `<h4 style="color:var(--accent)">Ошибки — публикация не пойдёт</h4>${errs.map(p=>`<p>${p.n}: ${p.msg}</p>`).join('')}`:''}
      ${warns.length? `<h4>Замечания — ${warns.length}, публиковать можно</h4>${warns.slice(0,8).map(p=>`<p>${p.n}: ${p.msg}</p>`).join('')}${warns.length>8?`<p>…и ещё ${warns.length-8}</p>`:''}`:''}
      <h4>Подпись к правке</h4><input id="msg" value="Правки через CMS">
      <div id="log" style="margin-top:14px"></div>
    </div>
    <footer><button class="btn" data-close>Отмена</button><button class="btn pri" id="go" ${errs.length||!ch.files.length?'disabled':''}>Опубликовать</button></footer></div>`;
  v.onclick=e=>{ if(e.target===v||e.target.dataset.close!==undefined) v.remove(); };
  document.body.appendChild(v);
  $('#go',v).onclick=async()=>{
    const go=$('#go',v); go.disabled=true; go.textContent='публикую…';
    $('#log',v).innerHTML='<div class="steps"><div>сборка…</div></div>';
    const r=await api('/api/publish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:$('#msg',v).value})});
    $('#log',v).innerHTML=`<div class="steps">${r.steps.map(s=>`<div><span class="${s.ok?'m':'b'}">${s.ok?'✓':'✕'}</span><span>${esc(s.name)}${s.out?' — '+esc(s.out.split('\n').slice(-1)[0].slice(0,90)):''}</span></div>`).join('')}</div>`;
    if(r.published){ go.textContent='Готово'; $('#log',v).insertAdjacentHTML('beforeend',
      '<p style="margin-top:10px">Отправлено. Сборка на GitHub идёт сама — сайт обновится за пару минут. Если правок не видно: Ctrl+Shift+R.</p>'); }
    else if(r.nothing){ go.textContent='Нечего публиковать'; }
    else { go.disabled=false; go.textContent='Повторить'; }
    api('/api/changes');
  };
};

boot();
</script></body></html>
