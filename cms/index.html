// ── как смотреть: веб, планшет, телефон ─────────────────────────────────
// Рамку именно СУЖАЕМ до настоящей ширины устройства, а не масштабируем
// картинку: сайт должен сам переключить медиазапросы, иначе проверка врёт.
// Выбор запоминается — обычно смотришь то в одном режиме, то в другом.
const DEVS={ web:{w:1440,name:'десктоп'}, tab:{w:820,name:'планшет'}, mob:{w:390,name:'телефон'} };
let DEV=localStorage.getItem('cms.dev')||'web';
function fitDev(){
  const box=$('#devbox'), fr=$('#frame'), st=$('#stage');
  const W=DEVS[DEV].w;
  const availW=Math.max(120, st.clientWidth-28), availH=Math.max(120, st.clientHeight-28);
  const k=Math.min(1, availW/W);
  box.style.width=Math.round(W*k)+'px'; box.style.height=availH+'px';
  fr.style.width=W+'px'; fr.style.height=Math.round(availH/k)+'px';
  fr.style.transform=k<1?'scale('+k+')':'none';
  $('#devnote').textContent=W+' px · '+DEVS[DEV].name+(k<1?' · масштаб '+Math.round(k*100)+'%':'');
}
function setDev(d){
  DEV=DEVS[d]?d:'web'; localStorage.setItem('cms.dev',DEV);
  $('#stage').className='stage '+DEV;
  $('#dev').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.d===DEV));
  fitDev();
}
$('#dev').onclick=e=>{ const b=e.target.closest('button'); if(b) setDev(b.dataset.d); };
addEventListener('resize',fitDev);

// ── подвижная граница между полями и превью ─────────────────────────────
// Тянем мышкой; двойной щелчок возвращает исходное. Ширину держим в
// процентах, чтобы она пережила смену размера окна.
(function(){
  const g=$('#grip'), app=document.querySelector('.app');
  const put=pc=>{ app.style.setProperty('--prevw', pc.toFixed(2)+'%'); localStorage.setItem('cms.prevw',pc.toFixed(2)); fitDev(); };
  const saved=parseFloat(localStorage.getItem('cms.prevw'));
  if(saved>15 && saved<85) put(saved);
  let on=false;
  const move=e=>{ if(!on) return;
    const pc=(innerWidth-e.clientX)/innerWidth*100;
    put(Math.min(82, Math.max(18, pc))); };
  const up=()=>{ if(!on) return; on=false; g.classList.remove('drag');
    document.body.classList.remove('resizing'); fitDev(); };
  g.onmousedown=e=>{ e.preventDefault(); on=true; g.classList.add('drag'); document.body.classList.add('resizing'); };
  addEventListener('mousemove',move); addEventListener('mouseup',up);
  g.ondblclick=()=>{ localStorage.removeItem('cms.prevw'); app.style.removeProperty('--prevw'); fitDev(); };
})();

setDev(DEV);

/* ── правила ── */
/* После отправки сборка на GitHub идёт ещё пару минут. Показываем, где она,
   и когда правки реально стали видны на сайте. */
let deployTimer=null;
function watchDeploy(){
  const bar=$('#deployBar');
  clearInterval(deployTimer);
  let ticks=0;
  const paint=(cls,html)=>{ bar.hidden=false; bar.className='deploybar'+(cls?' '+cls:''); bar.innerHTML=html; };
  paint('', '<span class="dot2"></span><span>Отправлено. GitHub собирает сайт…</span><span class="sp"></span>');
  const check=async()=>{
    ticks++;
    let d; try{ d=await api('/api/deploy'); }catch(e){ return; }
    if(d.unknown){ paint('', '<span class="dot2"></span><span>Отправлено. Состояние сборки узнать не удалось'+(d.why?' ('+d.why+')':'')+'.</span><span class="sp"></span><button class="btn" onclick="this.closest(\'.deploybar\').hidden=true">Скрыть</button>'); clearInterval(deployTimer); return; }
    if(d.status!=='completed'){
      paint('', '<span class="dot2"></span><span>Собирается версия '+esc(d.sha)+'…</span><span class="sp"></span><a href="'+d.url+'" target="_blank">смотреть на GitHub ↗</a>');
    } else if(d.conclusion==='success'){
      paint('ok', '<span class="dot2"></span><span>Опубликовано. Правки на сайте.</span><span class="sp"></span><a href="'+d.site+'" target="_blank">открыть сайт ↗</a><button class="btn" onclick="this.closest(\'.deploybar\').hidden=true">Скрыть</button>');
      clearInterval(deployTimer);
    } else {
      paint('bad', '<span class="dot2"></span><span>Сборка не прошла ('+esc(String(d.conclusion))+'). На сайте осталась прежняя версия.</span><span class="sp"></span><a href="'+d.url+'" target="_blank">посмотреть почему ↗</a>');
      clearInterval(deployTimer);
    }
    if(ticks>24) clearInterval(deployTimer);   // около шести минут и хватит
  };
  check();
  deployTimer=setInterval(check, 15000);
}

/* ── публикация ── */
$('#pub').onclick=async()=>{
  if(DIRTY && !confirm('Есть несохранённые правки — они не уйдут. Сначала «Сохранить»?\n\nOK — публиковать без них.')) return;
  const [ch,val]=await Promise.all([api('/api/changes'),api('/api/validate')]);
  const errs=val.problems.filter(p=>p.lvl==='err'), warns=val.problems.filter(p=>p.lvl!=='err');
  const v=document.createElement('div'); v.className='veil';
  v.innerHTML=`<div class="modal"><header><h3>Опубликовать на сайт</h3><button class="btn" data-close>Отмена</button></header>
    <div class="body">
      <h4>Что уйдёт — ${ch.files.length} файл(ов)</h4>
      ${ch.files.length? `<div class="steps">${ch.files.map(f=>`<div>${esc(f)}</div>`).join('')}</div>`
        : ch.ahead? `<p>Правок в файлах нет, но готовых версий без публикации: <b>${ch.ahead}</b>. Так бывает после отката — его тоже надо довезти до сайта.</p>`
        : '<p>Изменений нет — на сайте уже актуальная версия.</p>'}
      ${errs.length? `<h4 style="color:var(--accent)">Ошибки — публикация не пойдёт</h4>${errs.map(p=>`<p>${p.n}: ${p.msg}</p>`).join('')}`:''}
      ${warns.length? `<h4>Замечания — ${warns.length}, публиковать можно</h4>${warns.slice(0,8).map(p=>`<p>${p.n}: ${p.msg}</p>`).join('')}${warns.length>8?`<p>…и ещё ${warns.length-8}</p>`:''}`:''}
      <h4>Подпись к правке</h4><input id="msg" value="Правки через CMS">
      <div id="log" style="margin-top:14px"></div>
    </div>
    <footer><button class="btn" data-close>Отмена</button><button class="btn pri" id="go" ${errs.length||(!ch.files.length&&!ch.ahead)?'disabled':''}>Опубликовать</button></footer></div>`;
  v.onclick=e=>{ if(e.target===v||e.target.dataset.close!==undefined) v.remove(); };
  document.body.appendChild(v);
  $('#go',v).onclick=async()=>{
    const go=$('#go',v); go.disabled=true; go.textContent='публикую…';
    $('#log',v).innerHTML='<div class="steps"><div>сборка…</div></div>';
    const r=await api('/api/publish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:$('#msg',v).value})});
    $('#log',v).innerHTML=`<div class="steps">${r.steps.map(s=>`<div><span class="${s.ok?'m':'b'}">${s.ok?'✓':'✕'}</span><span>${esc(s.name)}${s.out?' — '+esc(s.out.split('\n').slice(-1)[0].slice(0,90)):''}</span></div>`).join('')}</div>`;
    if(r.published) watchDeploy();
    if(r.published){ go.textContent='Готово'; $('#log',v).insertAdjacentHTML('beforeend',
      '<p style="margin-top:10px">Отправлено. Сборка на GitHub идёт сама — сайт обновится за пару минут. Если правок не видно: Ctrl+Shift+R.</p>'); }
    else if(r.nothing){ go.textContent='Нечего публиковать'; }
    else { go.disabled=false; go.textContent='Повторить'; }
    api('/api/changes');
  };
};
