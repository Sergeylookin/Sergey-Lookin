<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS · Портфолио</title>
<style>
:root{
  --bg:#0b0b0d; --panel:#131316; --line:#26262b; --ink:#e8e8ea; --mute:#8a8a93;
  --accent:#e2543a; --ok:#4a9d6a; --warn:#c9973f;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"Inter Tight",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:#0e0e11;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:#4a4a55}
.app{display:grid;grid-template-columns:210px minmax(340px,1fr) 6px minmax(320px,var(--prevw,44%));height:100vh}
/* Граница между полями и превью двигается мышкой: иногда важнее видеть текст,
   иногда — сайт целиком. Ширина запоминается. */
.grip{cursor:col-resize;background:var(--line);position:relative}
.grip::after{content:"";position:absolute;inset:0 -4px;}
.grip:hover,.grip.drag{background:var(--ink)}
body.resizing{cursor:col-resize;user-select:none}
body.resizing iframe{pointer-events:none}

/* ── левая колонка ── */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:14px 16px;border-bottom:1px solid var(--line);font:600 13px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.brand small{display:block;color:var(--mute);font-weight:400;letter-spacing:.04em;text-transform:none;margin-top:3px}
.cases{overflow:auto;flex:1 1 auto;min-height:180px;padding:6px}
.case{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:6px;color:var(--mute);line-height:1.3}
.case:hover{background:#1b1b1f;color:var(--ink)}
.case.on{background:#1f1f24;color:var(--ink)}
.case b{display:block;font-weight:600;font-size:13px}
.case span{font:11px var(--mono);opacity:.65}
.sidefoot{border-top:1px solid var(--line);padding:10px;display:grid;gap:6px}
.grouphead{flex:none;padding:9px 16px 5px;border-top:1px solid var(--line);font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#5c5c66}
.pages{padding:4px 6px 8px;flex:none;overflow:auto}
.pg{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--mute);font-size:13px}
.pg:hover{background:#1b1b1f;color:var(--ink)}
.pg.on{background:#1f1f24;color:var(--ink)}

/* ── центр ── */
.main{overflow:auto;min-height:0;padding:0 0 80px}
.bar{position:sticky;top:0;z-index:5;background:rgba(11,11,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;gap:10px;align-items:center}
.bar h1{margin:0;font-size:15px;font-weight:600;flex:1}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:#17171b;font-size:13px}
.btn:hover{border-color:#43434e}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default}
.sec{padding:18px 20px;border-bottom:1px solid var(--line)}
/* 1. полоска разделов: форма кейса в 60+ экранов, без неё не найти нужное */
.secnav{position:sticky;top:47px;z-index:4;display:flex;gap:2px;overflow-x:auto;padding:7px 20px;
  background:rgba(11,11,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav button{flex:none;padding:5px 10px;border-radius:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.secnav button:hover{background:#1b1b1f;color:var(--ink)}
.secnav button.on{background:#1f1f24;color:var(--ink)}
.secnav .n{font:10px var(--mono);opacity:.6;margin-left:5px}
.sec>h2{cursor:pointer;user-select:none;display:flex;align-items:center;gap:7px}
.sec>h2::before{content:'▾';font-size:9px;opacity:.5;transition:transform .15s}
.sec.folded>h2::before{transform:rotate(-90deg)}
.sec.folded>*:not(h2){display:none}
/* 2. счётчик замечаний в шапке — раньше они висели на 5000 px ниже */
.chkbadge{display:none;align-items:center;gap:6px;padding:5px 11px;border-radius:6px;font-size:12.5px;
  border:1px solid var(--warn);color:var(--warn);background:rgba(201,151,63,.08)}
.chkbadge.on{display:inline-flex}
.chkbadge.err{border-color:var(--accent);color:var(--accent);background:rgba(226,84,58,.08)}
.chkpop{position:absolute;top:44px;right:20px;z-index:30;width:min(520px,72vw);max-height:52vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
/* 3. восстановление черновика */
.draftbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:rgba(201,151,63,.1);
  border-bottom:1px solid var(--warn);font-size:12.5px;color:#e7d9bd}
.draftbar .sp{flex:1}
.draftbar button{padding:5px 11px;border-radius:6px;border:1px solid var(--warn);color:var(--warn);font-size:12px}
.draftbar button.no{border-color:var(--line);color:var(--mute)}
/* 4. подсветка блока, который правишь */
.f.editing>label{color:var(--ink)}
.savecount{font:10px var(--mono);opacity:.75;margin-left:5px}
/* Поле с оформлением: человек видит текст, а не теги. Жирное — жирным,
   подсвеченное число — подсвеченным. Разметка живёт под капотом. */
.rf{font:inherit;color:var(--ink);background:#0e0e11;border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;width:100%;min-height:38px;white-space:pre-wrap;word-break:break-word;line-height:1.5;outline:0}
.rf:focus{border-color:#4a4a55;background:#121216}
.rf:empty::before{content:attr(data-ph);color:#4d4d57}
.rf b,.rf strong{font-weight:700;color:#fff}
.rf em{font-style:italic}
.rf span.num{color:var(--accent);font-weight:600;background:rgba(226,84,58,.1);border-radius:3px;padding:0 3px}
.rf--one{min-height:0;white-space:pre;overflow-x:auto}
.rtool{position:fixed;z-index:110;display:flex;gap:2px;padding:3px;border-radius:8px;
  background:#22222a;border:1px solid #3a3a44;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.rtool button{padding:4px 9px;border-radius:5px;font-size:12px;color:#dcdce2;white-space:nowrap}
.rtool button:hover{background:#32323c}
.rtool b{font-weight:700}
.rtool .nm{color:var(--accent);font-weight:600}
.rhint{font-size:11px;color:#5c5c66;margin-top:4px}
/* 8. поиск по кейсам */
.findbox{padding:8px 10px 4px}
.findbox input{font-size:12.5px;padding:6px 9px}
/* 7. метка недопереведённого кейса */
.entag{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:4px;border:1px solid var(--warn);
  color:var(--warn);font:9px var(--mono);letter-spacing:.06em;vertical-align:middle}
/* 6. отмена отдельного поля */
.f.dirty>label::after{content:'изменено';font:9px var(--mono);color:var(--warn);letter-spacing:.05em}
.undo1{margin-left:auto;padding:1px 7px;border-radius:4px;border:1px solid var(--line);
  color:var(--mute);font-size:11px}
.undo1:hover{border-color:var(--accent);color:var(--accent)}
/* 9. сортировка медиатеки */
.mlbar .sortbtn{padding:5px 10px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--mute);background:#17171b}
.mlbar .sortbtn.on{border-color:#4a4a55;color:var(--ink)}
.mcard--heavy .mcard__m{color:var(--warn)}
/* 10. полоса состояния публикации */
.deploybar{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:12.5px;
  background:#141418;border-bottom:1px solid var(--line);color:#c2c2c8}
.deploybar .dot2{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;animation:pulse 1.1s infinite}
.deploybar.ok .dot2{background:var(--ok);animation:none}
.deploybar.bad .dot2{background:var(--accent);animation:none}
.deploybar a{color:var(--ink)}
.deploybar .sp{flex:1}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sec>h2{margin:0 0 12px;font:600 11px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--mute)}
.f{margin-bottom:13px}
.f>label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-bottom:5px}
.i{width:15px;height:15px;border-radius:50%;border:1px solid #3a3a44;color:var(--mute);font:600 10px/13px var(--mono);text-align:center;flex:none}
.i:hover{border-color:var(--accent);color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .lang{font:10px var(--mono);color:#5c5c66;letter-spacing:.1em;margin-bottom:3px}
.opt{color:#5c5c66}

/* ── медиа ── */
.media{display:grid;gap:8px}
.row-m{border:1px solid var(--line);border-radius:8px;padding:9px;background:#0e0e11}
.row-m .head{display:flex;gap:8px;align-items:center;margin-bottom:7px;font:11px var(--mono);color:var(--mute)}
.row-m .head b{color:var(--ink);font-weight:600}
.row-m .head .sp{flex:1}
.mi{display:grid;grid-template-columns:64px 1fr;gap:9px;align-items:start;margin-top:7px}
.mi img{width:64px;height:44px;object-fit:cover;border-radius:4px;background:#000;border:1px solid var(--line)}
.x{padding:2px 7px;border-radius:4px;border:1px solid var(--line);font-size:11px;color:var(--mute)}
.x:hover{border-color:var(--accent);color:var(--accent)}
.locked{opacity:.55;font:11px var(--mono);color:var(--mute)}
.drop{border:1px dashed #3a3a44;border-radius:8px;padding:16px;text-align:center;color:var(--mute);font-size:12px}
.drop.hot{border-color:var(--accent);color:var(--accent)}
.drop--new{margin-top:9px;padding:20px;border-style:dashed;border-width:2px;line-height:1.55}
.drop--new b{color:var(--ink);font-size:13px}
.drop:hover{border-color:#55555f;color:#b9b9c2}
/* блок медиа: показываем раскладку так, как она встанет на странице */
.mb{border:1px solid var(--line);border-radius:9px;background:#0e0e11;margin-bottom:9px;overflow:hidden}
.mb__bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--mute)}
.mb__bar .grab{cursor:grab;opacity:.6;letter-spacing:-1px}
.mb__bar b{color:var(--ink);font:600 11px var(--sans);letter-spacing:0}
.mb__bar .sp{flex:1}
.mb__body{display:grid;gap:8px;padding:9px}
.mb--row .mb__body{grid-template-columns:1fr 1fr}
.slot{position:relative;border-radius:6px;overflow:hidden;background:#000;border:1px solid var(--line)}
.slot__img{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;cursor:zoom-in}
.mb--row .slot__img{aspect-ratio:1/1}
.slot__empty{display:grid;place-items:center;width:100%;aspect-ratio:16/8;color:#5c5c66;font-size:12px;background:#141418}
.mb--row .slot__empty{aspect-ratio:1/1}
.slot__acts{position:absolute;top:6px;right:6px;display:flex;gap:5px;opacity:0;transition:opacity .15s}
.slot:hover .slot__acts{opacity:1}
.slot__acts button{background:rgba(12,12,15,.86);border:1px solid #3a3a44;border-radius:5px;padding:3px 8px;font-size:11px;color:var(--ink);backdrop-filter:blur(4px)}
.slot__acts button:hover{border-color:var(--accent);color:var(--accent)}
.slot__meta{display:flex;gap:7px;align-items:center;padding:6px 8px;font:10.5px var(--mono);color:var(--mute);background:#141418;border-top:1px solid var(--line)}
.slot__meta .nm{color:#b9b9c2}
.slot__meta .sp{flex:1}
.slot__meta .warn{color:var(--warn)}
.slot.hot{outline:2px solid var(--accent);outline-offset:-2px}
.slot__alt{width:100%;border:0;border-top:1px solid var(--line);border-radius:0;background:#0e0e11;font-size:12px;padding:7px 9px}
.slot__alt::placeholder{color:#4d4d57}
.slot__alt:focus{border-color:transparent;background:#141418}
.mb--drag{opacity:.35}
/* просмотр картинки во весь экран */
.lb{position:fixed;inset:0;z-index:120;background:rgba(6,6,8,.93);display:grid;grid-template-rows:auto 1fr auto;padding:16px 20px}
.lb__top{display:flex;align-items:center;gap:12px;color:var(--ink);font-size:13px}
.lb__top .sp{flex:1}
.lb__wrap{display:grid;place-items:center;overflow:auto;padding:12px 0}
.lb img{max-width:100%;max-height:100%;border-radius:8px;background:#000}
.lb__bottom{display:flex;gap:9px;align-items:center;justify-content:center;font:11px var(--mono);color:var(--mute)}
.fmt__box{max-width:520px;width:100%}
.fmt__lead{color:var(--ink);font-size:14px;line-height:1.5;margin:0 0 16px}
.fmt__opt{display:block;width:100%;text-align:left;margin:0 0 10px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
.fmt__opt:hover{border-color:var(--ink)}
.fmt__opt b{display:block;font-size:14px;margin-bottom:3px}
.fmt__opt i{display:block;font:12px var(--mono);font-style:normal;color:var(--ink);opacity:.85}
.fmt__opt u{display:block;text-decoration:none;font-size:12px;color:var(--mute);margin-top:5px;line-height:1.45}
.cvrow{display:grid;grid-template-columns:1fr auto;gap:9px 10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:11px;background:#0e0e11;margin-bottom:8px}
.cvrow .cvdrop{grid-column:1/-1}
a.btn{display:inline-block;text-decoration:none;white-space:nowrap}
.cvrow b{font-size:13px}
.cvmeta{font:11px var(--mono);color:var(--mute);margin-top:3px}
.cvdrop{padding:10px;font-size:11.5px;margin:0}
/* медиатека */
.mlbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mlbar input{max-width:230px}
.mlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-radius:9px;background:#0e0e11;overflow:hidden;display:flex;flex-direction:column}
.mcard.hot{outline:2px solid var(--accent);outline-offset:-2px}
.mcard__img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#000;cursor:zoom-in;display:block}
.mcard__b{padding:8px 9px;display:flex;flex-direction:column;gap:5px;flex:1}
.mcard__n{font:11px var(--mono);color:#d2d2d8;word-break:break-all}
.mcard__m{font:10.5px var(--mono);color:var(--mute)}
.mcard__u{font-size:11.5px;line-height:1.45;color:var(--mute);border-top:1px solid var(--line);padding-top:6px;margin-top:auto}
.mcard__u b{color:#b9b9c2;font-weight:500}
.mcard__free{color:var(--warn)}
.mcard__acts{display:flex;gap:5px;padding:0 9px 9px}
.mcard__acts button{flex:1;padding:5px 6px;border:1px solid var(--line);border-radius:5px;font-size:11.5px;color:var(--mute);background:#17171b}
.mcard__acts button:hover{border-color:var(--accent);color:var(--accent)}
/* компании и бренды */
.co-ed{border:1px solid var(--line);border-radius:9px;background:#0e0e11;padding:11px;margin-bottom:9px}
.co-ed__top{display:grid;grid-template-columns:130px 1fr;gap:8px;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 11px;font-size:12.5px;background:#0e0e11}
.chip button{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);color:var(--mute);font-size:11px;line-height:1}
.chip button:hover{border-color:var(--accent);color:var(--accent)}
/* история */
.hrow{display:grid;grid-template-columns:74px 108px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#0e0e11;margin-bottom:6px;font-size:12.5px}
.hrow .hh{font:11px var(--mono);color:var(--mute)}
.hrow .hd{font:11px var(--mono);color:var(--mute)}
.hrow.live{border-color:#2f5d43}
.hnow{font:10px var(--mono);color:var(--ok);letter-spacing:.06em}

/* ── превью ── */
.prev{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.prev .bar{border-bottom:1px solid var(--line);background:none;backdrop-filter:none}
.prev iframe{flex:1;width:100%;border:0;background:#fff}
/* Сцена превью. Рамке всегда даётся НАСТОЯЩАЯ ширина устройства — иначе сайт
   не переключит медиазапросы и покажет не ту вёрстку. Колонка CMS узкая, и
   без этого даже режим «Веб» уходил в мобильную раскладку. Поэтому кадр не
   сплющиваем, а уменьшаем целиком, как «зум» в инструментах браузера:
   пропорции и точки перелома остаются настоящими. */
.stage{flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden;background:var(--bg);padding:14px 0}
.devbox{overflow:hidden}
.stage iframe{flex:none;transform-origin:top left;border:1px solid var(--line);border-radius:10px;background:#fff}
.devnote{font:11px var(--mono);color:var(--mute);margin-right:10px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:5px 11px;font:11px var(--mono);color:var(--mute)}
.seg button.on{background:#1f1f24;color:var(--ink)}
.seg--wide{display:grid;grid-template-columns:repeat(3,1fr)}
.seg--wide button{padding:7px 4px;font-size:11.5px;font-family:var(--sans);letter-spacing:0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.case--off b{opacity:.6}
.badge{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mute);vertical-align:middle}
.badge--published{display:none}
.badge--hidden{color:var(--warn);border-color:var(--warn)}

/* ── проверки ── */
.checks{padding:12px 20px;display:grid;gap:6px}
.chk{display:flex;gap:8px;padding:8px 10px;border-radius:6px;font-size:12.5px;line-height:1.45;background:#141418;border-left:2px solid var(--line)}
.chk.err{border-left-color:var(--accent)} .chk.warn{border-left-color:var(--warn)} .chk.info{border-left-color:#3d5a80}
.chk .n{font:11px var(--mono);color:var(--mute);flex:none}
.empty{color:var(--ok);font-size:12.5px;padding:8px 10px}

/* ── модалки ── */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:28px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal header h3{margin:0;font-size:15px;flex:1}
.tabs{display:flex;gap:2px;padding:10px 20px 0}
.tabs button{padding:7px 13px;border-radius:6px 6px 0 0;font-size:13px;color:var(--mute)}
.tabs button.on{background:#1b1b20;color:var(--ink)}
.modal .body{padding:16px 20px 22px;overflow:auto;background:#1b1b20}
.modal .body h4{margin:16px 0 7px;font-size:13px}
.modal .body h4:first-child{margin-top:0}
.modal .body p,.modal .body li{color:#c2c2c8;font-size:13px;line-height:1.62;margin:5px 0}
.modal .body code{font:12px var(--mono);background:#0e0e11;padding:1px 5px;border-radius:3px}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.tip{position:fixed;z-index:99;max-width:330px;background:#22222a;border:1px solid #383842;border-radius:7px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:#dcdce2;box-shadow:0 8px 26px rgba(0,0,0,.5)}

<script>
const $ = (s,r=document)=>r.querySelector(s), api = (p,o)=>fetch(p,o).then(r=>r.json());
let MODEL=null, CUR=null, DATA=null, ORIG=null, LANG='ru', DIRTY=false;
let PAGES=[], MODE='case', PAGE=null, STAMP=Date.now(), FIND='', MSORT='used';

const RULES = {
  'Тексты': `
<h4>Цифра, за которую отвечаешь</h4>
<p>Число производства — то, что ты видел сам, — сильнее бизнес-метрики. «Макет шёл 8 итераций, стал 2» защищается одним предложением. «+45% результативности» не защищается ничем.</p>
<h4>Второй вопрос</h4>
<p>Перед каждым числом спроси себя: <b>«а как мерил?»</b> Если ответа нет — процент убить. Одна выдуманная цифра обнуляет доверие ко всем остальным на странице, включая настоящие.</p>
<h4>Чужое подписывать</h4>
<p>Аудитория продукта, выручка компании, награда фирмы — это не твой результат. Пиши прямо: «компания на этом отрезке…». Разделение «вот моё, вот компании» звучит сильнее, чем присвоение.</p>
<h4>Факт закрывает боль</h4>
<p>Сколько болей назвал в «Задаче» — столько исходов от тебя ждут в фактах. Факт, который пересказывает «Решение», — не доказательство, а повтор.</p>
<h4>Когда спросят «а где цифры?»</h4>
<p>«Выручку и конверсию компании показать не могу и выдумывать не буду. Вот что мерил сам: … Что на этом сделала компания — публично: …»</p>`,
  'Картинки': `
<h4>Как добавить</h4>
<p>Перетащи файл в блок медиа или нажми и выбери в окне Windows. Имя задаётся автоматически по кейсу: <code>duft-5</code>, <code>duft-6</code>. Уменьшенные копии для телефонов (<code>-480</code>, <code>-960</code>, <code>-1440</code>) делаются тут же, ждать деплоя не надо.</p>
<h4>PNG и JPG тоже можно</h4>
<p>Сайт работает на webp — он в разы легче при том же виде. Если кидаешь <code>.png</code> или <code>.jpg</code>, CMS спросит, как переводить, и покажет оба веса:</p>
<p><b>Сжать</b> — качество 90. На глаз не отличить, вес обычно в 5–10 раз меньше. Берите это.<br>
<b>Без потерь</b> — пиксель в пиксель, но тяжелее. Имеет смысл для скриншотов интерфейса с мелким текстом.</p>
<p>Файл на компьютере при этом не трогается. Ширина оригинала — 1920 для полноширинных и 940 для парных.</p>
<h4>Строка на две картинки</h4>
<p>Кнопка «+ пара» ставит две картинки в ряд. На телефоне они всё равно встанут одна под другой.</p>
<h4>Alt обязателен</h4>
<p>Его читают поисковик и незрячие. Опиши, что на кадре, а не «картинка 3». Пустой alt подсветится в проверке.</p>
<h4>Видео</h4>
<p>Разметка видео-блока заперта — её кнопкой не сломать. А сам файл меняется: в кейсе с видео есть зона «Видео-обложка», туда кидаешь <code>.mp4</code> или выбираешь кнопкой. Больше 40 МБ не берёт — тяжело для посетителя.</p>`,
  'Ссылки и контакты': `
<h4>Одно поле — три места</h4>
<p>Telegram, почта и Behance стоят на сайте трижды: экран «Давайте поговорим» на главной, колонка «Связаться» на «Обо мне» и невидимая разметка, по которой поисковики связывают профили с тобой. Раздел «Контакты и ссылки» правит все три сразу, включая английскую версию.</p>
<h4>Два поля у каждой ссылки</h4>
<p><b>Ссылка</b> — куда ведёт. Полный адрес со <code>https://</code>, для почты — со словом <code>mailto:</code> в начале.<br>
<b>Как показывать</b> — что видит человек: <code>@Lookin_Sergey</code>, <code>behance.net/…</code>. Меняешь одно — не забудь второе, иначе подпись врёт.</p>
<h4>Ещё профили</h4>
<p>Нижнее поле — ссылки, которых на страницах не видно. Они уходят только в разметку для поисковиков. По одной в строке.</p>
<h4>Почта в разметку не идёт</h4>
<p>Специально: адрес из неё собирают спам-роботы. На странице он есть, в машинной разметке — нет.</p>`,
  'Как смотреть превью': `
<h4>Веб, планшет, мобилка</h4>
<p>Три кнопки над превью. Внутри рамке даётся настоящая ширина устройства — 1440, 820 и 390 px, — поэтому сайт переключает вёрстку по-честному, как на живом экране.</p>
<h4>Масштаб</h4>
<p>Если колонка уже устройства, кадр уменьшается целиком и рядом пишется «масштаб 64%». Пропорции при этом верные: это зум, а не сжатие.</p>
<h4>Колонку можно двигать</h4>
<p>Тёмная полоска между полями и превью тянется мышкой — сайт станет шире. Двойной щелчок по ней возвращает как было. Ширина запоминается.</p>
<h4>Мобильную версию проверяй всегда</h4>
<p>Больше половины заходов — с телефона. Длинное название или метрика в две строки на десктопе смотрятся нормально, а на 390 px разъезжаются.</p>`,
  'Публикация': `
<h4>Три шага</h4>
<p><b>1.</b> «Сохранить» — правки ложатся в файлы на диске, сайт ещё прежний.<br>
<b>2.</b> «Опубликовать» — показывает, что именно уйдёт, и ждёт подтверждения.<br>
<b>3.</b> Подтверждаешь — уходит на GitHub, сборка идёт сама, через пару минут сайт обновлён.</p>
<h4>Ничего вводить не надо</h4>
<p>Логин берётся из твоего GitHub Desktop. Паролей и токенов CMS не хранит.</p>
<h4>Если что-то пошло не так</h4>
<p>При ошибке на любом шаге публикация останавливается и файлы не отправляются — сайт остаётся прежним.</p>
<h4>Откат — в разделе «История и откат»</h4>
<p>Список всех публикаций с датами. Выбираешь версию, «Откатить» — файлы возвращаются как были. Это создаёт новую версию, поэтому после отката ещё раз нажми «Опубликовать»: окно так и скажет — «правок в файлах нет, но готовых версий без публикации: 1».</p>
<p>Откатывай <b>с конца, по одной</b>. Если перескочить через несколько версий, правки поверх помешают и CMS честно об этом скажет.</p>
<h4>Кэш</h4>
<p>GitHub держит страницу до десяти минут. Если правки «не видно» — Ctrl+Shift+R.</p>`,
  'Кейсы: создать, скрыть, порядок': `
<h4>Новый кейс</h4>
<p>Кнопка «+ Новый кейс» внизу боковой колонки. Он появляется <b>скрытым</b>: на сайт не попадает, в карте сайта его нет, поисковикам закрыт. Спокойно наполняй сколько нужно — снаружи его не видно.</p>
<p>Когда готов: точка у названия в списке, «Опубликован». Тогда он встаёт в сетку портфолио, в таблицу на манифесте, в цепочку «следующий проект» и в карту сайта — всё разом, руками ничего связывать не надо.</p>
<h4>Скрыть старый</h4>
<p>Тот же переключатель обратно в «Скрыт». Ссылки соседей пересобираются, нумерация идёт без дыр, из карты сайта он уходит. 404 не появится: страница остаётся на месте, просто на неё больше ниоткуда не ведёт.</p>
<h4>Удалить совсем</h4>
<p>Нужно ввести название кейса — это защита от случайного щелчка. Удаление необратимо. Обычно правильнее скрыть.</p>
<h4>Порядок</h4>
<p>Тяни кейс за карточку в списке. Номер <code>01…10</code> — это адрес страницы, он НЕ меняется; меняется только позиция. Поэтому старые ссылки на кейс продолжают работать.</p>
<h4>Копия кейса</h4>
<p>«Сделать копию» — быстрый способ начать похожий проект: копия приходит скрытой, со своими файлами.</p>`,
  'Остальные разделы': `
<h4>Шапка и подвал</h4>
<p>Имя в шапке, пункты меню, копирайт, кнопка «Наверх». Эти надписи одни на всех 14 страницах — правишь тут, меняется везде и сразу в двух языках.</p>
<p>Одно предупреждение: в имени «Сергей Лукин · Head of Design» должность обёрнута отдельно — на узких телефонах она специально скрывается, иначе строка переносится. Оформление не сбивай, текст меняй свободно.</p>
<h4>Медиатека</h4>
<p>Все картинки сайта в одном месте, с весом и колонкой «где стоит». Сортировка по весу находит самые тяжёлые. Заменить файл можно прямо оттуда — он обновится во всех местах разом, потому что имя остаётся тем же. Удалять даёт только те, что нигде не используются.</p>
<h4>Резюме PDF</h4>
<p>На странице «Обо мне», раздел контактов: два файла — русский и английский. Кидаешь новый PDF или выбираешь кнопкой, имя подставится само.</p>
<h4>Где работал</h4>
<p>Блок на манифесте: годы, компании, роль, описание, награда. Годы и названия — обычный текст, роль и описание переводятся.</p>
<h4>Черновик</h4>
<p>Правки пишутся в браузер сами каждые несколько секунд. Если браузер закрылся, свет мигнул или нажал F5 — при возврате появится полоска «есть несохранённый черновик от 14:32, восстановить?».</p>`,
  'Если что-то сломалось': `
<h4>Две команды, которые всё проверяют</h4>
<p>Открой папку проекта, в адресной строке проводника набери <code>cmd</code>, Enter — откроется чёрное окно. Дальше:</p>
<p><code>node cms/selftest.mjs</code> — прогоняет CMS целиком, больше восьмидесяти проверок, и печатает, что работает, а что нет. CMS при этом должна быть запущена.</p>
<p><code>node tools/audit.mjs</code> — проверяет сам сайт: битые ссылки, пропавшие картинки, незаполненные переводы, расхождения между страницей и словарём. Должно быть «Чисто».</p>
<p>Если обе зелёные — сайт цел, что бы ни казалось. Если нет — покажи мне вывод, там написано где.</p>
<h4>Селф-тест отказался запускаться</h4>
<p>Он не работает, пока есть несохранённые правки: он откатывает файлы и стёр бы их. Сначала «Опубликовать» или «Отменить».</p>
<h4>CMS не открывается</h4>
<p>Файл запуска — <code>cms\\CMS.bat</code>, двойной щелчок. Он сам ищет Node на компьютере и сам открывает браузер. Если пишет, что Node не найден — поставь его заново с nodejs.org, папку проекта трогать не надо.</p>
<h4>Правки не видно на сайте</h4>
<p>Сначала <code>Ctrl+Shift+R</code> — почти всегда это кэш. Если не помогло, посмотри полоску состояния сборки под заголовком: она пишет, собирается ещё или уже опубликовано.</p>
<h4>Картинка не заменяется</h4>
<p>Скорее всего файл открыт в просмотрщике Windows — закрой его и повтори. CMS так и напишет.</p>`,
  'Чего не делать': `
<h4>Что заперто</h4>
<p>Блоки с видео и уникальная вёрстка манифеста помечены замком: их разметка собрана руками, и кнопка её сломает. Текст внутри правится, структура — нет.</p>
<h4>Номер кейса не переименовывается</h4>
<p><code>01…10</code> — это адрес страницы, на который могут вести ссылки со стороны. Поэтому его нельзя менять, и CMS такой кнопки не даёт. Если нужно передвинуть кейс — тяни его в списке, номер останется, позиция изменится.</p>
<h4>Не удаляй картинку, которая где-то стоит</h4>
<p>Удаление из блока убирает её со страницы, но файл остаётся на диске. Так и надо: он может использоваться в превью портфолио.</p>
<h4>Папки cms, tools, content</h4>
<p>На сайт они не попадают: исключены в сборке, и на каждой публикации это проверяется отдельным шагом. Посетитель не увидит ни CMS, ни инструменты, ни реестр кейсов.</p>
<h4>Не правь папку en руками</h4>
<p>Английские страницы собираются из русских автоматически. Всё, что впишешь туда напрямую, затрётся при следующей публикации. Английский текст правится в поле EN рядом с русским.</p>`,
};

/* ── подсказки ── */
let tipEl=null;
function tip(el,text){
  hideTip(); tipEl=document.createElement('div'); tipEl.className='tip'; tipEl.innerHTML=text;
  document.body.appendChild(tipEl);
  const r=el.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
  tipEl.style.left=Math.min(r.left, innerWidth-t.width-14)+'px';
  tipEl.style.top=(r.bottom+7+t.height>innerHeight? r.top-t.height-7 : r.bottom+7)+'px';
}
const hideTip=()=>{ if(tipEl){tipEl.remove(); tipEl=null;} };
addEventListener('scroll',hideTip,true);

function toast(msg,ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); return t; }

/* ── список кейсов ── */
async function boot(){
  MODEL = await api('/api/model');
  drawList();
  PAGES=(await api('/api/pages')).pages;
  $('#pages').innerHTML=PAGES.map(p=>`<button class="pg" data-f="${p.file}">${p.label}</button>`).join('');
  $('#pages').onclick = e=>{ const b=e.target.closest('.pg'); if(b) openPage(b.dataset.f); };
  $('#findCase').oninput = e=>{ FIND=e.target.value; drawList(); markCur(); };
  $('#cases').onclick = e=>{ const b=e.target.closest('.case'); if(b) open(b.dataset.n); };
  open(CUR && MODEL.cases.some(c=>c.n===CUR) ? CUR : MODEL.cases[0].n);
}

// Список кейсов: статус точкой, порядок — перетаскиванием строки.
function drawList(){
  const dot={published:'var(--ok)',hidden:'var(--warn)'};
  const q=(FIND||'').trim().toLowerCase();
  const list=MODEL.cases.filter(c=>!q
    || String(c.title||'').toLowerCase().includes(q)
    || String(c.role||'').toLowerCase().includes(q)
    || String(c.year||'').includes(q)
    || String(c.n).includes(q));
  $('#cases').innerHTML = list.map(c=>
    `<button class="case${c.status!=='published'?' case--off':''}" data-n="${c.n}" draggable="${q?'false':'true'}">
       <b><i class="dot" style="background:${dot[c.status]}" title="${MODEL.statusRu[c.status]}"></i>${c.n} · ${c.title||'без названия'}${c.needsEn?'<span class="entag" title="полей без английского: '+c.needsEn+'">EN '+c.needsEn+'</span>':''}</b>
       <span>${c.year||'—'} · ${c.role||'—'}${c.status!=='published'?' · '+MODEL.statusRu[c.status]:''}</span>
     </button>`).join('')
    || '<div class="locked" style="padding:10px">Ничего не найдено.</div>';
  if(q) return;   // при поиске порядок мышью не трогаем — он про полный список
  let drag=null;
  for(const el of $('#cases').querySelectorAll('.case')){
    el.ondragstart=e=>{ drag=el; el.style.opacity=.4; e.dataTransfer.effectAllowed='move'; };
    el.ondragend=()=>{ el.style.opacity=1; drag=null; saveOrder(); };
    el.ondragover=e=>{ e.preventDefault(); if(!drag||drag===el) return;
      const r=el.getBoundingClientRect();
      el.parentNode.insertBefore(drag, (e.clientY-r.top)/r.height>.5 ? el.nextSibling : el); };
  }
}
async function saveOrder(){
  const ids=[...$('#cases').querySelectorAll('.case')].map(b=>b.dataset.n);
  if(ids.join()===MODEL.cases.map(c=>c.n).join()) return;
  toast('Меняю порядок…');
  const r=await api('/api/order',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ids})});
  MODEL=await api('/api/model'); drawList(); markCur(); refreshPreview();
  toast(r.ok?'Порядок сохранён. Сетка и таблица пересобраны.':'Не удалось: '+(r.out||''));
}
const markCur=()=>document.querySelectorAll('.case').forEach(b=>b.classList.toggle('on',b.dataset.n===CUR));

function field(f){
  const ru=DATA.dict.ru[f.k]??'', en=DATA.dict.en[f.k]??'';
  const one=f.kind!=='text';
  const mk=(lang,val)=>`<div><div class="lang">${lang.toUpperCase()}</div><div class="rf${one?' rf--one':''}" contenteditable="true" spellcheck="true" data-k="${f.k}" data-l="${lang}" data-ph="пусто">${htmlToRich(val)}</div></div>`;
  return `<div class="f"><label>${f.label}${f.optional?' <span class="opt">· необязательно</span>':''}
      <button class="i" data-hint="${esc(f.hint)}">i</button></label>
    <div class="pair">${mk('ru',ru)}${mk('en',en)}</div></div>`;
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Неразрывный пробел в текстах записан как &nbsp; — он держит предлоги, чтобы
   «в» и «на» не висели в конце строки. Показывать эту абракадабру в поле нельзя,
   терять её тоже нельзя. Поэтому в редакторе она живёт настоящим символом
   (выглядит обычным пробелом), а при сохранении возвращается в разметку.
   Переносы <br> в поле показываем переводом строки — так же честно. */
const NB='\u00a0';

/* ── Поле с оформлением ────────────────────────────────────────────────────
   В текстах сайта встречается ровно четыре вещи: <b> жирное, <em> курсив,
   <span class="num"> подсветка числа и <br> перенос строки. Показывать их
   тегами нельзя — писать в таком поле невозможно. Поэтому поле показывает
   готовый вид, а при чтении собирается обратно в чистую разметку.
   Всё, чего нет в этом списке, при вставке отбрасывается. */
// Тег сохраняем ТОТ ЖЕ, что был в файле: <b> и <strong> выглядят одинаково,
// но подменять один на другой нельзя — тогда холостое сохранение переписывает
// страницу, и в истории появляется правка, которой человек не делал.
const RICH_OK = { B:'b', STRONG:'strong', I:'em', EM:'em' };

// Классы span, на которых держится вёрстка: подсветка числа, стрелка «наверх»,
// разделитель между фактами. Плюс <span> совсем без атрибутов — им в шапке
// обёрнуто «Head of Design», и на экранах до 420 px CSS его скрывает, иначе
// строка переносится на две. Потеряем обёртку — шапка сломается на телефонах.
const SPAN_OK = ['num', 'arr', 'sep'];
function spanAttrs(n){
  const cls=[...n.classList].filter(c=>SPAN_OK.includes(c));
  if(cls.length) return ' class="'+cls.join(' ')+'"';
  if(!n.attributes.length) return '';
  return null;                              // чужой span из буфера — развернуть
}

function richToHtml(node){
  let out='';
  for(const n of node.childNodes){
    if(n.nodeType===3){                       // текст
      out += n.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      continue;
    }
    if(n.nodeType!==1) continue;
    const tag=n.tagName;
    if(tag==='BR'){ out+='<br>'; continue; }
    if(tag==='SPAN'){
      const at=spanAttrs(n);
      if(at!==null){
        const inner=richToHtml(n);
        if(inner.trim()) out+='<span'+at+'>'+inner+'</span>';   // пустые из буфера — мимо
        continue;
      }
    }
    const keep=RICH_OK[tag];
    const inner=richToHtml(n);
    if(!inner.trim() && tag!=='BR') continue;
    out += keep ? '<'+keep+'>'+inner+'</'+keep+'>' : inner;   // чужое — разворачиваем
    if(tag==='DIV'||tag==='P') out+='<br>';                   // блок из вставки — переносом
  }
  return out;
}
const htmlToRich = (v) => String(v??'').replace(/&nbsp;/g, NB);
const richToStore = (el) => richToHtml(el).replace(new RegExp(NB,'g'),'&nbsp;').replace(/(<br>)+$/,'');

let RTOOL=null;
function hideTool(){ if(RTOOL){ RTOOL.remove(); RTOOL=null; } }
function showTool(field){
  const sel=window.getSelection();
  if(!sel.rangeCount || sel.isCollapsed || !field.contains(sel.anchorNode)) { hideTool(); return; }
  const r=sel.getRangeAt(0).getBoundingClientRect();
  if(!r.width){ hideTool(); return; }
  if(!RTOOL){
    RTOOL=document.createElement('div'); RTOOL.className='rtool';
    RTOOL.innerHTML='<button data-r="b" title="жирный (Ctrl+B)"><b>Ж</b></button>'
      + '<button data-r="em" title="курсив (Ctrl+I)"><i>К</i></button>'
      + '<button data-r="num" title="подсветить число"><span class="nm">12</span></button>'
      + '<button data-r="clear" title="убрать оформление">убрать</button>';
    RTOOL.onmousedown=e=>e.preventDefault();
    RTOOL.onclick=e=>{ const b=e.target.closest('[data-r]'); if(b) applyRich(b.dataset.r, field); };
    document.body.appendChild(RTOOL);
  }
  RTOOL.style.left=Math.max(8, Math.min(r.left, innerWidth-190))+'px';
  RTOOL.style.top=Math.max(8, r.top-38)+'px';
}
function applyRich(what, field){
  const sel=window.getSelection(); if(!sel.rangeCount || sel.isCollapsed) return;
  const range=sel.getRangeAt(0);
  if(what==='clear'){
    const txt=range.toString(); range.deleteContents(); range.insertNode(document.createTextNode(txt));
  } else if(what==='num'){
    const sp=document.createElement('span'); sp.className='num'; sp.textContent=range.toString();
    range.deleteContents(); range.insertNode(sp);
  } else {
    const el=document.createElement(what==='b'?'b':'em'); el.textContent=range.toString();
    range.deleteContents(); range.insertNode(el);
  }
  sel.removeAllRanges();
  field.dispatchEvent(new Event('input',{bubbles:true}));
  hideTool();
}
document.addEventListener('selectionchange',()=>{
  const a=document.activeElement;
  if(a && a.classList && a.classList.contains('rf')) showTool(a); else hideTool();
});

// одно место, где поле оживает: вставка без мусора, Enter переносом, горячие клавиши
function wireRich(el, onChange){
  el.addEventListener('paste', e=>{
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t);
  });
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      if(el.classList.contains('rf--one')){ e.preventDefault(); return; }
      e.preventDefault(); document.execCommand('insertLineBreak');
    }
    if((e.ctrlKey||e.metaKey) && (e.key==='b'||e.key==='B')){ e.preventDefault(); applyRich('b', el); }
    if((e.ctrlKey||e.metaKey) && (e.key==='i'||e.key==='I')){ e.preventDefault(); applyRich('em', el); }
  });
  el.addEventListener('input', ()=>onChange(richToStore(el)));
  el.addEventListener('blur', hideTool);
}
const toEditor=v=>String(v??'').replace(/&nbsp;/g,NB).replace(/<br\s*\/?>/gi,'\n');
const fromEditor=v=>String(v??'').replace(new RegExp(NB,'g'),'&nbsp;').replace(/\r?\n/g,'<br>');

/* Расстановка неразрывных пробелов по правилу, по которому набран сайт:
   после коротких слов (до двух букв) и перед тире. */
function bindShort(v){
  return String(v??'')
    .replace(new RegExp('(^|[\\s'+NB+'(«"])([А-Яа-яЁёA-Za-z]{1,2})\\s+','g'), '$1$2'+NB)
    .replace(/\s+—/g, NB+'—');
}

      </div></div>
    <div class="f"><label>Обложка в сетке <button class="i" data-hint="Картинка карточки в портфолио и кадр ховера на манифесте. Если у кейса видео-обложка, картинка остаётся постером — тем, что видно до запуска ролика.">i</button></label>

      + '<div class="cvrow"><div><b>assets/vid/'+esc(meta.slug)+'.mp4</b><div class="cvmeta">меняется целиком, имя остаётся прежним</div></div>'

  for(const [name,keys] of groups){

// ── операции над кейсом целиком ────────────────────────────────────────────
async function reloadAll(msg){
  MODEL=await api('/api/model'); drawList(); await open(CUR); if(msg) toast(msg);
}
function wireCaseOps(){
  $('#statusSeg').onclick=async e=>{
    const b=e.target.closest('[data-s]'); if(!b) return;
    const r=await api('/api/case/'+CUR+'/status',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({status:b.dataset.s})});
    if(r.error) return toast(r.error, 5000);
    MODEL=await api('/api/model'); drawList(); markCur();
    const m=MODEL.cases.find(c=>c.n===CUR);
    $('#statusSeg').querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s===m.status));
    $('#ttl').innerHTML=`${CUR} · ${esc(DATA.dict.ru['p.title']||'')} <span class="badge badge--${m.status}">${MODEL.statusRu[m.status]}</span>`;
    refreshPreview();
    toast(m.status==='published'?'Кейс вернулся на сайт. Сетка и таблица пересобраны.':'Кейс скрыт. Убран из сетки, таблицы и поиска — страница и все тексты целы, вернуть можно в любой момент.', 4200);
  };
  const setCover=async(poster)=>{
    const r=await api('/api/case/'+CUR+'/cover',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({poster})});
    if(r.error) return toast(r.error);
    await reloadAll('Обложка обновлена.');
  };
  $('#cover').onchange=e=>setCover(e.target.value.trim());
  if($('#dropVid')){
    const upVid=async f=>{
      const z=$('#dropVid'), lbl=z.textContent; z.textContent='загружаю…';
      const r=await fetch('/api/video?slug='+encodeURIComponent(meta.slug),{method:'POST',body:f}).then(x=>x.json());
      z.textContent=lbl;
      if(r.error) return toast(r.error,4500);
      STAMP=Date.now(); refreshPreview();
      toast('Видео заменено ('+r.mb+' МБ). Не забудь «Опубликовать».',4200);
    };
    wireDrop($('#dropVid'),{accept:'.mp4,video/mp4',match:/\.mp4$/i,reject:'Нужен файл .mp4',onFiles:upVid});
    $('#pickVid').onclick=e=>{ e.stopPropagation(); pickFile(upVid,{accept:'.mp4,video/mp4'}); };
  }
  wireDrop($('#dropCover'),{onFiles:async f=>{
    const dc=$('#dropCover'); const label=dc.textContent; dc.textContent='загружаю…';
    const r=await sendImage('/api/upload?stem='+encodeURIComponent(stemOfCase()+'-preview'), f);
    dc.textContent=label;
    if(r.cancel) return;
    if(r.error) return toast(r.error,4000);
    await setCover(r.name);
  }});
  $('#dupCase').onclick=async()=>{
    if(!confirm('Создать копию этого кейса? Она появится скрытой, на сайт не попадёт.')) return;
    const r=await api('/api/case/'+CUR+'/duplicate',{method:'POST'});
    if(r.error) return toast(r.error);
    MODEL=await api('/api/model'); drawList(); await open(r.id);
    toast('Копия создана и скрыта — заполняй спокойно.');
  };
  $('#delCase').onclick=async()=>{
    const title=DATA.dict.ru['p.title']||'';
    const ans=prompt(`Удалить кейс НАВСЕГДА — файл страницы будет стёрт.\n\nЕсли просто хочешь убрать его с сайта — закрой это окно и переключи его в «Скрыт» — он останется целым.\n\nДля удаления впиши название кейса точно:\n${title}`);
    if(ans===null) return;
    const r=await api('/api/case/'+CUR+'/delete',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({confirm:ans})});
    if(r.error) return toast(r.error, 5000);
    CUR=null; MODEL=await api('/api/model'); drawList(); await open(MODEL.cases[0].n);
    toast('Кейс удалён. Сетка и таблица пересобраны.');
  };
}
document.addEventListener('click',e=>{ if(!e.target.closest('.i')&&!e.target.closest('.tip')) hideTip(); });

function drawMedia(){
  const box=$('#media');
  const slot=(it,i,j)=>{
    const url=it.src?'/assets/img/'+it.src+'.webp?t='+STAMP:'';
    const miss=it.src&&!it.exists;
    return '<div class="slot" data-i="'+i+'" data-j="'+j+'">'
      + (it.src
          ? '<img class="slot__img" src="'+url+'" alt="" loading="lazy" data-open="'+esc(it.src)+'">'
          : '<div class="slot__empty">пусто — перетащи файл или нажми</div>')
      + '<div class="slot__acts">'
        + (it.src?'<button data-act="open">Открыть</button>':'')
        + '<button data-act="replace">'+(it.src?'Заменить':'Загрузить')+'</button>'
        + (it.src?'<button data-act="clear">Убрать</button>':'')
      + '</div>'
      + '<div class="slot__meta">'
        + (it.src?'<span class="nm">'+esc(it.src)+'.webp</span>':'<span>файл не выбран</span>')
        + (miss?'<span class="warn">нет на диске</span>':'')
        + (it.exists&&it.w?'<span>'+it.w+'×'+it.h+'</span>':'')
        + (it.exists?'<span>'+it.kb+' КБ</span>':'')
        + '<span class="sp"></span>'
        + (it.exists?(it.variants.length?'<span>копии '+it.variants.join('/')+'</span>':'<span class="warn">нет копий для телефона</span>'):'')
      + '</div>'
      + '<input class="slot__alt" data-i="'+i+'" data-j="'+j+'" data-p="alt" value="'+esc(it.alt)+'" placeholder="alt — что на кадре, одной фразой">'
      + '</div>';
  };

  box.innerHTML=DATA.media.map((m,i)=>{
    if(m.type==='raw'||m.type==='comment'){
      const label=m.type==='comment'?'заметка в разметке':'видео или особый блок';
      return '<div class="mb"><div class="mb__bar"><b>🔒 '+label+'</b><div class="sp"></div><span>не редактируется</span></div></div>';
    }
    const items=m.type==='row'?m.items:[m];
    return '<div class="mb '+(m.type==='row'?'mb--row':'mb--full')+'" data-i="'+i+'" draggable="true">'
      + '<div class="mb__bar"><span class="grab">⠿</span><b>'+(m.type==='row'?'Две в ряд':'Во всю ширину')+'</b>'
        + '<div class="sp"></div>'
        + (m.type==='full'?'<button class="x" data-act="topair">сделать парой</button>':'<button class="x" data-act="tofull">разбить</button>')
        + '<button class="x" data-act="del">удалить блок</button></div>'
      + '<div class="mb__body">'+items.map((it,j)=>slot(it,i,m.type==='row'?j:-1)).join('')+'</div></div>';
  }).join('') || '<div class="locked">Картинок пока нет.</div>';

  box.insertAdjacentHTML('beforeend',
    '<div class="drop drop--new" id="dropNew"><b>Добавить картинки</b><br>'
    + '<span style="opacity:.7">перетащи сюда или нажми, чтобы выбрать на компьютере — можно сразу несколько</span></div>');

  const at=(i,j)=>{ const m=DATA.media[i]; return j>=0?m.items[j]:m; };

  box.oninput=e=>{ const t=e.target; if(t.dataset.p!=='alt') return;
    at(+t.dataset.i,+t.dataset.j).alt=t.value; mark(); };

  box.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    const mb=e.target.closest('.mb'); const sl=e.target.closest('.slot');
    const i=mb?+mb.dataset.i:-1;
    const act=b.dataset.act;
    if(act==='del'){ if(confirm('Убрать блок со страницы? Сами файлы останутся на диске.')){ DATA.media.splice(i,1); mark(); drawMedia(); } return; }
    if(act==='topair'){ const m=DATA.media[i]; DATA.media[i]={type:'row',items:[{...m},{src:'',alt:''}]}; mark(); drawMedia(); return; }
    if(act==='tofull'){ const m=DATA.media[i]; DATA.media.splice(i,1,...m.items.filter(x=>x.src).map(x=>({type:'full',...x}))); mark(); drawMedia(); return; }
    if(!sl) return;
    const j=+sl.dataset.j, it=at(i,j);
    if(act==='open') return lightbox(it,i,j);
    if(act==='clear'){ Object.assign(it,{src:'',alt:'',w:'',h:'',exists:false,kb:0,variants:[]}); mark(); drawMedia(); return; }
    if(act==='replace') return pickFile(async f=>{ await putImage(f,it,i,j); });
  };

  // клик по самой картинке — открыть
  for(const im of box.querySelectorAll('.slot__img')){
    im.onclick=()=>{ const sl=im.closest('.slot'); lightbox(at(+sl.dataset.i,+sl.dataset.j),+sl.dataset.i,+sl.dataset.j); };
  }

  // на слот можно и перетащить файл, и кликнуть по пустому месту
  for(const sl of box.querySelectorAll('.slot')){
    const i=+sl.dataset.i, j=+sl.dataset.j;
    wireDrop(sl,{guard:()=>!!drag,onFiles:f=>putImage(f, at(i,j), i, j)});
    // у заполненного слота клик по картинке открывает просмотр, а не файловое окно
    if(at(i,j).src) sl.onclick=e=>{ if(e.target.closest('button')) return; lightbox(at(i,j),i,j); };
  }

  // перестановка блоков мышью
  let drag=null;
  for(const mb of box.querySelectorAll('.mb')){
    mb.ondragstart=e=>{ drag=mb; mb.classList.add('mb--drag'); e.dataTransfer.effectAllowed='move'; };
    mb.ondragend=()=>{ mb.classList.remove('mb--drag');
      const order=[...box.querySelectorAll('.mb')].map(x=>+x.dataset.i);
      DATA.media=order.map(k=>DATA.media[k]).concat(DATA.media.filter((m,k)=>!order.includes(k)));
      drag=null; mark(); drawMedia(); };
    mb.ondragover=e=>{ if(!drag||drag===mb) return; e.preventDefault();
      const r=mb.getBoundingClientRect();
      box.insertBefore(drag,(e.clientY-r.top)/r.height>.5?mb.nextSibling:mb); };
  }

  // общая зона: новые картинки в конец
  const dn=$('#dropNew');
  wireDrop(dn,{multiple:true,guard:()=>!!drag,onFiles:async files=>{
    const label=dn.innerHTML; dn.textContent='загружаю…';
    let n=0;
    for(const f of files){
      const r=await sendImage('/api/upload?stem='+encodeURIComponent(stemOfCase()), f);
      if(r.cancel) continue;
      if(r.error){ toast(r.error,4000); break; }
      DATA.media.push({type:'full',src:r.name,alt:'',w:r.w,h:r.h,exists:true,kb:r.kb||0,variants:r.variants}); n++;
    }
    dn.innerHTML=label;
    if(n){ STAMP=Date.now(); mark(); drawMedia(); toast(n===1?'Картинка добавлена — впиши alt.':'Добавлено '+n+'. Впиши alt каждой.'); }
  }});
}

// Заменить файл в конкретном слоте. Если слот пустой — заливаем как новую
// картинку; если занят — перезаписываем ТОТ ЖЕ файл, чтобы ссылки не порвались.
async function putImage(f, it, i, j){
  const was = it.src;
  const url = was ? '/api/replace?name='+encodeURIComponent(was)
                  : '/api/upload?stem='+encodeURIComponent(stemOfCase());
  const r=await sendImage(url, f);
  if(r.cancel) return;
  if(r.error) return toast(r.error, 4500);
  Object.assign(it,{src:r.name,w:r.w,h:r.h,exists:true,kb:r.kb||0,variants:r.variants||[]});
  STAMP=Date.now();
  mark(); drawMedia();
  toast(fmtNote(r, was? 'Файл заменён. Копии для телефона пересозданы.' : 'Картинка загружена.'), 4500);
}

// ── приём картинок: PNG и JPG принимаем, но кладём на сайт webp ──────────
// Сайт целиком на webp (srcset, копии для телефонов). Раньше CMS просто
// отказывалась от PNG — приходилось идти пересохранять в Figma. Теперь
// пересохраняем сами, но не молча: показываем оба веса и даём выбрать.
const IMG_ACCEPT='.webp,.png,.jpg,.jpeg,image/webp,image/png,image/jpeg';
const IMG_MATCH=/\.(webp|png|jpe?g)$/i;
const IMG_REJECT='Нужна картинка: .webp, .png или .jpg.';

function askFormat(f, p){
  return new Promise(done=>{
    const v=document.createElement('div'); v.className='lb fmt';
    const save=Math.max(0, 100-Math.round(p.q90Kb/p.origKb*100));
    v.innerHTML='<div class="lb__top"><b>'+esc(f.name)+'</b><span class="sp"></span>'
      + '<button class="btn" data-a="cancel">Отмена</button></div>'
      + '<div class="lb__wrap"><div class="fmt__box">'
      + '<p class="fmt__lead">Это '+p.kind.toUpperCase()+', '+p.w+'×'+p.h+', '+p.origKb+' КБ.<br>'
      + 'Сайт работает на webp — переведу в него. Как?</p>'
      + '<button class="fmt__opt" data-a="compress"><b>Сжать</b>'
      + '<i>'+p.q90Kb+' КБ — легче в '+(p.origKb/Math.max(1,p.q90Kb)).toFixed(1)+' раза'
      + (save>0?', минус '+save+'% веса':'')+'</i>'
      + '<u>Качество 90. На глаз от оригинала не отличить. Рекомендую.</u></button>'
      + '<button class="fmt__opt" data-a="lossless"><b>Без потерь</b>'
      + '<i>'+p.losslessKb+' КБ</i>'
      + '<u>Пиксель в пиксель. Берите, если на картинке мелкий текст или скриншот интерфейса.</u></button>'
      + '</div></div><div class="lb__bottom"><span>Оригинал на компьютере остаётся нетронутым.</span></div>';
    const close=r=>{ v.remove(); document.removeEventListener('keydown',key); done(r); };
    const key=e=>{ if(e.key==='Escape') close(null); };
    v.onclick=e=>{ const b=e.target.closest('[data-a]');
      if(b) return close(b.dataset.a==='cancel'?null:b.dataset.a);
      if(e.target===v||e.target.classList.contains('lb__wrap')) close(null); };
    document.addEventListener('keydown',key);
    document.body.appendChild(v);
  });
}

// Единственная дорога, по которой картинка попадает на сервер.
// Возвращает ответ сервера либо {cancel:true}, если человек передумал.
async function sendImage(url, f){
  let mode='keep';
  if(!/\.webp$/i.test(f.name)){
    const busy=toast('Смотрю картинку…', 60000);
    const p=await fetch('/api/probe',{method:'POST',body:f}).then(x=>x.json()).catch(()=>({error:'Сервер не ответил.'}));
    busy.remove();
    if(p.error) return p;
    // Расширению в имени не верим. Из Фигмы файл иногда приезжает как .png,
    // а внутри уже webp — тогда спрашивать не о чем и пережимать нечего.
    if(p.kind!=='webp'){
      mode=await askFormat(f,p);
      if(!mode) return {cancel:true};
    }
  }
  const busy=toast(mode==='keep'?'Загружаю…':'Перевожу в webp…', 60000);
  const r=await fetch(url+(url.includes('?')?'&':'?')+'mode='+mode,{method:'POST',body:f})
    .then(x=>x.json()).catch(()=>({error:'Не удалось загрузить файл.'}));
  busy.remove();
  return r;
}

// Что сказать после загрузки: если формат меняли — назвать цифры.
function fmtNote(r, base){
  if(r.mode && r.mode!=='keep' && r.wasKb)
    return base+' '+r.kind.toUpperCase()+' → webp: '+r.wasKb+' → '+r.kb+' КБ.';
  return base;
}

function pickFile(cb,{accept=IMG_ACCEPT,multiple=false}={}){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept=accept; inp.multiple=multiple;
  inp.onchange=()=>{ if(inp.files.length) cb(multiple?[...inp.files]:inp.files[0]); };
  inp.click();
}

// Любая зона загрузки работает двумя способами: перетащить файл ИЛИ кликнуть
// и выбрать в окне Windows. Одно поведение на всю CMS.
function wireDrop(el,{accept=IMG_ACCEPT,multiple=false,match=IMG_MATCH,reject=IMG_REJECT,onFiles,guard}={}){
  const take=list=>{ const ok=[...list].filter(f=>match.test(f.name));
    if(!ok.length) return toast(reject,4000);
    onFiles(multiple?ok:ok[0]); };
  el.ondragover=e=>{ if(guard&&guard()) return; e.preventDefault(); el.classList.add('hot'); };
  el.ondragleave=()=>el.classList.remove('hot');
  el.ondrop=e=>{ if(guard&&guard()) return; e.preventDefault(); e.stopPropagation(); el.classList.remove('hot'); take(e.dataTransfer.files); };
  el.onclick=e=>{ if(e.target.closest('button,a,input')) return; pickFile(f=>take(multiple?f:[f]),{accept,multiple}); };
  el.style.cursor='pointer';
}

// Просмотр картинки целиком
function lightbox(it,i,j){
  if(!it.src) return;
  const v=document.createElement('div'); v.className='lb';
  v.innerHTML='<div class="lb__top"><b>'+esc(it.src)+'.webp</b><span class="sp"></span>'
    + '<button class="btn" data-a="replace">Заменить файл</button>'
    + '<button class="btn" data-a="close">Закрыть</button></div>'
    + '<div class="lb__wrap"><img src="/assets/img/'+it.src+'.webp?t='+STAMP+'" alt=""></div>'
    + '<div class="lb__bottom"><span>'+(it.w?it.w+'×'+it.h+' · ':'')+it.kb+' КБ</span>'
    + '<span>копии: '+(it.variants&&it.variants.length?it.variants.join(' / '):'нет')+'</span>'
    + '<span>alt: '+(it.alt?esc(it.alt):'— не заполнен')+'</span></div>';
  v.onclick=e=>{
    const a=(e.target.dataset||{}).a;
    if(a==='close'||e.target===v||e.target.className==='lb__wrap') v.remove();
    if(a==='replace'){ v.remove(); pickFile(f=>putImage(f,it,i,j)); }
  };
  document.addEventListener('keydown',function esc2(e){ if(e.key==='Escape'){ v.remove(); document.removeEventListener('keydown',esc2); } });
  document.body.appendChild(v);
}

// Основа имени файлов кейса: берём из уже стоящих картинок, включая те, что внутри пар.
// Свободный номер подбирает сервер по диску — так новый файл не затрёт чужой.
function stemOfCase(){
  const names=DATA.media.flatMap(m=>m.type==='row'?m.items.map(x=>x.src):[m.src]).filter(Boolean);
  if(names.length) return names[0].replace(/-\d+$/,'');
  const t=(DATA.dict.en['p.title']||DATA.dict.ru['p.title']||'case').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return t||('case-'+CUR);
}

function changedFields(){
  if(!ORIG) return [];
  const out=[];
  if(MODE==='case'&&DATA){
    for(const lang of ['ru','en'])
      for(const k of Object.keys(DATA.dict[lang]||{}))
        if(DATA.dict[lang][k]!==(ORIG.dict[lang]||{})[k]) out.push(lang.toUpperCase()+' '+k);
    if(DATA.year!==ORIG.year) out.push('год');
    if(JSON.stringify(DATA.media)!==JSON.stringify(ORIG.media)) out.push('картинки');
  } else if(MODE==='page'&&PAGE){
    for(const lang of ['ru','en'])
      for(const k of Object.keys(PAGE.dict[lang]||{}))
        if(PAGE.dict[lang][k]!==(ORIG[lang]||{})[k]) out.push(lang.toUpperCase()+' '+k);
  } else if(MODE==='shell'&&SHELL){
    for(const lang of ['ru','en'])
      for(const k of Object.keys(SHELL[lang]||{}))
        if(SHELL[lang][k]!==(ORIG[lang]||{})[k]) out.push(lang.toUpperCase()+' '+k);
  } else if(MODE==='cont'&&CONT){
    CONT.items.forEach((it,i)=>{ const o=ORIG[i]||{};
      if(it.url!==o.url) out.push(it.name+': ссылка');
      if(it.handle!==o.handle) out.push(it.name+': подпись'); });
    const wasExtra=(CONT.__extra0||[]).join('\n');
    if(wasExtra!==(CONT.extra||[]).join('\n') && CONT.__extra0) out.push('ещё профили');
  }
  return out;
}
const mark=()=>{
  DIRTY=true;
  const n=changedFields().length;
  const b=$('#save');
  b.classList.add('pri');
  b.innerHTML='Сохранить'+(n?'<span class="savecount">'+n+'</span>':'');
  b.title=n?('Изменено: '+changedFields().slice(0,12).join(', ')):'';
  markFields();
  saveDraft();
};
/* Одно место, где решается, откуда у поля брать «было» и «стало».
   Разделы хранят данные по-разному: у кейса это DATA.dict, у страницы
   PAGE.dict, у шапки SHELL. Разводить это по каждой функции — верный способ
   получить раздел, в котором счётчик правок молчит. */
const FSEL='.rf[data-k],.rf[data-pk],.rf[data-sh]';
function fieldWasNow(el){
  const lang=el.dataset.l; if(!lang) return null;
  if(el.dataset.sh){
    if(!SHELL||!ORIG) return null;
    return [(ORIG[lang]||{})[el.dataset.sh], (SHELL[lang]||{})[el.dataset.sh]];
  }
  const key=el.dataset.k||el.dataset.pk; if(!key) return null;
  if(MODE==='case') return DATA&&ORIG&&ORIG.dict ? [(ORIG.dict[lang]||{})[key], (DATA.dict[lang]||{})[key]] : null;
  return PAGE&&ORIG ? [(ORIG[lang]||{})[key], (PAGE.dict[lang]||{})[key]] : null;
}
function fieldPut(el, v){
  const lang=el.dataset.l;
  if(el.dataset.sh){ SHELL[lang][el.dataset.sh]=v; return; }
  const key=el.dataset.k||el.dataset.pk;
  if(MODE==='case') DATA.dict[lang][key]=v; else PAGE.dict[lang][key]=v;
}

/* Помечаем изменённые поля и даём вернуть каждое по отдельности:
   раньше «Отменить» откатывало сразу всю страницу. */
function markFields(){
  if(!ORIG) return;
  const box=$('#form'); if(!box) return;
  // Контакты — обычные поля ввода, у них своя разметка: подсвечиваем строку
  // и даём вернуть ссылку и подпись вместе, они всегда меняются в паре.
  if(MODE==='cont'&&CONT){
    for(const el of box.querySelectorAll('input[data-ci]')){
      const i=+el.dataset.ci, o=ORIG[i]||{}, it=CONT.items[i]||{};
      const f=el.closest('.f'); if(!f) continue;
      const changed = it.url!==o.url || it.handle!==o.handle;
      f.classList.toggle('dirty', changed);
      const label=f.querySelector('label'); if(!label) continue;
      const already=label.querySelector('.undo1');
      if(changed && !already){
        const b=document.createElement('button');
        b.className='undo1'; b.textContent='вернуть'; b.title='вернуть эту ссылку как была';
        b.onclick=ev=>{ ev.preventDefault();
          CONT.items[i].url=o.url; CONT.items[i].handle=o.handle;
          for(const x of f.querySelectorAll('input[data-ci]')) x.value=o[x.dataset.k]??'';
          mark(); };
        label.appendChild(b);
      }
      if(!changed && already) already.remove();
    }
    return;
  }
  for(const el of box.querySelectorAll(FSEL)){
    const wn=fieldWasNow(el); if(!wn) continue;
    const [was, now]=wn;
    const f=el.closest('.f'); if(!f) continue;
    const changed = was!==now;
    // метку и кнопку вешаем один раз на поле, а не на каждый язык
    const label=f.querySelector('label'); if(!label) continue;
    const already=label.querySelector('.undo1');
    const anyChanged = [...f.querySelectorAll(FSEL)].some(x=>{
      const p=fieldWasNow(x); if(!p) return false;
      return p[0]!==p[1];
    });
    f.classList.toggle('dirty', anyChanged);
    if(anyChanged && !already){
      const b=document.createElement('button');
      b.className='undo1'; b.textContent='вернуть'; b.title='вернуть это поле как было';
      b.onclick=ev=>{ ev.preventDefault();
        for(const x of f.querySelectorAll(FSEL)){
          const p=fieldWasNow(x); if(!p) continue;
          fieldPut(x, p[0]);
          x.innerHTML=htmlToRich(p[0]);
        }
        mark(); markFields(); };
      label.appendChild(b);
    }
    if(!anyChanged && already) already.remove();
  }
}

const unmark=()=>{ DIRTY=false; const b=$('#save'); b.classList.remove('pri'); b.textContent='Сохранить'; b.title=''; dropDraft(); };

/* ── 3. Черновик в браузере ────────────────────────────────────────────
   Правки живут в памяти вкладки: перезагрузил или закрыл — потерял.
   Пишем их себе в браузер и предлагаем вернуть при следующем открытии. */
const draftKey=()=> MODE==='case' ? 'draft:case:'+CUR : MODE==='page' ? 'draft:page:'+PAGE.file : null;
let draftTimer=null;
function saveDraft(){
  const k=draftKey(); if(!k) return;
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{
    try{
      const payload = MODE==='case' ? {dict:DATA.dict,year:DATA.year,media:DATA.media} : {dict:PAGE.dict};
      localStorage.setItem(k, JSON.stringify({at:Date.now(), payload}));
    }catch(e){}
  }, 1200);
}
function dropDraft(){ const k=draftKey(); if(k) try{ localStorage.removeItem(k); }catch(e){} }
function readDraft(){
  const k=draftKey(); if(!k) return null;
  try{ const raw=localStorage.getItem(k); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function offerDraft(){
  const bar=$('#draftBar'); bar.hidden=true;
  const d=readDraft(); if(!d) return;
  const cur = MODE==='case' ? JSON.stringify({dict:DATA.dict,year:DATA.year,media:DATA.media}) : JSON.stringify({dict:PAGE.dict});
  if(JSON.stringify(d.payload)===cur){ dropDraft(); return; }   // черновик совпал с файлом
  const when=new Date(d.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  bar.hidden=false;
  bar.innerHTML='<b>Есть несохранённый черновик от '+when+'.</b> Правки не попали в файлы.'
    + '<span class="sp"></span><button data-d="use">Восстановить</button><button class="no" data-d="drop">Удалить черновик</button>';
  bar.onclick=e=>{
    const a=(e.target.dataset||{}).d; if(!a) return;
    if(a==='use'){
      if(MODE==='case'){ DATA.dict=d.payload.dict; DATA.year=d.payload.year; DATA.media=d.payload.media; render(); }
      else { PAGE.dict=d.payload.dict; renderPage(); }
      mark(); toast('Черновик восстановлен. Проверь и нажми «Сохранить».',4000);
    } else { dropDraft(); }
    bar.hidden=true;
  };
}

/* ── 1. Полоска разделов ───────────────────────────────────────────────── */
function buildSecNav(){
  const nav=$('#secnav');
  const secs=[...$('#form').querySelectorAll('.sec')].filter(s=>s.querySelector('h2'));
  if(secs.length<2){ nav.innerHTML=''; nav.style.display='none'; return; }
  nav.style.display='';
  nav.innerHTML=secs.map((s,i)=>{
    const n=s.querySelectorAll('.rf,input,textarea').length;
    return '<button data-s="'+i+'">'+esc(s.querySelector('h2').textContent)+(n?'<span class="n">'+n+'</span>':'')+'</button>';
  }).join('');
  nav.onclick=e=>{ const b=e.target.closest('[data-s]'); if(!b) return;
    const s=secs[+b.dataset.s];
    s.classList.remove('folded');
    const m=$('.main');
    // offsetTop считается от позиционированного предка, а не от прокручиваемой
    // области — поэтому берём разницу прямоугольников, иначе никуда не едет
    const y=s.getBoundingClientRect().top - m.getBoundingClientRect().top + m.scrollTop - 8;
    m.scrollTo({top:Math.max(0,y),behavior:'smooth'}); };
  // сворачивание по клику на заголовок
  for(const s of secs) s.querySelector('h2').onclick=()=>{ s.classList.toggle('folded'); };
  // подсветка текущего раздела при прокрутке
  const mainEl=$('.main');
  const onScroll=()=>{
    const top=mainEl.getBoundingClientRect().top;
    let cur=0;
    secs.forEach((s,i)=>{ if(s.getBoundingClientRect().top - top <= 100) cur=i; });
    nav.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===cur));
  };
  mainEl.onscroll=onScroll; onScroll();
}

/* ── 4. Превью следует за тем, что правишь ─────────────────────────────── */
let syncTimer=null;
function syncPreview(key){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{
    const f=$('#frame'); let doc;
    try{ doc=f.contentDocument; }catch(e){ return; }
    if(!doc) return;
    const el=doc.querySelector('[data-i18n="'+CSS.escape(key)+'"]');
    if(!el) return;
    try{
      // у страниц включена плавная прокрутка — она перехватывает и уводит обратно
      const lenis=f.contentWindow && f.contentWindow.__lenis;
      if(lenis && lenis.destroy) lenis.destroy();
      doc.querySelectorAll('[data-reveal]').forEach(x=>{ x.style.opacity=1; x.style.transform='none'; });
      el.scrollIntoView({block:'center',behavior:'smooth'});
      const prev=el.style.outline;
      el.style.outline='2px solid #e2543a'; el.style.outlineOffset='4px';
      setTimeout(()=>{ el.style.outline=prev; },1200);
    }catch(e){}
  }, 220);
}

// ── история публикаций и откат ──────────────────────────────────────────
async function openHistory(){
  if(DIRTY && !confirm('Есть несохранённые правки. Уйти и потерять их?')) return;
  MODE='hist'; CUR=null; PAGE=null; DIRTY=false;
  document.querySelectorAll('.case,.pg').forEach(b=>b.classList.remove('on'));
  $('#navHist').classList.add('on'); $('#navShell').classList.remove('on'); $('#navCont').classList.remove('on');
  $('#ttl').textContent='История и откат';
  $('#chkBadge').classList.remove('on'); $('#secnav').innerHTML=''; $('#draftBar').hidden=true;
  $('#save').style.display=$('#revert').style.display='none';
  $('#checks').innerHTML='<div class="empty">Проверки считаются по кейсам.</div>';
  await drawHistory();
}
async function drawHistory(){
  const h=await api('/api/history');
  $('#form').innerHTML='<div class="sec"><h2>История</h2>'

    const r=await api('/api/history/revert',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({hash:b.dataset.h})});
    if(r.error) return toast(r.error,6000);

// ── медиатека: все картинки сайта в одном месте ──────────────────────────
// Смысл в колонке «где стоит»: заменить файл можно одним движением, а понять
// последствия — только если видно, в скольких местах он используется.
let MEDIA=null, MFILTER='', MONLYFREE=false;

async function openMedia(){
  if(DIRTY && !confirm('Есть несохранённые правки. Уйти и потерять их?')) return;
  MODE='media'; CUR=null; PAGE=null; DIRTY=false;
  document.querySelectorAll('.case,.pg').forEach(b=>b.classList.remove('on'));
  $('#navMedia').classList.add('on'); $('#navHist').classList.remove('on'); $('#navShell').classList.remove('on');
  $('#ttl').textContent='Медиатека';
  $('#chkBadge').classList.remove('on'); $('#secnav').innerHTML=''; $('#draftBar').hidden=true;
  $('#save').style.display=$('#revert').style.display='none';
  $('#checks').innerHTML='<div class="empty">Проверки считаются по кейсам.</div>';
  $('#frame').src='/portfolio.html?t='+Date.now();
  await drawMedia_lib();
}

async function drawMedia_lib(){
  MEDIA=await api('/api/media');
  const q=MFILTER.trim().toLowerCase();
  let list=MEDIA.items.filter(it=>(!q||it.name.toLowerCase().includes(q)) && (!MONLYFREE||!it.used.length));
  const sorters={
    used:(a,b)=>(b.used.length-a.used.length)||a.name.localeCompare(b.name),
    kb:(a,b)=>b.kb-a.kb,
    name:(a,b)=>a.name.localeCompare(b.name),
  };
  list=list.slice().sort(sorters[MSORT]||sorters.used);
  const card=it=>{
    const u=it.used.length
      ? '<b>Где стоит:</b><br>'+it.used.map(x=>'· '+esc(x.where)).join('<br>')
      : '<span class="mcard__free">Нигде не используется</span>';
    return '<div class="mcard'+(it.kb>1024?' mcard--heavy':'')+'" data-n="'+esc(it.name)+'">'
      + '<img class="mcard__img" src="/assets/img/'+it.name+'.webp?t='+STAMP+'" alt="" loading="lazy">'
      + '<div class="mcard__b"><div class="mcard__n">'+esc(it.name)+'.webp</div>'
      + '<div class="mcard__m">'+it.kb+' КБ · '+(it.variants.length?'копии '+it.variants.join('/'):'<span style="color:var(--warn)">нет копий</span>')+'</div>'
      + '<div class="mcard__u">'+u+'</div></div>'
      + '<div class="mcard__acts"><button data-a="open">Открыть</button>'
      + '<button data-a="repl">Заменить</button>'
      + (it.used.length?'':'<button data-a="del">Удалить</button>')
      + '</div></div>';
  };
  $('#form').innerHTML=
    '<div class="sec"><h2>Медиатека</h2>'
    + '<p style="color:var(--mute);font-size:12.5px;margin:0 0 11px">Все картинки сайта. Заменяешь файл — он обновляется <b>везде</b>, где стоит: в кейсе, на карточке портфолио, в ховере на манифесте и в ленте на телефоне. Имя не меняется, поэтому ничего не рвётся.</p>'
    + '<div class="mlbar"><input id="mq" placeholder="поиск по имени" value="'+esc(MFILTER)+'">'
    + '<button class="btn" id="mfree">'+(MONLYFREE?'✓ ':'')+'только неиспользуемые</button>'
    + '<span style="font:11px var(--mono);color:var(--mute);margin-left:4px">сортировка:</span>'
    + [['used','по местам'],['kb','по весу'],['name','по имени']].map(([k,l])=>
        '<button class="sortbtn'+(MSORT===k?' on':'')+'" data-sort="'+k+'">'+l+'</button>').join('')
    + '<span style="flex:1"></span>'
    + '<span style="font:11px var(--mono);color:var(--mute)">показано '+list.length+' из '+MEDIA.total+(MEDIA.unused?' · без применения '+MEDIA.unused:'')+'</span>'
    + '</div></div>'
    + '<div class="sec"><div class="drop drop--new" id="mAdd"><b>Загрузить картинки</b><br>'
    + '<span style="opacity:.7">перетащи сюда или нажми, чтобы выбрать — можно сразу несколько</span></div></div>'
    + '<div class="sec"><div class="mlgrid">'+(list.map(card).join('')||'<div class="locked">Ничего не найдено.</div>')+'</div></div>';

  $('#mq').oninput=e=>{ MFILTER=e.target.value; clearTimeout(window.__mq); window.__mq=setTimeout(drawMedia_lib,250); };
  $('#mfree').onclick=()=>{ MONLYFREE=!MONLYFREE; drawMedia_lib(); };
  for(const b of $('#form').querySelectorAll('[data-sort]')) b.onclick=()=>{ MSORT=b.dataset.sort; drawMedia_lib(); };

  wireDrop($('#mAdd'),{multiple:true,onFiles:async files=>{
    const z=$('#mAdd'), lbl=z.innerHTML; z.textContent='загружаю…';
    let n=0;
    for(const f of files){
      const stem=f.name.replace(/\.(webp|png|jpe?g)$/i,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'image';
      const r=await sendImage('/api/upload?stem='+encodeURIComponent(stem), f);
      if(r.cancel) continue;
      if(r.error){ toast(r.error,4000); break; } n++;
    }
    z.innerHTML=lbl;
    if(n){ STAMP=Date.now(); toast('Загружено: '+n+'. Теперь поставь картинку в кейс или как обложку.',4200); await drawMedia_lib(); }
  }});

  $('#form').querySelector('.mlgrid').onclick=async e=>{
    const c=e.target.closest('.mcard'); if(!c) return;
    const name=c.dataset.n;
    const it=MEDIA.items.find(x=>x.name===name);
    const a=(e.target.dataset||{}).a;
    if(a==='open'||e.target.classList.contains('mcard__img')) return lightboxLib(it);
    if(a==='repl') return pickFile(f=>replaceLib(f,it));
    if(a==='del'){
      if(!confirm('Удалить '+name+'.webp навсегда? Файл нигде не используется.')) return;
      const r=await api('/api/media/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});
      if(r.error) return toast(r.error,5000);
      toast('Удалено.'); await drawMedia_lib();
    }
  };

  for(const c of $('#form').querySelectorAll('.mcard')){
    const it=MEDIA.items.find(x=>x.name===c.dataset.n);
    wireDrop(c,{onFiles:f=>replaceLib(f,it)});
  }
}

async function replaceLib(f,it){
  const r=await sendImage('/api/replace?name='+encodeURIComponent(it.name), f);
  if(r.cancel) return;
  if(r.error) return toast(r.error,4500);
  STAMP=Date.now();
  await drawMedia_lib();
  $('#frame').src=$('#frame').src.split('?')[0]+'?t='+Date.now();
  toast(fmtNote(r, it.used.length
    ? 'Заменено. Обновилось во всех местах: '+it.used.length+'.'
    : 'Заменено.'), 4500);
}

function lightboxLib(it){
  const v=document.createElement('div'); v.className='lb';
  v.innerHTML='<div class="lb__top"><b>'+esc(it.name)+'.webp</b><span class="sp"></span>'
    + '<button class="btn" data-a="replace">Заменить файл</button><button class="btn" data-a="close">Закрыть</button></div>'
    + '<div class="lb__wrap"><img src="/assets/img/'+it.name+'.webp?t='+STAMP+'" alt=""></div>'
    + '<div class="lb__bottom"><span>'+it.kb+' КБ</span><span>копии: '+(it.variants.length?it.variants.join(' / '):'нет')+'</span>'
    + '<span>'+(it.used.length?'стоит в '+it.used.length+' местах':'нигде не используется')+'</span></div>';
  v.onclick=e=>{ const a=(e.target.dataset||{}).a;
    if(a==='close'||e.target===v||e.target.className==='lb__wrap') v.remove();
    if(a==='replace'){ v.remove(); pickFile(f=>replaceLib(f,it)); } };
  document.body.appendChild(v);
}

    }).join('')+'</div>';
  }
  $('#form').innerHTML=h;
  for(const el of $('#form').querySelectorAll('.rf[data-pk]')){
    wireRich(el, v=>{ PAGE.dict[el.dataset.l][el.dataset.pk]=v; mark(); syncPreview(el.dataset.pk); });
  }
  if(MANIFEST){
    for(const el of $('#form').querySelectorAll('.rf[data-mf]')){
      const [,n,f,lang]=el.dataset.mf.split('.');
      const c=MANIFEST.companies.find(x=>String(x.n)===n);
      wireRich(el, v=>{ if(lang) c[f][lang]=v; else c[f]=v; mark(); });
    }
    drawChips();
  }
  // CV: заменить можно тремя способами — кнопкой, кликом по зоне и перетаскиванием
  for(const btn of $('#form').querySelectorAll('.cvpick')){
    btn.onclick=e=>{ e.stopPropagation();
      pickFile(f=>uploadCv(f, btn.dataset.lang), {accept:'.pdf,application/pdf'}); };
  }
  buildSecNav();
  offerDraft();
  for(const dz of $('#form').querySelectorAll('.cvdrop')){
    wireDrop(dz,{accept:'.pdf,application/pdf',match:/\.pdf$/i,reject:'Нужен файл .pdf',
      onFiles:f=>uploadCv(f, dz.dataset.lang, dz)});
  }
  /* правки полей идут через wireRich */
}
// Загрузка CV: одна функция на кнопку, клик по зоне и перетаскивание
async function uploadCv(f, lang, zone){
  const label = zone ? zone.textContent : null;
  if(zone) zone.textContent='загружаю…';
  const busy = zone ? null : toast('Загружаю…', 60000);
  const r=await fetch('/api/cv/upload?lang='+lang,{method:'POST',body:f}).then(x=>x.json());
  if(busy) busy.remove();
  if(zone) zone.textContent=label;
  if(r.error) return toast(r.error, 4500);
  toast('CV заменено ('+r.kb+' КБ). Не забудь «Опубликовать».', 4000);
  await renderPage();
}

let MANIFEST=null;

function drawChips(){
  const box=$('#chips'); if(!box) return;
  box.innerHTML=MANIFEST.brands.map((b,i)=>'<span class="chip">'+esc(b)+'<button data-b="'+i+'" title="убрать">×</button></span>').join('')
    || '<span style="color:var(--mute);font-size:12.5px">пусто</span>';
  box.onclick=e=>{ const b=e.target.closest('[data-b]'); if(!b) return;
    MANIFEST.brands.splice(+b.dataset.b,1); mark(); drawChips(); };
  const inp=$('#newBrand'), btn=$('#addBrand');
  const addOne=()=>{ const v=inp.value.trim(); if(!v) return;
    MANIFEST.brands.push(v); inp.value=''; mark(); drawChips(); $('#newBrand').focus(); };
  if(btn) btn.onclick=addOne;
  if(inp) inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); addOne(); } };
}

async function savePage(){
  const r=await api('/api/page/'+encodeURIComponent(PAGE.file),{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify({dict:PAGE.dict})});
  if(MANIFEST && PAGE.file==='index.html'){

      body:JSON.stringify({companies:MANIFEST.companies,brands:MANIFEST.brands})});

  }
  unmark(); ORIG=JSON.parse(JSON.stringify(PAGE.dict));
  $('#frame').src='/'+(PAGE.file==='index.html'?'':PAGE.file)+'?t='+Date.now();

}

async function save(){
  const r=await api('/api/case/'+CUR,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(DATA)});
  unmark(); ORIG=JSON.parse(JSON.stringify(DATA));
  drawChecks(r.problems); refreshPreview(); toast('Сохранено на диск. На сайт — кнопкой «Опубликовать».');
  MODEL=await api('/api/model');
  document.querySelectorAll('.case').forEach(b=>{ const c=MODEL.cases.find(x=>x.n===b.dataset.n);
    b.querySelector('b').textContent=`${c.n} · ${c.title||'—'}`; b.querySelector('span').textContent=`${c.year||''} · ${c.role||''}`; });
}
async function check(){ drawChecks((await api('/api/validate')).problems); }
function drawChecks(ps){
  ALLCHECKS = ps || [];
  const mine=ALLCHECKS.filter(p=>p.n===CUR), other=ALLCHECKS.length-mine.length;
  $('#checks').innerHTML = (mine.length? mine.map(p=>`<div class="chk ${p.lvl}"><span class="n">${p.n}</span><span>${p.msg}</span></div>`).join('')
    : '<div class="empty">В этом кейсе замечаний нет.</div>')
    + (other? `<div class="chk info"><span class="n">···</span><span>Ещё ${other} замечани${other%10===1&&other%100!==11?'е':'й'} в других кейсах — покажутся при публикации.</span></div>`:'');
  drawBadge();
}
let ALLCHECKS=[];
// Замечания жили внизу формы, на 5000 px ниже — их никто не видел.
// Счётчик в шапке лезет в глаза сам, список открывается по клику.
function drawBadge(){
  const b=$('#chkBadge');
  const mine=ALLCHECKS.filter(p=>p.n===CUR);
  const err=mine.filter(p=>p.lvl==='err').length;
  const show=MODE==='case'&&mine.length;
  b.classList.toggle('on',!!show);
  b.classList.toggle('err',!!err);
  if(!show) return;
  b.textContent=(err?'✗ ':'⚠ ')+mine.length+(mine.length===1?' замечание':mine.length<5?' замечания':' замечаний');
  b.onclick=()=>{
    const old=document.querySelector('.chkpop'); if(old){ old.remove(); return; }
    const pop=document.createElement('div'); pop.className='chkpop';
    pop.innerHTML=mine.map(p=>`<div class="chk ${p.lvl}"><span>${p.msg}</span></div>`).join('');
    $('.main').appendChild(pop);
    setTimeout(()=>document.addEventListener('click',function off(e){
      if(!e.target.closest('.chkpop')&&e.target!==b){ pop.remove(); document.removeEventListener('click',off); }
    }),0);
  };
}

function refreshPreview(){
