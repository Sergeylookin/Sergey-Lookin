/* ── публикация ── */
// Какие страницы затронуты правками: и русские файлы, и их английские копии
// сводим к адресу русской страницы — проверка сама возьмёт оба языка.
function changedPages(files){
  const set=new Set();
  for(const line of files){
    const f=line.replace(/^\S+\s+/,'').replace(/^"|"$/g,'').replace(/^en\//,'');
    if(/^(index|about|portfolio|404)\.html$/.test(f) || /^projects\/\d\d\.html$/.test(f)) set.add('/'+f);
  }
  return [...set];
}
// Что из изменённого относится к сайту: страницы, словари, картинки, видео, резюме.
// Код (скрипты сайта, сама CMS, инструменты сборки) кнопкой не отправляется.
const SITE_FILES=/^(index|portfolio|about|404)\.html$|^(projects|en|content)\/|^assets\/(img|cv|vid|og)\/|^sitemap\.xml$/;
const fileOf=l=>l.replace(/^\S+\s+/,'').replace(/^"|"$/g,'');
// Кнопка показывает, сколько сохранённого ещё не дошло до сайта: раньше это было
// видно, только если её нажать, и сохранённая правка легко оставалась на компьютере.
let pubTimer=null;
async function pubCount(){
  let ch; try{ ch=await api('/api/changes'); }catch(e){ return; }
  const files=ch.files.filter(l=>SITE_FILES.test(fileOf(l))).length, n=files||ch.ahead||0;
  const b=$('#pub');
  b.innerHTML='Опубликовать'+(n?'<span class="pubn">'+n+'</span>':'');
  b.title=files ? 'Сохранено, но ещё не на сайте: '+files+' '+plural(files,['файл','файла','файлов'])
    : n ? 'Готовых версий без публикации: '+n : 'На сайте актуальная версия';
}
const pubSoon=()=>{ clearTimeout(pubTimer); pubTimer=setTimeout(pubCount,700); };
addEventListener('focus',pubSoon);

$('#pub').onclick=async()=>{
  if(DIRTY && !(await ask({title:'Есть несохранённые правки', text:'В публикацию уходит только то, что сохранено. Несохранённое останется в полях.', ok:'Публиковать без них', cancel:'Вернуться и сохранить'}))) return;
  const [ch,val,mir]=await Promise.all([api('/api/changes'),api('/api/validate'),api('/api/mirror').catch(()=>({items:[]}))]);
  const errs=val.problems.filter(p=>p.lvl==='err'), warns=val.problems.filter(p=>p.lvl!=='err');
  // Кнопка отправляет содержимое сайта: страницы, словари, картинки, видео, резюме.
  // Код (скрипты сайта, сама CMS, инструменты сборки) отсюда не уходит — его в
  // списке не показываем, чтобы не обещать лишнего.
  const other=ch.files.filter(l=>!SITE_FILES.test(fileOf(l))).length;
  ch.files=ch.files.filter(l=>SITE_FILES.test(fileOf(l)));
  const pages=changedPages(ch.files);
  const can=ch.files.length||ch.ahead;
  const v=document.createElement('div'); v.className='veil';
  v.innerHTML=`<div class="modal"><header><h3>Опубликовать на сайт</h3><button class="btn" data-close>Отмена</button></header>
    <div class="body">
      <h4>Что уйдёт — ${ch.files.length} ${plural(ch.files.length,['файл','файла','файлов'])}</h4>
      ${ch.files.length? `<div class="steps" style="max-height:132px;overflow:auto">${ch.files.map(f=>`<div>${esc(f)}</div>`).join('')}</div>`
        : ch.ahead? `<p>Правок в файлах нет, но готовых версий без публикации: <b>${ch.ahead}</b>. Так бывает после отката — его тоже надо довезти до сайта.</p>`
        : '<p>Изменений нет — на сайте уже актуальная версия.</p>'}
      ${other? `<p style="color:var(--mute);font-size:12px">Ещё ${other} ${plural(other,['файл','файла','файлов'])} с кодом (скрипты, CMS, инструменты) изменены, но этой кнопкой не отправляются.</p>`:''}
      ${errs.length? `<h4 style="color:var(--accent)">Ошибки — публикация не пойдёт</h4>${errs.map(p=>`<p>${p.n}: ${p.msg}</p>`).join('')}`:''}
      <div id="pubGuard"></div>
      ${mir.items&&mir.items.length? `<h4>Перевод не обновлён — ${mir.items.length}</h4><p style="margin-bottom:8px">Русский текст изменён, английский остался прежним. Публиковать можно, но на английской версии будет старый смысл.</p>${mir.items.slice(0,10).map((m,i)=>`<div class="gitem" style="border-left-color:var(--warn)"><span class="gw">${esc(m.where)}</span><span>${esc(m.label)}</span><button class="x" data-mir="${i}">Открыть</button></div>`).join('')}${mir.items.length>10?`<p>…и ещё ${mir.items.length-10}</p>`:''}`:''}
      ${warns.length? `<h4>Замечания к текстам — ${warns.length}, публиковать можно</h4>${warns.slice(0,8).map(p=>`<p>${p.n}: ${p.msg}</p>`).join('')}${warns.length>8?`<p>…и ещё ${warns.length-8}</p>`:''}`:''}
      <h4>Подпись к правке</h4><input id="msg" value="Правки через CMS">
      <div id="log" style="margin-top:14px"></div>
    </div>
    <footer><button class="btn" data-close>Отмена</button><button class="btn pri" id="go" disabled>Опубликовать</button></footer></div>`;
  let closed=false;
  v.onclick=e=>{
    if(e.target===v||e.target.dataset.close!==undefined){ closed=true; v.remove(); return; }
    const m=e.target.closest('[data-mir]');
    if(m){ const it=mir.items[+m.dataset.mir]; closed=true; v.remove(); setFMode('both'); jump(it.target, it.key); }
  };
  document.body.appendChild(v);
  const go=$('#go',v), pg=$('#pubGuard',v);
  const arm=()=>{ go.disabled=!(can && !errs.length); };

  // Вёрстку проверяем здесь же: поломка не должна уйти на сайт незамеченной.
  if(can && !errs.length && pages.length){
    pg.innerHTML='<h4>Проверка вёрстки</h4><p id="pgState">Открываю '+pages.length+' '+plural(pages.length,['страницу','страницы','страниц'])+' на трёх устройствах и двух языках…</p>';
    const problems=await guardRun(pages,(n,total)=>{ const s=$('#pgState',v); if(s) s.textContent='Проверено видов: '+n+' из '+total+'…'; });
    if(closed) return;
    if(!problems.length){
      pg.innerHTML='<h4 style="color:var(--ok)">Вёрстка цела</h4><p>Проверено '+pages.length*6+' видов: десктоп, планшет и телефон, на русском и английском. Новых поломок относительно опубликованной версии нет.</p>';
      arm();
    } else {
      pg.innerHTML='<h4 style="color:var(--accent)">Вёрстка: '+problems.length+' '+plural(problems.length,['проблема','проблемы','проблем'])+'</h4>'
        + guardListHTML(problems)
        + '<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink);cursor:pointer"><input type="checkbox" id="pgForce" style="width:auto"> Публикую всё равно — я видел эти места и они меня устраивают</label>';
      wireGuardList(pg, problems);
      $('#pgForce',v).onchange=e=>{ go.disabled=!e.target.checked; };
    }
  } else arm();

  go.onclick=async()=>{
    go.disabled=true; go.textContent='публикую…';
    $('#log',v).innerHTML='<div class="steps"><div>сборка…</div></div>';
    const r=await post('/api/publish',{message:$('#msg',v).value});
    $('#log',v).innerHTML=`<div class="steps">${r.steps.map(s=>`<div><span class="${s.ok?'m':'b'}">${s.ok?'✓':'✕'}</span><span>${esc(s.name)}${s.out?' — '+esc(s.out.split('\n').slice(-1)[0].slice(0,90)):''}</span></div>`).join('')}</div>`;
    if(r.published){ watchDeploy(); Guard.clearBase(); guardReset(); }
    pubSoon();
    if(r.published){ go.textContent='Готово'; $('#log',v).insertAdjacentHTML('beforeend',
      '<p style="margin-top:10px">Отправлено. Сборка на GitHub идёт сама — сайт обновится за пару минут. Если правок не видно: Ctrl+Shift+R.</p>'); }
    else if(r.nothing){ go.textContent='Нечего публиковать'; }
    else { go.disabled=false; go.textContent='Повторить'; }
  };
};

boot();
</script></body></html>
