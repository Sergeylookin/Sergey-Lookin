      <div class="kindrow"><div class="seg" id="coverKind"><button data-k="img" class="${isVid?'':'on'}">Картинка</button><button data-k="vid" class="${isVid?'on':''}">Видео</button></div>
        <span class="fnote" style="margin:0">${isVid?'на карточке играет ролик, картинка — постер':'на карточке картинка'}</span></div></div>
    <div class="f"><label>${isVid?'Постер':'Картинка'} <button class="i" data-hint="Нажми на картинку в том месте, которое должно остаться в кадре. Обложка обрезается в окне при наведении на главной и в ленте на телефоне — точка говорит, что беречь.">i</button></label>
      ${cover.poster
        ? `<div class="focal" id="focal" title="нажми, чтобы поставить точку кадра"><img src="/assets/img/${esc(cover.poster)}.webp?t=${STAMP}" alt=""><i style="left:${pos[0]}%;top:${pos[1]}%"></i></div>
           <div class="fnote">${esc(cover.poster)}.webp · точка кадра ${esc(meta.pos||'по центру')}${meta.pos?' · <button class="x" id="posReset">сбросить</button>':''}</div>`
        : '<div class="fnote" style="color:var(--warn)">Обложки пока нет — карточка в портфолио будет пустой.</div>'}
      <div class="drop" id="dropCover" style="margin-top:7px;padding:10px">${cover.poster?'перетащи новую картинку или нажми, чтобы заменить':'перетащи картинку или нажми, чтобы выбрать'}</div></div>
    <div class="f"><label>Видео <button class="i" data-hint="Файл .mp4 до 40 МБ, без звука. Имя постоянное — меняется только содержимое. Чем короче и легче ролик, тем быстрее откроется портфолио.">i</button></label>
      <div class="cvrow"><div><b>${vid.exists?'assets/vid/'+esc(meta.slug)+'.mp4':'видео не загружено'}</b>
        <div class="cvmeta">${vid.exists?vid.mb+' МБ'+(isVid?' · играет на карточке':' · лежит без дела: обложка сейчас картинка'):'загрузи ролик, чтобы включить видео-обложку'}</div></div>
        <button class="btn${vid.exists?'':' pri'}" id="pickVid">${vid.exists?'Заменить видео':'Загрузить видео'}</button>
        <div class="drop cvdrop" id="dropVid">перетащи mp4 или нажми, чтобы выбрать</div></div></div>
    </div>`;

  for(const [name,keys] of groups){
    h+=`<div class="sec"><h2>${name}</h2>`+keys.map(k=>{const f=MODEL.fields.find(x=>x.k===k); return f?field(f):'';}).join('')+`</div>`;
  }
  h+=`<div class="sec" id="secMedia"><h2>Картинки и видео</h2><div class="media" id="media"></div>
      <div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap"><button class="btn" id="addFull">+ во всю ширину</button><button class="btn" id="addRow" title="Блок на две картинки рядом">+ две в ряд</button><button class="btn" id="addVideo">+ видео</button></div></div>`;
  $('#form').innerHTML=h;

  wireFields();
  $('#year').oninput=e=>{ DATA.year=e.target.value; mark(); };
  $('#addFull').onclick=()=>{ DATA.media.push({type:'full',src:'',alt:''}); mark(); drawMedia(); };
  $('#addRow').onclick=()=>{ DATA.media.push({type:'row',items:[{src:'',alt:''},{src:'',alt:''}]}); mark(); drawMedia(); };
  $('#addVideo').onclick=()=>pickFile(f=>addCaseVideo(f),{accept:'.mp4,video/mp4'});
  wireCaseOps();
  drawMedia();
  buildSecNav();
}
const caseMeta=()=>MODEL.cases.find(c=>c.n===CUR)||{status:'published',cover:{},video:{},slug:''};
// Подсказки «i» — одно делегирование на всю форму, а не обработчик на каждую перерисовку.
document.addEventListener('click',e=>{
  const i=e.target.closest && e.target.closest('#form .i');
  if(i){ tip(i,i.dataset.hint); e.stopPropagation(); }
});

// ── операции над кейсом целиком ────────────────────────────────────────────
// Обновить всё, что CMS знает о кейсах, не трогая несохранённый текст в полях.
async function refreshCase(msg){
  MODEL=await api('/api/model'); drawList(); markCur(); rerender(); refreshPreview(true);
  if(msg) toast(msg, 4200);
}
// Основа имён файлов кейса — его слаг. Главная собирает кадры для окна при
// наведении прямо из слага (<слаг>-preview, <слаг>-1, <слаг>.mp4), поэтому
// файл с другим именем там просто не покажется.
const caseSlug=()=>caseMeta().slug||('case-'+CUR);

function wireCaseOps(){
  const meta=caseMeta();
  $('#statusSeg').onclick=async e=>{
    const b=e.target.closest('[data-s]'); if(!b) return;
    const r=await post('/api/case/'+CUR+'/status',{status:b.dataset.s});
    if(r.error) return toast(r.error, 5000);
    MODEL=await api('/api/model'); drawList(); markCur();
    const m=caseMeta();
    $('#statusSeg').querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s===m.status));
    $('#ttl').innerHTML=`${CUR} · ${esc(DATA.dict.ru['p.title']||'')} <span class="badge badge--${m.status}">${MODEL.statusRu[m.status]}</span>`;
    refreshPreview(true);
    toast(m.status==='published'?'Кейс вернулся на сайт. Сетка и таблица пересобраны.':'Кейс скрыт. Убран из сетки, таблицы и поиска — страница и все тексты целы, вернуть можно в любой момент.', 4200);
  };

  const setCover=async(patch,msg)=>{
    const r=await post('/api/case/'+CUR+'/cover',patch);
    if(r.error){ toast(r.error,5000); return false; }
    STAMP=Date.now(); await refreshCase(msg); return true;
  };
  // видео: один файл на кейс, имя постоянное — меняется только содержимое
  const upVid=async f=>{
    const z=$('#dropVid'), lbl=z.textContent; z.textContent='загружаю…';
    const r=await fetch('/api/video?slug='+encodeURIComponent(caseSlug()),{method:'POST',body:f}).then(x=>x.json()).catch(()=>({error:'Не удалось загрузить файл.'}));
    z.textContent=lbl;
    if(r.error){ toast(r.error,4500); return false; }
    STAMP=Date.now();
    await refreshCase('Видео загружено ('+r.mb+' МБ).');
    return true;
  };
  wireDrop($('#dropVid'),{accept:'.mp4,video/mp4',match:/\.mp4$/i,reject:'Нужен файл .mp4',onFiles:upVid});
  $('#pickVid').onclick=e=>{ e.stopPropagation(); pickFile(upVid,{accept:'.mp4,video/mp4'}); };

  // картинка ↔ видео
  $('#coverKind').onclick=async e=>{
    const b=e.target.closest('[data-k]'); if(!b) return;
    const kind=b.dataset.k, now=(meta.cover||{}).kind||'img';
    if(kind===now) return;
    if(kind==='vid' && !(meta.video||{}).exists){
      // видео ещё нет — просим файл и включаем обложку сразу после загрузки
      return pickFile(async f=>{ if(await upVid(f)) setCover({kind:'vid'},'На карточке теперь видео. Картинка осталась постером.'); },{accept:'.mp4,video/mp4'});
    }
    setCover({kind}, kind==='vid'?'На карточке теперь видео. Картинка осталась постером.':'На карточке снова картинка. Видео-файл остался на диске — можно вернуть в один клик.');
  };

  // Постер: заменяем ТОТ ЖЕ файл — тогда он обновится и в карточке, и в окне
  // при наведении на главной. Новое имя заводим, только если обложки ещё нет.
  wireDrop($('#dropCover'),{onFiles:async f=>{
    const dc=$('#dropCover'); const label=dc.textContent; dc.textContent='загружаю…';
    const cur=(meta.cover||{}).poster;
    const r=await sendImage(cur ? '/api/replace?name='+encodeURIComponent(cur)
                               : '/api/upload?name='+encodeURIComponent(caseSlug()+'-preview'), f);
    dc.textContent=label;
    if(r.cancel) return;
    if(r.error) return toast(r.error,4000);
    STAMP=Date.now();
    if(cur) await refreshCase(fmtNote(r,'Обложка заменена — обновилась в карточке и на главной.'));
    else await setCover({poster:r.name},'Обложка поставлена.');
  }});

  // точка кадра: щелчок по картинке
  const fo=$('#focal');
  if(fo) fo.onclick=e=>{
    const r=fo.getBoundingClientRect();
    const x=Math.round(Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100)));
    const y=Math.round(Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100)));
    setCover({pos:x+'% '+y+'%'},'Точка кадра сохранена.');
  };
  if($('#posReset')) $('#posReset').onclick=e=>{ e.preventDefault(); setCover({pos:''},'Точка кадра сброшена — обложка обрезается по центру.'); };

  $('#dupCase').onclick=async()=>{
    if(!(await ask({title:'Сделать копию кейса?', text:'Копия появится скрытой — на сайт она не попадёт, пока сам не переключишь её в «На сайте».', ok:'Сделать копию'}))) return;
    const r=await post('/api/case/'+CUR+'/duplicate');
    if(r.error) return toast(r.error);
    MODEL=await api('/api/model'); drawList(); await open(r.id);
    toast('Копия создана и скрыта — заполняй спокойно.');
  };
  $('#delCase').onclick=async()=>{
    const title=DATA.dict.ru['p.title']||'';
    const ans=await askText({title:'Удалить кейс навсегда', danger:true, ok:'Удалить навсегда', need:title, placeholder:title,
      text:'Файл страницы будет стёрт, вернуть его можно будет только через «Историю и откат».\n\nЕсли нужно просто убрать кейс с сайта — закрой окно и переключи его в «Скрыт»: всё содержимое останется целым.\n\nЧтобы удалить, впиши название кейса точно: '+title});
    if(ans===null) return;
    const r=await post('/api/case/'+CUR+'/delete',{confirm:ans});
    if(r.error) return toast(r.error, 5000);
    CUR=null; DIRTY=false; MODEL=await api('/api/model'); drawList(); await open(MODEL.cases[0].n);
    toast('Кейс удалён. Сетка и таблица пересобраны.');
  };
}
document.addEventListener('click',e=>{ if(!e.target.closest('.i')&&!e.target.closest('.tip')) hideTip(); });

// Видео внутри кейса: файл получает имя <слаг>-v1, -v2… Размер кадра сервер
// читает из самого ролика — по нему страница заранее знает пропорции.
async function addCaseVideo(f, into){
  if(!/\.mp4$/i.test(f.name)) return toast('Нужен файл .mp4',4000);
  const busy=toast('Загружаю видео…',120000);
  const url = into && into.video ? '/api/video?slug='+encodeURIComponent(into.video) : '/api/video?stem='+encodeURIComponent(caseSlug());
  const r=await fetch(url,{method:'POST',body:f}).then(x=>x.json()).catch(()=>({error:'Не удалось загрузить файл.'}));
  busy.remove();
  if(r.error) return toast(r.error,4500);
  const patch={video:r.name,w:r.w,h:r.h,exists:true,mb:+r.mb};
  if(into) Object.assign(into,patch);
  else DATA.media.push({type:'video',poster:'',alt:'',...patch});
  STAMP=Date.now(); mark(); drawMedia();
  toast(into?'Видео заменено ('+r.mb+' МБ).':'Видео добавлено ('+r.mb+' МБ). Поставь постер и опиши, что на нём.',4800);
}

function drawMedia(){
  const box=$('#media');
  const slot=(it,i,j)=>{
    const url=it.src?'/assets/img/'+it.src+'.webp?t='+STAMP:'';
    const miss=it.src&&!it.exists;
    return '<div class="slot" data-i="'+i+'" data-j="'+j+'">'
      + (it.src
          ? '<img class="slot__img" src="'+url+'" alt="" loading="lazy" data-open="'+esc(it.src)+'">'
          : '<div class="slot__empty">пусто — перетащи файл или нажми</div>')
      + '<div class="slot__acts">'
        + (it.src?'<button data-act="open">Открыть</button>':'')
        + '<button data-act="replace">'+(it.src?'Заменить':'Загрузить')+'</button>'
        + (it.src?'<button data-act="clear">Убрать</button>':'')
      + '</div>'
      + '<div class="slot__meta">'
        + (it.src?'<span class="nm">'+esc(it.src)+'.webp</span>':'<span>файл не выбран</span>')
        + (miss?'<span class="warn">нет на диске</span>':'')
        + (it.exists&&it.w?'<span>'+it.w+'×'+it.h+'</span>':'')
        + (it.exists?'<span>'+it.kb+' КБ</span>':'')
        + '<span class="sp"></span>'
        + (it.exists?(it.variants.length?'<span>копии '+it.variants.join('/')+'</span>':'<span class="warn">нет копий для телефона</span>'):'')
      + '</div>'
      + '<input class="slot__alt" data-i="'+i+'" data-j="'+j+'" data-p="alt" value="'+esc(it.alt)+'" placeholder="alt — что на кадре, одной фразой">'
      + '</div>';
  };

  // Видео-блок: слева сам ролик, справа его постер — картинка, которую видно,
  // пока ролик не загрузился.
  const videoBlock=(m,i)=>{
    const poster=m.poster?'/assets/img/'+m.poster+'.webp?t='+STAMP:'';
    return '<div class="mb mb--video" data-i="'+i+'" draggable="true">'
      + '<div class="mb__bar"><span class="grab">⠿</span><b>Видео</b><div class="sp"></div>'
        + '<button class="x" data-act="del">удалить блок</button></div>'
      + '<div class="mb__body">'
        + '<div class="slot" data-v="1">'
          + (m.video&&m.exists ? '<video class="slot__vid" src="/assets/vid/'+esc(m.video)+'.mp4?t='+STAMP+'" muted loop playsinline controls preload="metadata"'+(poster?' poster="'+poster+'"':'')+'></video>'
                               : '<div class="slot__empty">'+(m.video?'файла нет на диске':'видео не выбрано')+'</div>')
          + '<div class="slot__acts" style="opacity:1"><button data-act="vreplace">'+(m.video?'Заменить видео':'Загрузить видео')+'</button></div>'
          + '<div class="slot__meta">'+(m.video?'<span class="nm">'+esc(m.video)+'.mp4</span>':'<span>файл не выбран</span>')
            + (m.exists?'<span>'+m.mb+' МБ</span>':'')+(m.w&&m.h?'<span>'+m.w+'×'+m.h+'</span>':'')
            + (m.mb>12?'<span class="warn">тяжёлое</span>':'')+'</div>'
          + '<input class="slot__alt" data-i="'+i+'" data-p="valt" value="'+esc(m.alt||'')+'" placeholder="что на видео, одной фразой">'
        + '</div>'
        + '<div class="slot slot--poster" data-poster="1">'
          + (m.poster ? '<img class="slot__img" src="'+poster+'" alt="" loading="lazy">' : '<div class="slot__empty">постер — перетащи картинку<br>или нажми</div>')
          + '<div class="slot__acts"><button data-act="preplace">'+(m.poster?'Заменить':'Загрузить')+'</button>'+(m.poster?'<button data-act="pclear">Убрать</button>':'')+'</div>'
          + '<div class="slot__meta">'+(m.poster?'<span class="nm">'+esc(m.poster)+'.webp</span>':'<span class="warn">нет постера</span>')+'</div>'
        + '</div>'
      + '</div></div>';
  };

  box.innerHTML=DATA.media.map((m,i)=>{
    if(m.type==='video') return videoBlock(m,i);
    if(m.type==='raw'||m.type==='comment'){
      const label=m.type==='comment'?'заметка в разметке':'особый блок';
      return '<div class="mb"><div class="mb__bar"><b>🔒 '+label+'</b><div class="sp"></div><span>не редактируется</span></div></div>';
    }
    const items=m.type==='row'?m.items:[m];
    return '<div class="mb '+(m.type==='row'?'mb--row':'mb--full')+'" data-i="'+i+'" draggable="true">'
      + '<div class="mb__bar"><span class="grab">⠿</span><b>'+(m.type==='row'?'Две в ряд':'Во всю ширину')+'</b>'
        + '<div class="sp"></div>'
        + (m.type==='full'
            ? '<button class="x" data-act="topair" title="Картинка встанет в левую половину, справа появится место для второй">добавить вторую рядом</button>'
            : '<button class="x" data-act="tofull" title="Каждая картинка станет отдельным блоком во всю ширину">поставить друг под другом</button>')
        + '<button class="x" data-act="del">удалить блок</button></div>'
      + '<div class="mb__body">'+items.map((it,j)=>slot(it,i,m.type==='row'?j:-1)).join('')+'</div></div>';
  }).join('') || '<div class="locked">Картинок пока нет.</div>';

  box.insertAdjacentHTML('beforeend',
    '<div class="drop drop--new" id="dropNew"><b>Добавить картинки</b><br>'
    + '<span style="opacity:.7">перетащи сюда или нажми, чтобы выбрать на компьютере — можно сразу несколько</span></div>');

  const at=(i,j)=>{ const m=DATA.media[i]; return j>=0?m.items[j]:m; };

  box.oninput=e=>{ const t=e.target;
    if(t.dataset.p==='valt'){ DATA.media[+t.dataset.i].alt=t.value; mark(); return; }
    if(t.dataset.p!=='alt') return;
    at(+t.dataset.i,+t.dataset.j).alt=t.value; mark(); };

  // постер видео: картинка кейса, имя по общему правилу
  const putPoster=async(f,m)=>{
    const r=await sendImage(m.poster ? '/api/replace?name='+encodeURIComponent(m.poster) : '/api/upload?stem='+encodeURIComponent(caseSlug()+'-poster'), f);
    if(r.cancel) return;
    if(r.error) return toast(r.error,4500);
    m.poster=r.name; STAMP=Date.now(); mark(); drawMedia();
    toast(fmtNote(r,'Постер поставлен.'),4000);
  };

  box.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    const mb=e.target.closest('.mb'); const sl=e.target.closest('.slot');
    const i=mb?+mb.dataset.i:-1;
    const act=b.dataset.act;
    if(act==='del'){
      // без вопроса «точно?»: блок убирается сразу, а вернуть его можно одной кнопкой
      const gone=DATA.media.splice(i,1)[0]; mark(); drawMedia();
      toastAction('Блок убран со страницы. Файлы остались на диске.','Вернуть',()=>{ DATA.media.splice(i,0,gone); mark(); drawMedia(); });
      return;
    }
    if(act==='vreplace') return pickFile(f=>addCaseVideo(f,DATA.media[i]),{accept:'.mp4,video/mp4'});
    if(act==='preplace') return pickFile(f=>putPoster(f,DATA.media[i]));
    if(act==='pclear'){ DATA.media[i].poster=''; mark(); drawMedia(); return; }
    if(act==='topair'){ const m=DATA.media[i]; DATA.media[i]={type:'row',items:[{...m},{src:'',alt:''}]}; mark(); drawMedia(); return; }
    if(act==='tofull'){ const m=DATA.media[i]; DATA.media.splice(i,1,...m.items.filter(x=>x.src).map(x=>({type:'full',...x}))); mark(); drawMedia(); return; }
    if(!sl) return;
    const j=+sl.dataset.j, it=at(i,j);
    if(act==='open') return lightbox(it,i,j);
    if(act==='clear'){ Object.assign(it,{src:'',alt:'',w:'',h:'',exists:false,kb:0,variants:[]}); mark(); drawMedia(); return; }
    if(act==='replace') return pickFile(async f=>{ await putImage(f,it,i,j); });
  };

  // клик по самой картинке — открыть
  for(const im of box.querySelectorAll('.slot__img')){
    im.onclick=()=>{ const sl=im.closest('.slot'); lightbox(at(+sl.dataset.i,+sl.dataset.j),+sl.dataset.i,+sl.dataset.j); };
  }

  // на слот можно и перетащить файл, и кликнуть по пустому месту
  // у видео-блока свои зоны: ролик принимает mp4, постер — картинку
  for(const mb of box.querySelectorAll('.mb--video')){
    const m=DATA.media[+mb.dataset.i];
    const v=mb.querySelector('[data-v]'), ps=mb.querySelector('[data-poster]');
    wireDrop(v,{accept:'.mp4,video/mp4',match:/\.mp4$/i,reject:'Нужен файл .mp4',guard:()=>!!drag,onFiles:f=>addCaseVideo(f,m)});
    v.onclick=null; v.style.cursor='';
    wireDrop(ps,{guard:()=>!!drag,onFiles:f=>putPoster(f,m)});
  }
  for(const sl of box.querySelectorAll('.slot[data-i]')){
    const i=+sl.dataset.i, j=+sl.dataset.j;
    wireDrop(sl,{guard:()=>!!drag,onFiles:f=>putImage(f, at(i,j), i, j)});
    // у заполненного слота клик по картинке открывает просмотр, а не файловое окно
    if(at(i,j).src) sl.onclick=e=>{ if(e.target.closest('button')) return; lightbox(at(i,j),i,j); };
  }

  // перестановка блоков мышью
  let drag=null;
  for(const mb of box.querySelectorAll('.mb')){
    mb.ondragstart=e=>{ drag=mb; mb.classList.add('mb--drag'); e.dataTransfer.effectAllowed='move'; };
    mb.ondragend=()=>{ mb.classList.remove('mb--drag');
      const order=[...box.querySelectorAll('.mb')].map(x=>+x.dataset.i);
      DATA.media=order.map(k=>DATA.media[k]).concat(DATA.media.filter((m,k)=>!order.includes(k)));
      drag=null; mark(); drawMedia(); };
    mb.ondragover=e=>{ if(!drag||drag===mb) return; e.preventDefault();
      const r=mb.getBoundingClientRect();
      box.insertBefore(drag,(e.clientY-r.top)/r.height>.5?mb.nextSibling:mb); };
  }

  // общая зона: новые картинки в конец
  const dn=$('#dropNew');
  wireDrop(dn,{multiple:true,guard:()=>!!drag,onFiles:async files=>{
    const label=dn.innerHTML; dn.textContent='загружаю…';
    let n=0;
    for(const f of files){
      const r=await sendImage('/api/upload?stem='+encodeURIComponent(caseSlug()), f);
      if(r.cancel) continue;
      if(r.error){ toast(r.error,4000); break; }
      DATA.media.push({type:'full',src:r.name,alt:'',w:r.w,h:r.h,exists:true,kb:r.kb||0,variants:r.variants}); n++;
    }
    dn.innerHTML=label;
    if(n){ STAMP=Date.now(); mark(); drawMedia(); toast(n===1?'Картинка добавлена — впиши alt.':'Добавлено '+n+'. Впиши alt каждой.'); }
  }});
}

// Заменить файл в конкретном слоте. Если слот пустой — заливаем как новую
// картинку; если занят — перезаписываем ТОТ ЖЕ файл, чтобы ссылки не порвались.
async function putImage(f, it, i, j){
  const was = it.src;
  const url = was ? '/api/replace?name='+encodeURIComponent(was)
                  : '/api/upload?stem='+encodeURIComponent(caseSlug());
  const r=await sendImage(url, f);
  if(r.cancel) return;
  if(r.error) return toast(r.error, 4500);
  Object.assign(it,{src:r.name,w:r.w,h:r.h,exists:true,kb:r.kb||0,variants:r.variants||[]});
  STAMP=Date.now();
  mark(); drawMedia();
  toast(fmtNote(r, was? 'Файл заменён. Копии для телефона пересозданы.' : 'Картинка загружена.'), 4500);
}

// ── приём картинок: PNG и JPG принимаем, но кладём на сайт webp ──────────
// Сайт целиком на webp (srcset, копии для телефонов). Раньше CMS просто
// отказывалась от PNG — приходилось идти пересохранять в Figma. Теперь
// пересохраняем сами, но не молча: показываем оба веса и даём выбрать.
const IMG_ACCEPT='.webp,.png,.jpg,.jpeg,image/webp,image/png,image/jpeg';
const IMG_MATCH=/\.(webp|png|jpe?g)$/i;
const IMG_REJECT='Нужна картинка: .webp, .png или .jpg.';

function askFormat(f, p){
  return new Promise(done=>{
    const v=document.createElement('div'); v.className='lb fmt';
    const save=Math.max(0, 100-Math.round(p.q90Kb/p.origKb*100));
    v.innerHTML='<div class="lb__top"><b>'+esc(f.name)+'</b><span class="sp"></span>'
      + '<button class="btn" data-a="cancel">Отмена</button></div>'
      + '<div class="lb__wrap"><div class="fmt__box">'
      + '<p class="fmt__lead">Это '+p.kind.toUpperCase()+', '+p.w+'×'+p.h+', '+p.origKb+' КБ.<br>'
      + 'Сайт работает на webp — переведу в него. Как?</p>'
      + '<button class="fmt__opt" data-a="compress"><b>Сжать</b>'
      + '<i>'+p.q90Kb+' КБ — легче в '+(p.origKb/Math.max(1,p.q90Kb)).toFixed(1)+' раза'
      + (save>0?', минус '+save+'% веса':'')+'</i>'
      + '<u>Качество 90. На глаз от оригинала не отличить. Рекомендую.</u></button>'
      + '<button class="fmt__opt" data-a="lossless"><b>Без потерь</b>'
      + '<i>'+p.losslessKb+' КБ</i>'
      + '<u>Пиксель в пиксель. Берите, если на картинке мелкий текст или скриншот интерфейса.</u></button>'
      + '</div></div><div class="lb__bottom"><span>Оригинал на компьютере остаётся нетронутым.</span></div>';
    const close=r=>{ v.remove(); document.removeEventListener('keydown',key); done(r); };
    const key=e=>{ if(e.key==='Escape') close(null); };
    v.onclick=e=>{ const b=e.target.closest('[data-a]');
      if(b) return close(b.dataset.a==='cancel'?null:b.dataset.a);
      if(e.target===v||e.target.classList.contains('lb__wrap')) close(null); };
    document.addEventListener('keydown',key);
    document.body.appendChild(v);
  });
}

// Единственная дорога, по которой картинка попадает на сервер.
// Возвращает ответ сервера либо {cancel:true}, если человек передумал.
async function sendImage(url, f){
  let mode='keep';
  if(!/\.webp$/i.test(f.name)){
    const busy=toast('Смотрю картинку…', 60000);
    const p=await fetch('/api/probe',{method:'POST',body:f}).then(x=>x.json()).catch(()=>({error:'Сервер не ответил.'}));
    busy.remove();
    if(p.error) return p;
    // Расширению в имени не верим. Из Фигмы файл иногда приезжает как .png,
    // а внутри уже webp — тогда спрашивать не о чем и пережимать нечего.
    if(p.kind!=='webp'){
      mode=await askFormat(f,p);
      if(!mode) return {cancel:true};
    }
  }
  const busy=toast(mode==='keep'?'Загружаю…':'Перевожу в webp…', 60000);
  const r=await fetch(url+(url.includes('?')?'&':'?')+'mode='+mode,{method:'POST',body:f})
    .then(x=>x.json()).catch(()=>({error:'Не удалось загрузить файл.'}));
  busy.remove();
  return r;
}

// Что сказать после загрузки: если формат меняли — назвать цифры.
function fmtNote(r, base){
  if(r.mode && r.mode!=='keep' && r.wasKb)
    return base+' '+r.kind.toUpperCase()+' → webp: '+r.wasKb+' → '+r.kb+' КБ.';
  return base;
}

function pickFile(cb,{accept=IMG_ACCEPT,multiple=false}={}){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept=accept; inp.multiple=multiple;
  inp.onchange=()=>{ if(inp.files.length) cb(multiple?[...inp.files]:inp.files[0]); };
  inp.click();
}

// Любая зона загрузки работает двумя способами: перетащить файл ИЛИ кликнуть
// и выбрать в окне Windows. Одно поведение на всю CMS.
function wireDrop(el,{accept=IMG_ACCEPT,multiple=false,match=IMG_MATCH,reject=IMG_REJECT,onFiles,guard}={}){
  const take=list=>{ const ok=[...list].filter(f=>match.test(f.name));
    if(!ok.length) return toast(reject,4000);
    onFiles(multiple?ok:ok[0]); };
  el.ondragover=e=>{ if(guard&&guard()) return; e.preventDefault(); el.classList.add('hot'); };
  el.ondragleave=()=>el.classList.remove('hot');
  el.ondrop=e=>{ if(guard&&guard()) return; e.preventDefault(); e.stopPropagation(); el.classList.remove('hot'); take(e.dataTransfer.files); };
  el.onclick=e=>{ if(e.target.closest('button,a,input')) return; pickFile(f=>take(multiple?f:[f]),{accept,multiple}); };
  el.style.cursor='pointer';
}

// Просмотр картинки целиком
function lightbox(it,i,j){
  if(!it.src) return;
  const v=document.createElement('div'); v.className='lb';
  v.innerHTML='<div class="lb__top"><b>'+esc(it.src)+'.webp</b><span class="sp"></span>'
    + '<button class="btn" data-a="replace">Заменить файл</button>'
    + '<button class="btn" data-a="close">Закрыть</button></div>'
    + '<div class="lb__wrap"><img src="/assets/img/'+it.src+'.webp?t='+STAMP+'" alt=""></div>'
    + '<div class="lb__bottom"><span>'+(it.w?it.w+'×'+it.h+' · ':'')+it.kb+' КБ</span>'
    + '<span>копии: '+(it.variants&&it.variants.length?it.variants.join(' / '):'нет')+'</span>'
    + '<span>alt: '+(it.alt?esc(it.alt):'— не заполнен')+'</span></div>';
  v.onclick=e=>{
    const a=(e.target.dataset||{}).a;
    if(a==='close'||e.target===v||e.target.className==='lb__wrap') v.remove();
    if(a==='replace'){ v.remove(); pickFile(f=>putImage(f,it,i,j)); }
  };
  document.addEventListener('keydown',function esc2(e){ if(e.key==='Escape'){ v.remove(); document.removeEventListener('keydown',esc2); } });
  document.body.appendChild(v);
}

// Что изменено с последнего сохранения — человеческими названиями.
function changedFields(){
  if(!ORIG) return [];
  const out=[];
  const name=k=>KLABEL[k]||k;
  const dicts=(was,now)=>{
    for(const l of ['ru','en']){
      const keys=new Set([...Object.keys(was[l]||{}),...Object.keys(now[l]||{})]);
      for(const k of keys) if(!same((was[l]||{})[k],(now[l]||{})[k])) out.push(name(k)+' · '+l.toUpperCase());
    }
  };
  const widths=(was,now)=>{
    for(const k of new Set([...Object.keys(was||{}),...Object.keys(now||{})]))
      if(!same((was||{})[k],(now||{})[k])) out.push(name(k)+' · ширина рамки');
  };
  if(MODE==='case'&&DATA){
    dicts(ORIG.dict,DATA.dict);
    if(DATA.year!==ORIG.year) out.push('Год');
    if(JSON.stringify(DATA.media)!==JSON.stringify(ORIG.media)) out.push('Картинки и видео');
    widths(ORIG.widths,DATA.widths);
  } else if(MODE==='page'&&PAGE){
    dicts(ORIG.dict,PAGE.dict);
    for(const [id,v] of Object.entries(PAGE.attrs||{}))
      for(const l of ['ru','en']) if(!same(((ORIG.attrs||{})[id]||{})[l],v[l])) out.push(name(id)+' · '+l.toUpperCase());
    widths(ORIG.widths,PAGE.widths);
    if(MANIFEST&&ORIG.mf){
      MANIFEST.companies.forEach((c,i)=>{ const o=ORIG.mf.companies[i]||{};
        if(c.yrs!==o.yrs) out.push('Компания '+c.n+' · годы');
        if(c.name!==o.name) out.push('Компания '+c.n+' · название'); });
      if(MANIFEST.brands.join('|')!==ORIG.mf.brands.join('|')) out.push('Бренды в бегущей строке');
    }
  } else if(MODE==='shell'&&SHELL){
    dicts(ORIG,SHELL);
  } else if(MODE==='cont'&&CONT){
    CONT.items.forEach((it,i)=>{ const o=ORIG[i]||{};
      if(it.url!==o.url) out.push(it.name+': ссылка');
      if(it.handle!==o.handle) out.push(it.name+': подпись'); });
    const wasExtra=(CONT.__extra0||[]).join('\n');
    if(wasExtra!==(CONT.extra||[]).join('\n') && CONT.__extra0) out.push('ещё профили');
  }
  return out;
}
const mark=()=>{
  const list=changedFields(), n=list.length;
  DIRTY=n>0;
  const b=$('#save');
  b.classList.toggle('pri',DIRTY);
  b.innerHTML='Сохранить'+(n?'<span class="savecount">'+n+'</span>':'');
  b.title=n?('Изменено: '+list.slice(0,14).join(', ')+(n>14?' и ещё '+(n-14):'')):'';
  markFields();
  if(DIRTY) saveDraft(); else dropDraft();
};

// годы и названия компаний на главной: обычный текст без перевода
function mfGet(path, orig){
  const [,n,f]=path.split('.');
  const list=orig ? (ORIG.mf||{}).companies : (MANIFEST||{}).companies;
  const c=(list||[]).find(x=>String(x.n)===n);
  return c ? c[f] : undefined;
}
function mfSet(path, v){
  const [,n,f]=path.split('.');
  const c=MANIFEST.companies.find(x=>String(x.n)===n);
  if(c) c[f]=v;
}

/* Помечаем изменённые поля и даём вернуть каждое по отдельности.
   Заодно следим за вторым языком: если русский текст поменяли, а английский
   остался прежним, под полем появляется метка «не обновлён». */
function markFields(){
  if(!ORIG) return;
  const box=$('#form'); if(!box) return;
  // Контакты — обычные поля ввода, у них своя разметка: подсвечиваем строку
  // и даём вернуть ссылку и подпись вместе, они всегда меняются в паре.
  if(MODE==='cont'&&CONT){
    for(const el of box.querySelectorAll('input[data-ci]')){
      const i=+el.dataset.ci, o=ORIG[i]||{}, it=CONT.items[i]||{};
      const f=el.closest('.f'); if(!f) continue;
      const changed = it.url!==o.url || it.handle!==o.handle;
      f.classList.toggle('dirty', changed);
      const label=f.querySelector('label'); if(!label) continue;
      const already=label.querySelector('.undo1');
      if(changed && !already){
        const b=document.createElement('button');
        b.className='undo1'; b.textContent='вернуть'; b.title='вернуть эту ссылку как была';
        b.onclick=ev=>{ ev.preventDefault();
          CONT.items[i].url=o.url; CONT.items[i].handle=o.handle;
          for(const x of f.querySelectorAll('input[data-ci]')) x.value=o[x.dataset.k]??'';
          mark(); };
        label.appendChild(b);
      }
      if(!changed && already) already.remove();
    }
    return;
  }
  for(const f of box.querySelectorAll('.f[data-fid]')){
    const rf=f.querySelector('.rf'); if(!rf) continue;
    const ds=rf.dataset;
    const langs=f.dataset.neutral?['ru']:['ru','en'];
    const ch=l=>!same(fGet(ds,l,true),fGet(ds,l,false));
    const any=langs.some(ch);
    f.classList.toggle('dirty',any);
    const label=f.querySelector('label');
    const already=label.querySelector('.undo1');
    if(any && !already){
      const b=document.createElement('button');
      b.className='undo1'; b.textContent='вернуть'; b.title='вернуть это поле как было';
      b.onclick=ev=>{ ev.preventDefault();
        for(const l of langs){ const was=fGet(ds,l,true)??''; fSet(ds,l,was); fLive(ds,l,was); }
        refreshField(f); mark(); };
      label.appendChild(b);
    }
    if(!any && already) already.remove();
    const o=f.querySelector('.oth');
    if(o){
      const other=o.dataset.oth, txt=plainText(fGet(ds,other,false)), mine=plainText(fGet(ds,ds.l,false));
      o.classList.toggle('stale', ch(ds.l) && !ch(other) && !!txt);
      o.classList.toggle('none', !txt && !!mine);
      o.lastElementChild.textContent = txt || (mine?'нет перевода':'пусто');
    }
  }
}

// keepDraft — не трогать черновик: раздел только что открыли, а не сохранили
const unmark=(keepDraft)=>{ DIRTY=false; const b=$('#save'); b.classList.remove('pri'); b.textContent='Сохранить'; b.title='Ctrl+S'; if(!keepDraft) dropDraft(); pubSoon(); };

/* ── 3. Черновик в браузере ────────────────────────────────────────────
   Правки живут в памяти вкладки: перезагрузил или закрыл — потерял.
   Пишем их себе в браузер и предлагаем вернуть при следующем открытии. */
const draftKey=()=> MODE==='case' ? 'draft:case:'+CUR
  : MODE==='page' ? 'draft:page:'+PAGE.file
  : MODE==='shell' ? 'draft:shell'
  : MODE==='cont' ? 'draft:contacts' : null;
// Что именно записываем в черновик — по разделу. Раньше здесь были только
// кейсы и страницы, поэтому правки шапки и контактов при обрыве терялись
// молча: восстанавливать было нечего.
function draftPayload(){
  if(MODE==='case') return {dict:DATA.dict,year:DATA.year,media:DATA.media,widths:DATA.widths||{}};
  if(MODE==='page') return {dict:PAGE.dict,attrs:PAGE.attrs||{},widths:PAGE.widths||{},mf:MANIFEST?{companies:MANIFEST.companies,brands:MANIFEST.brands}:null};
  if(MODE==='shell') return {ru:SHELL.ru,en:SHELL.en};
  if(MODE==='cont') return {items:CONT.items,extra:CONT.extra};
  return null;
}
let draftTimer=null;
function saveDraft(){
  const k=draftKey(); if(!k) return;
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{
    try{
      const payload = draftPayload(); if(!payload) return;
      localStorage.setItem(k, JSON.stringify({at:Date.now(), payload}));
    }catch(e){}
  }, 1200);
}
function dropDraft(){ const k=draftKey(); if(k) try{ localStorage.removeItem(k); }catch(e){} }
function readDraft(){
  const k=draftKey(); if(!k) return null;
  try{ const raw=localStorage.getItem(k); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function offerDraft(){
  const bar=$('#draftBar'); bar.hidden=true;
  const d=readDraft(); if(!d) return;
  if(JSON.stringify(d.payload)===JSON.stringify(draftPayload())){ dropDraft(); return; }   // черновик совпал с файлом
  const when=new Date(d.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  bar.hidden=false;
  bar.innerHTML='<b>Есть несохранённый черновик от '+when+'.</b> Правки не попали в файлы.'
    + '<span class="sp"></span><button data-d="use">Восстановить</button><button class="no" data-d="drop">Удалить черновик</button>';
  bar.onclick=e=>{
    const a=(e.target.dataset||{}).d; if(!a) return;
    if(a==='use'){
      if(MODE==='case'){ DATA.dict=d.payload.dict; DATA.year=d.payload.year; DATA.media=d.payload.media; DATA.widths=d.payload.widths||DATA.widths; render(); }
      else if(MODE==='page'){
        PAGE.dict=d.payload.dict;
        if(d.payload.attrs) PAGE.attrs=d.payload.attrs;
        if(d.payload.widths) PAGE.widths=d.payload.widths;
        if(d.payload.mf&&MANIFEST){ MANIFEST.companies=d.payload.mf.companies; MANIFEST.brands=d.payload.mf.brands; }
        renderPage();
      }
      else if(MODE==='shell'){ SHELL.ru=d.payload.ru; SHELL.en=d.payload.en; renderShell(); }
      else if(MODE==='cont'){ CONT.items=d.payload.items; CONT.extra=d.payload.extra; renderContacts(); }
      mark(); refreshPreview(true); toast('Черновик восстановлен. Проверь и нажми «Сохранить».',4000);
    } else { dropDraft(); }
    bar.hidden=true;
  };
}

/* Свёрнутые разделы помнятся: форма перерисовывается после каждой загрузки файла,
   и без памяти всё свёрнутое раскрывалось заново. У кейсов память общая — разделы
   у них одинаковые; у страниц — своя на каждую. */
const foldKey=()=>MODE==='case' ? 'case' : MODE+':'+((PAGE&&PAGE.file)||'');
const secKey=s=>s.dataset.screen||s.id||(s.querySelector('h2')||{}).textContent||'';
const formSecs=()=>[...$('#form').querySelectorAll('.sec')].filter(s=>s.querySelector('h2'));
const foldStore=()=>{ try{ return JSON.parse(localStorage.getItem('cms.folded')||'{}'); }catch(e){ return {}; } };
function saveFolds(){
  const all=foldStore(), list=formSecs().filter(s=>s.classList.contains('folded')&&!s.classList.contains('is-off')).map(secKey);
  if(list.length) all[foldKey()]=list; else delete all[foldKey()];
  try{ localStorage.setItem('cms.folded',JSON.stringify(all)); }catch(e){}
  paintFoldAll();
}
function unfold(sec){ if(!sec||!sec.classList.contains('folded')) return; sec.classList.remove('folded'); saveFolds(); }
function paintFoldAll(){
  const b=$('#foldAll');
  b.textContent=formSecs().some(s=>!s.classList.contains('folded')) ? 'Свернуть все' : 'Раскрыть все';
  $('#secnavBox').style.setProperty('--foldw',(b.offsetWidth+18)+'px');
}

/* ── 1. Полоска разделов ───────────────────────────────────────────────── */
function buildSecNav(){
  const nav=$('#secnav'), box=$('#secnavBox');
  const secs=formSecs();
  if(secs.length<2){ nav.innerHTML=''; box.hidden=true; return; }
  box.hidden=false;
  const saved=new Set(foldStore()[foldKey()]||[]);
  for(const s of secs) if(saved.has(secKey(s))) s.classList.add('folded');
  nav.innerHTML=secs.map((s,i)=>{
    const n=s.querySelectorAll('.rf,input,textarea').length;
    return '<button data-s="'+i+'">'+esc(s.querySelector('h2').textContent)+(n?'<span class="n" title="полей в разделе">'+n+'</span>':'')+'</button>';
  }).join('');
  $('#foldAll').onclick=()=>{ const close=secs.some(s=>!s.classList.contains('folded'));
    for(const s of secs) s.classList.toggle('folded',close); saveFolds(); $('.main').scrollTop=0; };
  paintFoldAll();
  // заголовок экрана встаёт сразу под шапкой и полоской, а не прячется за ними
  nav.onclick=e=>{ const b=e.target.closest('[data-s]'); if(!b) return;
    const s=secs[+b.dataset.s];
    unfold(s);
    scrollMainTo(s); };
  // сворачивание по клику на заголовок
  for(const s of secs) s.querySelector('h2').onclick=()=>{ s.classList.toggle('folded'); saveFolds(); };
  // Полоска длиннее колонки: с того края, где есть ещё экраны, она уходит в тень,
  // а колесо мыши листает её вбок — иначе до дальних названий не добраться.
  const edges=()=>{ box.classList.toggle('more-l',nav.scrollLeft>4);
    box.classList.toggle('more-r',nav.scrollLeft+nav.clientWidth<nav.scrollWidth-4); };
  nav.onscroll=edges;
  nav.onwheel=e=>{ if(nav.scrollWidth>nav.clientWidth && Math.abs(e.deltaY)>Math.abs(e.deltaX)){ e.preventDefault(); nav.scrollLeft+=e.deltaY; } };
  // подсветка текущего раздела при прокрутке; его название держим на виду
  const mainEl=$('.main');
  let last=-1;
  const onScroll=()=>{
    const top=mainEl.getBoundingClientRect().top, line=barsHeight()+30;
    let cur=0;
    secs.forEach((s,i)=>{ if(s.getBoundingClientRect().top - top <= line) cur=i; });
    // форма докручена до конца — значит, смотрим последний раздел, даже если он короткий
    if(mainEl.scrollTop>0 && mainEl.scrollTop+mainEl.clientHeight>=mainEl.scrollHeight-2){
      for(let i=secs.length-1;i>cur;i--) if(secs[i].getBoundingClientRect().top - top < mainEl.clientHeight){ cur=i; break; }
    }
    nav.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===cur));
    if(cur!==last){ last=cur; const b=nav.children[cur];
      if(b){ const l=b.offsetLeft-40, r=b.offsetLeft+b.offsetWidth+40;
        if(l<nav.scrollLeft) nav.scrollLeft=Math.max(0,l); else if(r>nav.scrollLeft+nav.clientWidth) nav.scrollLeft=r-nav.clientWidth; } }
    edges();
  };
  mainEl.onscroll=onScroll; onScroll();
}

// ── медиатека: все картинки и видео сайта в одном месте ──────────────────
// Смысл в колонке «где стоит»: заменить файл можно одним движением, а понять
// последствия — только если видно, в скольких местах он используется.
let MEDIA=null, MFILTER='', MONLYFREE=false;

async function openMedia(){
  if(!(await leaveOk())) return;
  enterSection('media','#navMedia','Медиатека',false);
  $('#form').onclick=null;
  refreshPreview();
  await drawMedia_lib();

async function drawMedia_lib(){
  MEDIA=await api('/api/media');
  const q=MFILTER.trim().toLowerCase();
  let list=MEDIA.items.filter(it=>(!q||it.name.toLowerCase().includes(q)) && (!MONLYFREE||!it.used.length));
  const sorters={
    used:(a,b)=>(b.used.length-a.used.length)||a.name.localeCompare(b.name),
    kb:(a,b)=>b.kb-a.kb,
    name:(a,b)=>a.name.localeCompare(b.name),
  };
  list=list.slice().sort(sorters[MSORT]||sorters.used);
  const where=u=>u.length ? '<b>Где стоит:</b><br>'+u.map(x=>'· '+esc(x.where)).join('<br>') : '<span class="mcard__free">Нигде не используется</span>';
  const card=it=>'<div class="mcard'+(it.kb>1024?' mcard--heavy':'')+'" data-n="'+esc(it.name)+'">'
      + '<img class="mcard__img" src="/assets/img/'+it.name+'.webp?t='+STAMP+'" alt="" loading="lazy">'
      + '<div class="mcard__b"><div class="mcard__n">'+esc(it.name)+'.webp</div>'
      + '<div class="mcard__m">'+it.kb+' КБ · '+(it.variants.length?'копии '+it.variants.join('/'):'<span style="color:var(--warn)">нет копий</span>')+'</div>'
      + '<div class="mcard__u">'+where(it.used)+'</div></div>'
      + '<div class="mcard__acts"><button data-a="open">Открыть</button>'
      + '<button data-a="repl">Заменить</button>'
      + (it.used.length?'':'<button data-a="del">Удалить</button>')
      + '</div></div>';
  const vcard=v=>'<div class="mcard'+(v.mb>12?' mcard--heavy':'')+'" data-v="'+esc(v.name)+'">'
      + '<video class="mcard__img" src="/assets/vid/'+v.name+'.mp4?t='+STAMP+'" muted loop playsinline preload="metadata" controls></video>'
      + '<div class="mcard__b"><div class="mcard__n">'+esc(v.name)+'.mp4</div>'
      + '<div class="mcard__m">'+v.mb+' МБ</div>'
      + '<div class="mcard__u">'+where(v.used)+'</div></div>'
      + '<div class="mcard__acts"><button data-a="vrepl">Заменить</button>'
      + (v.used.length?'':'<button data-a="vdel">Удалить</button>')
      + '</div></div>';
  const vids=(MEDIA.videos||[]).filter(v=>(!q||v.name.toLowerCase().includes(q)) && (!MONLYFREE||!v.used.length));
  $('#form').innerHTML=
    '<div class="sec"><h2>Медиатека</h2>'
    + '<p style="color:var(--mute);font-size:12.5px;margin:0 0 11px">Все картинки и видео сайта. Заменяешь файл — он обновляется <b>везде</b>, где стоит: в кейсе, на карточке портфолио, в окне при наведении на главной и в ленте на телефоне. Имя не меняется, поэтому ничего не рвётся.</p>'
    + '<div class="mlbar"><input id="mq" placeholder="поиск по имени" value="'+esc(MFILTER)+'">'
    + '<button class="btn" id="mfree">'+(MONLYFREE?'✓ ':'')+'только неиспользуемые</button>'
    + '<span style="font:11px var(--mono);color:var(--mute);margin-left:4px">сортировка:</span>'
    + [['used','по местам'],['kb','по весу'],['name','по имени']].map(([k,l])=>
        '<button class="sortbtn'+(MSORT===k?' on':'')+'" data-sort="'+k+'">'+l+'</button>').join('')
    + '<span style="flex:1"></span>'
    + '<span style="font:11px var(--mono);color:var(--mute)">картинок '+list.length+' из '+MEDIA.total+(MEDIA.unused?' · без применения '+MEDIA.unused:'')+' · видео '+vids.length+'</span>'
    + '</div></div>'
    + '<div class="sec"><div class="drop drop--new" id="mAdd"><b>Загрузить картинки</b><br>'
    + '<span style="opacity:.7">перетащи сюда или нажми, чтобы выбрать — можно сразу несколько</span></div></div>'
    + (vids.length?'<div class="sec"><h2>Видео</h2><div class="mlgrid" id="vgrid">'+vids.map(vcard).join('')+'</div></div>':'')
    + '<div class="sec"><h2>Картинки</h2><div class="mlgrid" id="igrid">'+(list.map(card).join('')||'<div class="locked">Ничего не найдено.</div>')+'</div></div>';

  $('#mq').oninput=e=>{ MFILTER=e.target.value; clearTimeout(window.__mq); window.__mq=setTimeout(async()=>{ await drawMedia_lib(); const i=$('#mq'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } },250); };
  $('#mfree').onclick=()=>{ MONLYFREE=!MONLYFREE; drawMedia_lib(); };
  for(const b of $('#form').querySelectorAll('[data-sort]')) b.onclick=()=>{ MSORT=b.dataset.sort; drawMedia_lib(); };

  wireDrop($('#mAdd'),{multiple:true,onFiles:async files=>{
    const z=$('#mAdd'), lbl=z.innerHTML; z.textContent='загружаю…';
    let n=0;
    for(const f of files){
      const stem=f.name.replace(/\.(webp|png|jpe?g)$/i,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'image';
      const r=await sendImage('/api/upload?stem='+encodeURIComponent(stem), f);
      if(r.cancel) continue;
      if(r.error){ toast(r.error,4000); break; } n++;
    }
    z.innerHTML=lbl;
    if(n){ STAMP=Date.now(); toast('Загружено: '+n+'. Теперь поставь картинку в кейс или как обложку.',4200); await drawMedia_lib(); }
  }});

  $('#igrid').onclick=async e=>{
    const c=e.target.closest('.mcard'); if(!c) return;
    const name=c.dataset.n;
    const it=MEDIA.items.find(x=>x.name===name);
    const a=(e.target.dataset||{}).a;
    if(a==='open'||e.target.classList.contains('mcard__img')) return lightboxLib(it);
    if(a==='repl') return pickFile(f=>replaceLib(f,it));
    if(a==='del'){
      if(!(await ask({title:'Удалить '+name+'.webp?', text:'Файл нигде не используется. Удаление необратимо.', ok:'Удалить', danger:true}))) return;
      const r=await post('/api/media/delete',{name});
      if(r.error) return toast(r.error,5000);
      toast('Удалено.'); await drawMedia_lib();
    }
  };
  for(const c of $('#igrid').querySelectorAll('.mcard')){
    const it=MEDIA.items.find(x=>x.name===c.dataset.n);
    wireDrop(c,{onFiles:f=>replaceLib(f,it)});
    c.onclick=null;                      // щелчок по карточке — не выбор файла: для этого есть кнопка
  }

  const vg=$('#vgrid');
  if(vg) vg.onclick=async e=>{
    const c=e.target.closest('.mcard'); if(!c) return;
    const name=c.dataset.v, a=(e.target.dataset||{}).a;
    if(a==='vrepl') return pickFile(async f=>{
      const busy=toast('Загружаю видео…',120000);
      const r=await fetch('/api/video?slug='+encodeURIComponent(name),{method:'POST',body:f}).then(x=>x.json()).catch(()=>({error:'Не удалось загрузить файл.'}));
      busy.remove();
      if(r.error) return toast(r.error,4500);
      STAMP=Date.now(); await drawMedia_lib(); refreshPreview(true);
      toast('Видео заменено ('+r.mb+' МБ). Обновилось везде, где стоит.',4500);
    },{accept:'.mp4,video/mp4'});
    if(a==='vdel'){
      if(!(await ask({title:'Удалить '+name+'.mp4?', text:'Видео нигде не используется. Удаление необратимо.', ok:'Удалить', danger:true}))) return;
      const r=await post('/api/media/delete-video',{name});
      if(r.error) return toast(r.error,5000);
      toast('Удалено.'); await drawMedia_lib();
    }
  };
}

async function replaceLib(f,it){
  const r=await sendImage('/api/replace?name='+encodeURIComponent(it.name), f);
  if(r.cancel) return;
  if(r.error) return toast(r.error,4500);
  STAMP=Date.now();
  await drawMedia_lib();
  refreshPreview(true);
  toast(fmtNote(r, it.used.length
    ? 'Заменено. Обновилось во всех местах: '+it.used.length+'.'
    : 'Заменено.'), 4500);
}

function lightboxLib(it){
  const v=document.createElement('div'); v.className='lb';
  v.innerHTML='<div class="lb__top"><b>'+esc(it.name)+'.webp</b><span class="sp"></span>'
    + '<button class="btn" data-a="replace">Заменить файл</button><button class="btn" data-a="close">Закрыть</button></div>'
    + '<div class="lb__wrap"><img src="/assets/img/'+it.name+'.webp?t='+STAMP+'" alt=""></div>'
    + '<div class="lb__bottom"><span>'+it.kb+' КБ</span><span>копии: '+(it.variants.length?it.variants.join(' / '):'нет')+'</span>'
    + '<span>'+(it.used&&it.used.length?'стоит в '+it.used.length+' местах':'')+'</span></div>';
  const esc2=e=>{ if(e.key==='Escape'){ v.remove(); document.removeEventListener('keydown',esc2); } };
  v.onclick=e=>{ const a=(e.target.dataset||{}).a;
    if(a==='close'||e.target===v||e.target.className==='lb__wrap'){ v.remove(); document.removeEventListener('keydown',esc2); }
    if(a==='replace'){ v.remove(); document.removeEventListener('keydown',esc2); pickFile(f=>(it.onReplace||(x=>replaceLib(x,it)))(f)); } };
  document.addEventListener('keydown',esc2);
  document.body.appendChild(v);
}

/* ── редактор страницы ─────────────────────────────────────────────────────
   Страница приходит с сервера уже разложенной по экранам — в том порядке, в каком
   они идут на сайте, с названиями полей (cms/labels.mjs). Здесь к полям добавляются
   вещи, которые живут рядом с текстом: порядок и видимость экранов, годы и названия
   компаний, бренды, резюме, картинки страницы и превью для мессенджеров. */
let MANIFEST=null;
async function openPage(file, focusKey){
  if(!(await leaveOk())) return;
  MODE='page'; CUR=null; DIRTY=false;
  navOn('.pg[data-f="'+file+'"]'); markCur(); remember({type:'page',file}); sectionOpened();
  $('#form').onclick=null;
  await loadPageData(file);
  ORIG=snapPage();
  $('#ttl').textContent=PAGE.label;
  $('#save').style.display=$('#revert').style.display='';
  $('#chkBadge').classList.remove('on'); guardReset(); unmark(true);
  renderPage();
  offerDraft();
  refreshPreview();
  if(focusKey) setTimeout(()=>focusField(focusKey),60);
}
async function loadPageData(file){
  PAGE=await api('/api/page/'+encodeURIComponent(file));
  MANIFEST = file==='index.html' ? await api('/api/manifest') : null;
  CV = file==='about.html' ? await api('/api/cv') : null;
}
const snapPage=()=>JSON.parse(JSON.stringify({ dict:PAGE.dict, attrs:PAGE.attrs||{}, widths:PAGE.widths||{},
  mf: MANIFEST ? {companies:MANIFEST.companies, brands:MANIFEST.brands} : null }));

function renderPage(){
  FDEFS=[]; KLABEL={};
  let h='';
  if(PAGE.canStructure) h+=screensHTML();
  for(const s of PAGE.screens){
    let body='';
    if(s.id==='@meta' && PAGE.og) body+=ogHTML();
    for(const f of s.fields) body+=pageField(f);
    if(s.id==='companies' && MANIFEST) body+=brandsHTML();
    if(s.id==='@page' && PAGE.images && PAGE.images.length) body+=pageImagesHTML();
    if(!body) continue;
    h+='<div class="sec'+(s.hidden?' is-off folded':'')+'" data-screen="'+esc(s.id)+'"><h2>'+esc(s.name)+'</h2>'
      + (s.hidden?'<p class="gnote">Экран скрыт: на сайте его нет, но тексты целы и правятся как обычно. Вернуть — в списке экранов наверху.</p>':'')
      + body+'</div>';
    // Резюме — своим разделом: так оно попадает в полоску разделов наверху и
    // до замены файла один щелчок, а не прокрутка через все тексты страницы.
    if(s.id==='@page' && CV) h+='<div class="sec" data-screen="@cv"><h2>Резюме PDF</h2>'+cvHTML()+'</div>';
  }
  $('#form').innerHTML=h;

async function applyStructure(order, hidden, undo){
  const r=await post('/api/page/'+encodeURIComponent(PAGE.file)+'/structure',{order,hidden});
  if(r.error) return toast(r.error,5000);
  if(!r.changed) return;
  const before={order:realScreens().map(s=>s.id), hidden:realScreens().filter(s=>s.hidden).map(s=>s.id)};
  PAGE.screens=r.screens;
  rerender(); refreshPreview(true);
  const msg='Экраны обновлены. Номера глав пересчитаны.';
  if(undo) toast(msg,3200); else toastAction(msg,'Вернуть',()=>applyStructure(before.order,before.hidden,true));
  guardRun(['/'+PAGE.file]);
}

function wirePageExtras(){
  // ── список экранов
  const box=$('#screens');
  if(box){
    box.onclick=e=>{
      const eye=e.target.closest('[data-eye]');
      if(eye){
        const id=eye.dataset.eye, list=realScreens();
        const hidden=new Set(list.filter(s=>s.hidden).map(s=>s.id));
        hidden.has(id) ? hidden.delete(id) : hidden.add(id);
        return applyStructure(list.map(s=>s.id), [...hidden]);
      }
      const nm=e.target.closest('.nm');
      if(nm){
        const id=nm.closest('.scr').dataset.id;
        const sec=$('#form').querySelector('.sec[data-screen="'+id+'"]');
        if(sec){ unfold(sec); scrollMainTo(sec); }
        const d=Live.doc(), el=d&&d.getElementById(id);
        if(el){ const w=Live.win(), y=el.getBoundingClientRect().top+w.scrollY;
          if(w.__lenis&&w.__lenis.scrollTo) w.__lenis.scrollTo(y,{duration:.5}); else w.scrollTo({top:y,behavior:'smooth'}); }
      }
    };
    let drag=null;
    for(const row of box.querySelectorAll('.scr')){
      if(row.classList.contains('fixed')) continue;
      row.ondragstart=e=>{ drag=row; row.classList.add('scr--drag'); e.dataTransfer.effectAllowed='move'; };
      row.ondragend=()=>{ row.classList.remove('scr--drag'); drag=null;
        const order=[...box.querySelectorAll('.scr')].map(x=>x.dataset.id);
        if(order.join()!==realScreens().map(s=>s.id).join())
          applyStructure(order, realScreens().filter(s=>s.hidden).map(s=>s.id)); };
      row.ondragover=e=>{ if(!drag||drag===row) return; e.preventDefault();
        const r=row.getBoundingClientRect();
        box.insertBefore(drag,(e.clientY-r.top)/r.height>.5?row.nextSibling:row); };
    }
  }
  // ── бренды
  if(MANIFEST) drawChips();
  // ── резюме
  for(const btn of $('#form').querySelectorAll('.cvpick'))
    btn.onclick=e=>{ e.stopPropagation(); pickFile(f=>uploadCv(f, btn.dataset.lang), {accept:'.pdf,application/pdf'}); };
  for(const dz of $('#form').querySelectorAll('.cvdrop[data-lang]'))
    wireDrop(dz,{accept:'.pdf,application/pdf',match:/\.pdf$/i,reject:'Нужен файл .pdf', onFiles:f=>uploadCv(f, dz.dataset.lang, dz)});
  // ── картинки страницы
  for(const c of $('#form').querySelectorAll('.pimg[data-img]')){
    const it=PAGE.images.find(x=>x.name===c.dataset.img);
    const repl=async f=>{
      const r=await sendImage('/api/replace?name='+encodeURIComponent(it.name), f);
      if(r.cancel) return;
      if(r.error) return toast(r.error,4500);
      STAMP=Date.now(); await reloadPageModel(); refreshPreview(true);
      toast(fmtNote(r,'Картинка заменена. Размеры на странице пересчитаны.'),4500);
      guardRun(['/'+PAGE.file]);
    };
    it.onReplace=repl;
    c.querySelector('img').onclick=()=>lightboxLib(it);
    c.querySelector('[data-a="repl"]').onclick=()=>pickFile(repl);
    wireDrop(c.querySelector('.drop'),{onFiles:repl});
  }
  // ── превью для мессенджеров
  const og=$('#ogCard');
  if(og){
    const up=async f=>{
      const busy=toast('Готовлю превью 1200×630…',60000);
      const r=await fetch('/api/og',{method:'POST',body:f}).then(x=>x.json()).catch(()=>({error:'Не удалось загрузить файл.'}));
      busy.remove();
      if(r.error) return toast(r.error,5000);
      STAMP=Date.now(); await reloadPageModel();
      toast('Превью заменено'+(r.cropped?' — картинка была '+r.was+', обрезал по центру до 1200×630':'')+'. В Telegram оно обновится после бота @WebpageBot.',7000);
    };
    og.querySelector('[data-a="repl"]').onclick=()=>pickFile(up);
    wireDrop(og.querySelector('.drop'),{onFiles:up});
  }
}

function popList(anchor, html){
  const old=document.querySelector('.chkpop'); if(old){ old.remove(); return; }
  const pop=document.createElement('div'); pop.className='chkpop';
  pop.innerHTML=html;
  document.body.appendChild(pop);
  // под своим значком, в пределах колонки формы
  const r=anchor.getBoundingClientRect(), m=$('.main').getBoundingClientRect(), w=pop.offsetWidth;
  pop.style.top=Math.round(r.bottom+8)+'px';
  pop.style.left=Math.round(Math.max(m.left+12, Math.min(r.right-w, innerWidth-w-8)))+'px';
  pop.style.maxHeight=Math.max(160, innerHeight-r.bottom-24)+'px';
  setTimeout(()=>document.addEventListener('click',function off(e){
    if(!e.target.closest('.chkpop')&&e.target!==anchor){ pop.remove(); document.removeEventListener('click',off); }
  }),0);
  return pop;
}

const DEVS=Object.fromEntries(Guard.DEVS.map(d=>[d.id,{w:d.w,h:d.h,name:d.name.toLowerCase()}]));
let DEV=localStorage.getItem('cms.dev')||'web';
function fitDev(){
  const box=$('#devbox'), fr=$('#frame'), st=$('#stage');
  const {w:W,h:H}=DEVS[DEV];
  const availW=Math.max(120, st.clientWidth-30), availH=Math.max(120, st.clientHeight-30);
  const k=Math.min(1, availW/W, availH/H);
  box.style.width=Math.floor(W*k)+'px'; box.style.height=Math.floor(H*k)+'px';
  fr.style.width=W+'px'; fr.style.height=H+'px';
  fr.style.transform=k<1?'scale('+k+')':'none';
  // коротко — чтобы панель над превью помещалась в одну строку; полностью — в подсказке
  const pc=Math.round(k*100);
  $('#devnote').textContent=W+' × '+H+(pc<100?' · '+pc+'%':'');
  $('#devnote').title='Кадр '+W+' × '+H+' px — '+DEVS[DEV].name+', как на настоящем экране'+(pc<100?'. Показан в масштабе '+pc+'%: пропорции настоящие, это зум, а не сжатие.':'.');

}

// Тянем мышкой; двойной щелчок возвращает исходное. Ширину держим в

(function(){

  const put=pc=>{ app.style.setProperty('--prevw', pc.toFixed(2)+'%'); localStorage.setItem('cms.prevw',pc.toFixed(2)); fitDev(); };
  const saved=parseFloat(localStorage.getItem('cms.prevw'));
  if(saved>15 && saved<85) put(saved);
  let on=false;
  const move=e=>{ if(!on) return;
    const pc=(innerWidth-e.clientX)/innerWidth*100;
    put(Math.min(82, Math.max(18, pc))); };
  const up=()=>{ if(!on) return; on=false; g.classList.remove('drag');
    document.body.classList.remove('resizing'); fitDev(); };
  g.onmousedown=e=>{ e.preventDefault(); on=true; g.classList.add('drag'); document.body.classList.add('resizing'); };
  addEventListener('mousemove',move); addEventListener('mouseup',up);
  g.ondblclick=()=>{ localStorage.removeItem('cms.prevw'); app.style.removeProperty('--prevw'); fitDev(); };
})();

/* ── превью → форма ────────────────────────────────────────────────────────
   Эти функции зовёт cms/ui/live.js, когда на сайте справа что-то нажали. */

// поле формы по ключу: предпочитаем язык превью
function fieldEl(key){
  const sel=['k','pk','sh'].map(a=>'.rf[data-'+a+'="'+CSS.escape(key)+'"]').join(',');
  const all=[...$('#form').querySelectorAll(sel)];
  return all.find(e=>e.dataset.l===LANG) || all[0] || null;
}
// Открыть поле: развернуть его экран, прокрутить к нему, поставить курсор.
function focusField(key, fromPreview){
  const el=fieldEl(key);
  if(!el) return false;
  const f=el.closest('.f'), sec=el.closest('.sec');
  if(sec) unfold(sec);
  if(fromPreview) f.dataset.fromPreview='1';       // превью уже на месте — не дёргаем его обратно
  scrollMainTo(f);
  el.focus({preventScroll:true});
  // курсор в конец текста
  const r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  f.classList.add('flash'); setTimeout(()=>f.classList.remove('flash'),1300);
  return true;
}
// открыть раздел по цели из поиска или из клика и поставить курсор в поле
async function jump(t, key){
  if(t.type==='case'){ if(MODE==='case'&&CUR===t.n) return focusField(key); return open(t.n, key); }
  if(t.type==='page'){ if(MODE==='page'&&PAGE&&PAGE.file===t.file) return focusField(key); return openPage(t.file, key); }
  if(t.type==='shell'){ if(MODE==='shell') return focusField(key); return openShell(key); }
}
// кейс, стоящий на сайте N-м по порядку (номер карточки и строки таблицы)
const liveCase=pos=>MODEL.cases.filter(c=>c.status==='published')[pos-1];
const SHELL_KEY=/^(nav\.|ft\.(copy|top)$|skip$)/;
// Какое поле кейса стоит за надписью карточки или строки таблицы.
function caseKeyOf(key){
  const m=key.match(/^(c|wk\.)(\d+)\.(\w+)$/); if(!m) return null;
  const map = m[1]==='c' ? {title:'p.title',desc:'card.desc',role:'p.role',t1:'card.t1',t2:'card.t2',t3:'card.t3'}
                         : {t:'works.title',r:'works.role',c:'works.dir'};
  return {pos:+m[2], key:map[m[3]]||'p.title'};
}
window.cmsResolve=function(key){
  const el=fieldEl(key);
  if(el){ const lb=el.closest('.f').querySelector('.flb'); return {label:lb?lb.textContent:'', act:()=>focusField(key,true)}; }
  // подсказка темы менторства и прочие поля-атрибуты: ключ тот же, что у названия
  if(SHELL_KEY.test(key)) return {label:'Шапка и подвал', act:()=>jump({type:'shell'},key)};
  const ck=caseKeyOf(key);
  if(ck){ const c=liveCase(ck.pos); if(c) return {label:'Кейс '+c.n+' · '+(c.title||''), act:()=>jump({type:'case',n:c.n},ck.key)}; }
  return null;
};
window.cmsResolveMedia=function(el){
  const src=(el.getAttribute('src')||el.getAttribute('poster')||(el.querySelector&&el.querySelector('source')?el.querySelector('source').getAttribute('src'):'')||'');
  const name=src.replace(/^.*\//,'').replace(/\.(webp|mp4).*$/,'').replace(/-(480|960|1440)$/,'');
  // картинка или видео внутри кейса
  if(MODE==='case' && el.closest('.pcase__media')){
    const hit=$('#media') && [...$('#media').querySelectorAll('.mb')].find(mb=>{
      const m=DATA.media[+mb.dataset.i]; if(!m) return false;
      return m.type==='video' ? m.video===name||m.poster===name : m.type==='row' ? m.items.some(x=>x.src===name) : m.src===name; });
    if(hit) return {label:'Картинки и видео кейса', act:()=>{ unfold($('#secMedia')); scrollMainTo(hit); hit.classList.add('hot'); setTimeout(()=>hit.classList.remove('hot'),1300); }};
  }
  // карточка в сетке портфолио → обложка её кейса
  const card=el.closest('.case');
  if(card){
    const cards=[...card.parentNode.querySelectorAll('.case')], c=liveCase(cards.indexOf(card)+1);
    if(c) return {label:'Обложка кейса '+c.n, act:async()=>{ if(!(MODE==='case'&&CUR===c.n)) await open(c.n); const s=$('#secCover'); if(s){ unfold(s); scrollMainTo(s); } }};
  }
  // картинка самой страницы
  if(MODE==='page' && PAGE && PAGE.images){
    const c=$('#form').querySelector('.pimg[data-img="'+CSS.escape(name)+'"]');
    if(c) return {label:'Картинка страницы', act:()=>{ unfold(c.closest('.sec')); scrollMainTo(c); }};
  }
  return null;
};
// Ссылка в превью: открываем в CMS ту страницу сайта, куда она ведёт.
window.cmsRoute=function(pathname){
  let p=pathname.replace(/^\/Sergey-Lookin/,'').replace(/^\/en(?=\/|$)/,'')||'/';
  if(p==='/'||p==='/index.html') return jump({type:'page',file:'index.html'});
  const m=p.match(/^\/projects\/(\d\d)\.html$/);
  if(m && MODEL.cases.some(c=>c.n===m[1])) return jump({type:'case',n:m[1]});
  const f=p.slice(1);
  if(PAGES.some(x=>x.file===f)) return jump({type:'page',file:f});
  toast('Эта ссылка ведёт на страницу, которой нет в CMS: '+pathname, 3500);
};
window.cmsSetLang=l=>setLang(l);
// несохранённые правки на языке превью — чтобы кадр после перезагрузки показывал их
window.cmsDirtyValues=function(lang){
  if(!ORIG||!DIRTY) return [];
  const out=[];
  const dicts=(was,now)=>{ for(const k of Object.keys(now[lang]||{})) if(!same((was[lang]||{})[k],now[lang][k])) out.push({key:k,value:now[lang][k]??''}); };
  if(MODE==='case'&&DATA) dicts(ORIG.dict,DATA.dict);
  else if(MODE==='page'&&PAGE){
    dicts(ORIG.dict,PAGE.dict);
    for(const [id,v] of Object.entries(PAGE.attrs||{})){
      if(same(((ORIG.attrs||{})[id]||{})[lang],v[lang])) continue;
      const at=id.indexOf(':'), val=v[lang]??'';
      if(id.startsWith('@nav:')) out.push({nav:id.slice(5), value:val});
      else if(id.startsWith('@text:')){ const el=$('#form').querySelector('.rf[data-pa="'+CSS.escape(id)+'"]'); if(el) out.push({text:lang==='ru'?el.dataset.lru:el.dataset.len, value:val}); }
      else out.push({key:id.slice(at+1), attr:id.slice(1,at).replace(/-ru$/,'-'+lang), value:val});
    }
  } else if(MODE==='shell'&&SHELL) dicts(ORIG,SHELL);
  return out;
};

/* ── ширина текстовой рамки ────────────────────────────────────────────────
   То же, что потянуть рамку текста в Figma: строки переносятся раньше или позже.
   Ручка есть только там, где макет это выдерживает. Где ширину и кегль считает
   скрипт сайта или держит сетка (первый экран, «Принципы», таблицы, карусель),
   ручки нет — там перенос решает вёрстка. Шире своей колонки текст не станет. */
const NO_WIDTH='#hero,#credo,#mentor,#results,#ds,.tm-head,.sec-asides-bar,.page-title,[data-pressure],nav,footer,'
  + '.wk,.aud-row,.levels,.co-list,.hero-bottom,.cta-mega,.cta-head,.pcase__facts,.pcase__topgrid,.case,.brand-marquee,.bmp-top,.next-proj';
function widthTarget(key){
  const el=Live.find(key); if(!el) return null;
  const w=Live.win(); if(!w) return null;
  if(!/^(P|LI|H1|H2|H3|H4|BLOCKQUOTE|DIV)$/.test(el.tagName)) return null;
  if(w.getComputedStyle(el).display==='inline') return null;
  if(el.closest(NO_WIDTH)) return null;
  return el;
}
const widthMap=()=>MODE==='case' ? (DATA.widths=DATA.widths||{}) : (PAGE.widths=PAGE.widths||{});
function drawWidth(box){
  const key=box.dataset.wkey;
  const el=widthTarget(key);
  const map=widthMap();
  if(!el){ box.classList.remove('set'); box.innerHTML=''; return; }
  // ширина знака «0» в шрифте этой надписи — в ней меряется рамка
  const w=Live.win(), d=Live.doc();
  const probe=d.createElement('span');
  probe.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit';
  probe.textContent='0000000000'; el.appendChild(probe);
  const ch=probe.getBoundingClientRect().width/10 || 8; probe.remove();
  const room=Math.floor((el.parentElement.clientWidth||el.clientWidth)/ch);       // сколько знаков даёт колонка
  const cur=parseFloat(map[key]||'')||0;
  const now=cur||Math.round(el.getBoundingClientRect().width/ch);
  const min=14, max=Math.max(min+6, Math.min(140, room));
  box.classList.toggle('set',!!cur);
  box.innerHTML='<span>Ширина рамки</span>'
    + '<input type="range" min="'+min+'" max="'+max+'" step="1" value="'+Math.min(max,Math.max(min,now))+'">'
    + '<span class="wv">'+(cur?cur+' зн.':'как в макете')+'</span>'
    + (cur?'<button class="x" data-wreset>как в макете</button>':'')
    + '<button class="i" data-hint="Рамка текста, как в Figma: уже — строки короче и их больше, шире — наоборот. Мерится в знаках, поэтому одинаково работает на любом экране. Шире своей колонки текст не станет. На телефоне рамка обычно шире экрана и ничего не меняет.">i</button>';
  const range=box.querySelector('input'), wv=box.querySelector('.wv');
  const put=v=>{
    // сброс — пустое значение, а не удаление ключа: серверу надо знать, что рамку сняли
    map[key]=v||'';
    Live.setWidths(map); Live.setWidth(key, v);
    mark();
  };
  range.oninput=()=>{ wv.textContent=range.value+' зн.'; put(range.value+'ch'); box.classList.add('set'); };
  range.onchange=()=>drawWidth(box);
  const rs=box.querySelector('[data-wreset]');
  if(rs) rs.onclick=e=>{ e.preventDefault(); put(''); drawWidth(box); };
}

// ── поиск по всему сайту ────────────────────────────────────────────────
function wireSearch(){
  const inp=$('#findAll'), box=$('#found');
  let timer=null, items=[], cur=-1;
  const close=()=>{ box.hidden=true; cur=-1; };
  const paint=()=>box.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===cur));
  const pick=i=>{ const it=items[i]; if(!it) return; close(); inp.blur(); jump(it, it.key); };
  const run=async()=>{
    const q=inp.value.trim();
    if(q.length<2){ close(); return; }
    const r=await api('/api/search?q='+encodeURIComponent(q));
    if(inp.value.trim()!==q) return;                     // пока искали, запрос уже изменился
    items=r.items||[];
    const hl=s=>{ const t=esc(s), i=t.toLowerCase().indexOf(esc(q).toLowerCase());
      return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+esc(q).length)+'</mark>'+t.slice(i+esc(q).length); };
    box.innerHTML = items.length
      ? items.map((it,i)=>'<button data-i="'+i+'"><span class="w">'+esc(it.where)+' · '+esc(it.label)+(it.lang==='en'?' · EN':'')+'</span><span class="s">'+hl(it.snippet)+'</span></button>').join('')
        + (r.total>items.length?'<div class="none">показаны первые '+items.length+' из '+r.total+' — уточни запрос</div>':'')
      : '<div class="none">Ничего не найдено. Поиск идёт по текстам всех страниц и кейсов, на русском и английском.</div>';
    box.hidden=false; cur=-1;
  };
  inp.oninput=()=>{ clearTimeout(timer); timer=setTimeout(run,220); };
  inp.onfocus=()=>{ if(inp.value.trim().length>=2) run(); };
  inp.onkeydown=e=>{
    if(e.key==='Escape'){ close(); inp.blur(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); cur=Math.min(items.length-1,cur+1); paint(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cur=Math.max(0,cur-1); paint(); }
    else if(e.key==='Enter'){ e.preventDefault(); pick(cur<0?0:cur); }
  };
  box.onclick=e=>{ const b=e.target.closest('[data-i]'); if(b) pick(+b.dataset.i); };
  document.addEventListener('mousedown',e=>{ if(!e.target.closest('.findbox')) close(); });
  // Ctrl+K — в поиск из любого места
  addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&(e.code==='KeyK')){ e.preventDefault(); inp.focus(); inp.select(); } });
}

/* ── проверка вёрстки ──────────────────────────────────────────────────────
   Два слоя. Быстрый — прямо в превью, пока печатаешь: смотрит только текущую
   ширину и язык. Полный — после сохранения и перед публикацией: три ширины,
   два языка, сравнение с опубликованной версией (cms/ui/guard.js). */
let GUARD={state:'idle', problems:[], pages:[]};
let liveBase=null, liveTimer=null;

function guardReset(){ GUARD={state:'idle',problems:[],pages:[]}; paintGuard(); }
// название поля по ключу — для текста замечания
function guardName(k){
  if(KLABEL[k]) return KLABEL[k];
  if(SHELL_KEY.test(k)) return 'шапка: '+k.replace(/^nav\./,'');
  const ck=caseKeyOf(k); if(ck){ const c=liveCase(ck.pos); return (k.startsWith('c')?'карточка':'строка таблицы')+' кейса '+(c?c.n:ck.pos); }
  return k;
}
function paintGuard(){
  const b=$('#guardBadge'), n=GUARD.problems.length;
  b.classList.remove('ok','busy','err');
  if(GUARD.state==='idle'){ b.classList.remove('on'); return; }
  b.classList.add('on');
  if(GUARD.state==='busy'){ b.classList.add('busy'); b.textContent='Проверяю вёрстку… '+(GUARD.progress||''); b.onclick=null; return; }
  if(!n){ b.classList.add('ok'); b.textContent='✓ Вёрстка цела'; b.onclick=()=>toast('Проверено '+GUARD.views+' видов: десктоп, планшет и телефон, на русском и английском. Новых поломок нет.',5000); return; }
  b.classList.add('err'); b.textContent='✗ Вёрстка: '+n;
  b.onclick=()=>{ const pop=popList(b, guardListHTML(GUARD.problems)); if(pop) wireGuardList(pop, GUARD.problems); };
}
function guardListHTML(list){
  return '<p class="gnote">Этого не было в опубликованной версии. Нажми «Показать» — превью откроет то место на нужном устройстве и языке.</p>'
    + list.map((p,i)=>'<div class="gitem"><span class="gw">'+p.dev.name+' · '+p.lang.toUpperCase()+(p.page?'<br>'+esc(p.page):'')+'</span><span>'+esc(Guard.describe(p,guardName))+'</span>'
      + (p.key?'<button class="x" data-g="'+i+'">Показать</button>':'')+'</div>').join('');
}
function wireGuardList(root, list){
  root.addEventListener('click',async e=>{
    const b=e.target.closest('[data-g]'); if(!b) return;
    const p=list[+b.dataset.g];
    const veil=b.closest('.veil'); if(veil) veil.remove();
    const pop=b.closest('.chkpop'); if(pop) pop.remove();
    if(p.path && p.path!==(previewPath()==='/'?'/index.html':previewPath())) await cmsRoute(p.path);
    setDev(p.dev.id);
    if(LANG!==p.lang) setLang(p.lang);
    window.__afterFrame=()=>{ Live.reveal(p.key); focusField(p.key,true); };
    refreshPreview();
  });
}
const pageTitleOf=path=>{
  const f=path.replace(/^\//,'');
  const pg=PAGES.find(x=>x.file===f); if(pg) return pg.label;
  const m=f.match(/^projects\/(\d\d)\.html$/); if(m){ const c=MODEL.cases.find(x=>x.n===m[1]); return 'Кейс '+m[1]+(c?' · '+(c.title||''):''); }
  return f;
};
// Полная проверка списка страниц. Возвращает найденные проблемы.
let guardSeq=0;
async function guardRun(paths, onProgress){
  const my=++guardSeq;
  GUARD={state:'busy',problems:[],pages:paths,progress:''}; paintGuard();
  const problems=[]; let views=0, done=0;
  const total=paths.length*6;
  for(const path of paths){
    const r=await Guard.check(path,(n)=>{ GUARD.progress=(done+n)+' из '+total; if(my===guardSeq) paintGuard(); if(onProgress) onProgress(done+n,total); });
    done+=6; views+=r.views;
    for(const p of r.problems) problems.push({...p, path, page:paths.length>1?pageTitleOf(path):''});
    if(my!==guardSeq) return problems;               // пока проверяли, запустили новую
  }
  GUARD={state:'done',problems,pages:paths,views}; paintGuard();
  if(problems.length) toast('Проверка вёрстки нашла '+problems.length+' '+plural(problems.length,['проблему','проблемы','проблем'])+' — значок вверху формы.',5200);
  return problems;
}
// Кадр превью загрузился и улёгся: запоминаем его состояние как точку отсчёта.
window.cmsFrameReady=function(){
  const d=Live.doc();
  try{ liveBase = d ? new Set(Guard.scan(d).map(x=>x.sig)) : null; }catch(e){ liveBase=null; }
  const cb=window.__afterFrame; window.__afterFrame=null; if(cb) setTimeout(cb,250);
  const ed=document.querySelector('.f.editing .wctl'); if(ed) drawWidth(ed);
};
// Превью изменилось от правки — смотрим, не сломалось ли что-то на этой ширине.
window.cmsLiveChanged=function(){
  clearTimeout(liveTimer);
  liveTimer=setTimeout(()=>{
    const d=Live.doc(); if(!d||!liveBase) return;
    let fresh=[];
    try{ fresh=Guard.scan(d).filter(x=>!liveBase.has(x.sig) && x.type!=='broken'); }catch(e){ return; }
    const note=$('#liveNote');
    if(!fresh.length){ if(note) note.remove(); return; }
    const txt=fresh.slice(0,2).map(p=>Guard.describe(p,guardName)).join(' ')+(fresh.length>2?' И ещё '+(fresh.length-2)+'.':'');
    const f=document.querySelector('.f.editing')||$('#form').firstElementChild;
    let n=note; if(!n){ n=document.createElement('div'); n.id='liveNote'; n.className='chk err'; n.style.margin='7px 0 0'; }
    n.innerHTML='<span class="n">'+DEVS[DEV].name+' · '+LANG.toUpperCase()+'</span><span>'+esc(txt)+'</span>';
    if(f && n.parentNode!==f) f.appendChild(n);
  }, 420);
};

/* ── правила ── */
/* После отправки сборка на GitHub идёт ещё пару минут. Показываем, где она,
   и когда правки реально стали видны на сайте. */
let deployTimer=null;
function watchDeploy(){
  const bar=$('#deployBar');
  clearInterval(deployTimer);
  let ticks=0;
  const paint=(cls,html)=>{ bar.hidden=false; bar.className='deploybar'+(cls?' '+cls:''); bar.innerHTML=html; };
  paint('', '<span class="dot2"></span><span>Отправлено. GitHub собирает сайт…</span><span class="sp"></span>');
  const check=async()=>{
    ticks++;
    let d; try{ d=await api('/api/deploy'); }catch(e){ return; }
    if(d.unknown){ paint('', '<span class="dot2"></span><span>Отправлено. Состояние сборки узнать не удалось'+(d.why?' ('+d.why+')':'')+'.</span><span class="sp"></span><button class="btn" onclick="this.closest(\'.deploybar\').hidden=true">Скрыть</button>'); clearInterval(deployTimer); return; }
    if(d.status!=='completed'){
      paint('', '<span class="dot2"></span><span>Собирается версия '+esc(d.sha)+'…</span><span class="sp"></span><a href="'+d.url+'" target="_blank">смотреть на GitHub ↗</a>');
    } else if(d.conclusion==='success'){
      paint('ok', '<span class="dot2"></span><span>Опубликовано. Правки на сайте.</span><span class="sp"></span><a href="'+d.site+'" target="_blank">открыть сайт ↗</a><button class="btn" onclick="this.closest(\'.deploybar\').hidden=true">Скрыть</button>');
      clearInterval(deployTimer);
    } else {
      paint('bad', '<span class="dot2"></span><span>Сборка не прошла ('+esc(String(d.conclusion))+'). На сайте осталась прежняя версия.</span><span class="sp"></span><a href="'+d.url+'" target="_blank">посмотреть почему ↗</a>');
      clearInterval(deployTimer);
    }
    if(ticks>24) clearInterval(deployTimer);   // около шести минут и хватит
  };
  check();
  deployTimer=setInterval(check, 15000);
}
