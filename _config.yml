# Что НЕ публиковать на сайте.
#
# Зачем этот файл: GitHub Pages собирает сайт из ветки main напрямую (Jekyll),
# а не из папки _site, которую готовит .github/workflows/deploy.yml. Поэтому
# список --exclude в том воркфлоу до сайта не доезжает, и всё, что лежит
# в репозитории, оказывается доступно по прямой ссылке. Проверено:
# tools/build-en.mjs и package.json отдавались с кодом 200.
#
# ИСТОЧНИК ПЕРЕКЛЮЧЁН на «GitHub Actions» 10.09.2026 — теперь работает список
# исключений в deploy.yml, и он же главный. Этот файл оставлен подстраховкой:
# если источник когда-нибудь вернут на ветку, защита снова окажется здесь.

exclude:
  - cms/            # редактор: движок, интерфейс, .bat — только для локальной машины
  - tools/          # скрипты сборки
  - content/       # реестр кейсов, исходные данные
  - package.json
  - package-lock.json
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - vendor/
